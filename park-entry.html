<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Park</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; }
  @keyframes pp-road { to { background-position: -48px 0; } }
  @keyframes pp-cloud { from { transform: translateX(0); } to { transform: translateX(-120%); } }
  @keyframes pp-tree { from { transform: translateX(0); } to { transform: translateX(calc(-100% - 60px)); } }
  @keyframes pp-shine { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
  .pp-card {
    display: block; position: relative; width: 100%; height: 100vh; overflow: hidden;
    text-decoration: none; font-family: 'Space Mono', monospace;
    background: linear-gradient(#ffb066 0%, #ff8a4c 46%, #f4602a 100%);
    transition: transform .35s cubic-bezier(.7,0,.2,1);
  }
  .pp-card:hover { transform: scale(1.015); }
  .pp-card:hover .pp-arrow { transform: translateX(4px); }
</style>
</head>
<body>
<a class="pp-card" id="ppCard" href="#" target="_top">

  <div style="position: absolute; top: 16%; right: 14%; width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #fff3d6, #ffd98a); box-shadow: 0 0 36px 8px rgba(255,221,138,.55); animation: pp-shine 5s ease-in-out infinite;"></div>

  <div style="position: absolute; top: 18%; left: 0; width: 200%; height: 30px; opacity: .55;">
    <div style="position: absolute; left: 30%; width: 64px; height: 18px; border-radius: 20px; background: #fff2e2; animation: pp-cloud 16s linear infinite;"></div>
    <div style="position: absolute; left: 70%; width: 48px; height: 14px; border-radius: 20px; background: #fff2e2; animation: pp-cloud 22s linear infinite;"></div>
  </div>

  <div style="position: absolute; bottom: 30%; left: 0; right: 0; height: 34px; overflow: hidden;">
    <div style="position: absolute; bottom: 0; left: 0; display: flex; gap: 60px; animation: pp-tree 7s linear infinite; will-change: transform;">
      <span style="width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:30px solid #6f9a33;"></span>
      <span style="width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:24px solid #5a7d2a;"></span>
      <span style="width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:32px solid #86a93f;"></span>
      <span style="width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:26px solid #6f9a33;"></span>
      <span style="width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:30px solid #5a7d2a;"></span>
      <span style="width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:24px solid #86a93f;"></span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: #4a3326; box-shadow: inset 0 3px 0 rgba(255,255,255,.08);"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: calc(15% - 3px); height: 6px; background-image: repeating-linear-gradient(90deg, #ffd23f 0 26px, transparent 26px 48px); background-size: 48px 100%; animation: pp-road .5s linear infinite;"></div>

  <canvas id="ppCar" style="position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%); width: 50%; max-width: 250px; height: 56%; display: block;"></canvas>

  <div style="position: absolute; top: 7%; left: 4%; right: 4%; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;">
    <div>
      <div style="font-family: 'Syne', sans-serif; font-weight: 800; font-size: clamp(15px, 4vw, 20px); line-height: 1; color: #fff6e9; letter-spacing: -0.01em; text-shadow: 0 2px 0 rgba(150,50,10,.4);">Portfolio Park</div>
      <div style="margin-top: 5px; font-size: clamp(9px, 2.4vw, 11px); letter-spacing: 0.06em; color: rgba(255,246,233,.92); text-shadow: 0 1px 2px rgba(120,40,10,.4);">a 3D world of things I've made</div>
    </div>
    <div style="flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; background: #fff6e9; color: #c44417; font-family: 'Syne', sans-serif; font-weight: 800; font-size: clamp(10px, 2.6vw, 12px); white-space: nowrap;">Drive in <span class="pp-arrow" style="display:inline-block;transition:transform .3s ease;">&rarr;</span></div>
  </div>

</a>

<script>
(function () {
  // ---- WHERE THE CARD LINKS TO. Change this to your hosted game URL. ----
  document.getElementById('ppCard').setAttribute('href', 'portfolio-park.html');

  function boot() {
    if (!window.THREE) { setTimeout(boot, 40); return; }
    var THREE = window.THREE, canvas = document.getElementById('ppCar');
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setClearColor(0x000000, 0);

    var scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight(0xffe6cc, 0xd24f1e, 1.05));
    var dir = new THREE.DirectionalLight(0xfff2e0, 0.85); dir.position.set(6, 10, 8); scene.add(dir);
    var rim = new THREE.DirectionalLight(0xffd6a0, 0.4); rim.position.set(-8, 4, -6); scene.add(rim);

    var wheels = [];
    var car = makeCar(THREE, wheels); scene.add(car);

    var shadow = new THREE.Mesh(new THREE.CircleGeometry(2.4, 24),
      new THREE.MeshBasicMaterial({ color: 0x5a230c, transparent: true, opacity: 0.26, depthWrite: false }));
    shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.02; scene.add(shadow);

    var camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
    camera.position.set(7.5, 4.6, 8.5); camera.lookAt(0, 0.9, 0);

    var t0 = performance.now();
    (function loop() {
      requestAnimationFrame(loop);
      var w = canvas.clientWidth, h = canvas.clientHeight, pr = renderer.getPixelRatio();
      if (canvas.width !== Math.round(w * pr) || canvas.height !== Math.round(h * pr)) {
        renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
      }
      var t = (performance.now() - t0) * 0.001;
      car.rotation.y = -0.5 + Math.sin(t * 0.5) * 0.5;
      car.position.y = Math.sin(t * 2.2) * 0.05;
      for (var i = 0; i < wheels.length; i++) wheels[i].rotation.x = -t * 6;
      renderer.render(scene, camera);
    })();
  }

  function makeCar(THREE, wheels) {
    var g = new THREE.Group();
    var silver = new THREE.MeshPhongMaterial({ color: 0xc9ced3, shininess: 90, specular: 0xb4bac0 });
    var glass = new THREE.MeshPhongMaterial({ color: 0x0e1014, shininess: 110, specular: 0x556070 });
    var black = new THREE.MeshLambertMaterial({ color: 0x191b1f });
    var chrome = new THREE.MeshPhongMaterial({ color: 0xcfd4d9, shininess: 130, specular: 0xffffff });
    function add(geo, mat, x, y, z, rx, ry, rz) {
      var m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
      if (rx) m.rotation.x = rx; if (ry) m.rotation.y = ry; if (rz) m.rotation.z = rz;
      g.add(m); return m;
    }
    function Box(w, h, d) { return new THREE.BoxGeometry(w, h, d); }

    add(Box(1.86, 0.5, 4.2), silver, 0, 0.66, 0);
    add(Box(1.74, 0.42, 3.95), silver, 0, 1.04, -0.05);
    add(Box(1.72, 0.14, 1.45), silver, 0, 1.12, 1.42, -0.16);
    add(Box(1.66, 0.14, 0.95), silver, 0, 1.16, -1.72, 0.34);
    add(Box(1.6, 0.6, 1.95), glass, 0, 1.5, -0.15);
    add(Box(1.56, 0.66, 0.1), glass, 0, 1.52, 0.86, 0.56);
    add(Box(1.5, 0.56, 0.1), glass, 0, 1.5, -1.12, -0.62);
    add(Box(0.06, 0.42, 1.7), glass, 0.8, 1.55, -0.12);
    add(Box(0.06, 0.42, 1.7), glass, -0.8, 1.55, -0.12);
    add(Box(1.46, 0.16, 1.35), silver, 0, 1.82, -0.28);
    add(Box(1.66, 0.05, 3.4), chrome, 0, 1.26, -0.05);
    add(Box(1.02, 0.82, 0.06), chrome, 0, 0.72, 2.07);
    add(Box(0.86, 0.66, 0.1), black, 0, 0.7, 2.1);
    for (var i = 0; i < 3; i++) add(Box(0.82, 0.03, 0.12), chrome, 0, 0.52 + i * 0.18, 2.12);
    var hl = new THREE.MeshPhongMaterial({ color: 0xeaf2ff, emissive: 0x39455e });
    add(Box(0.62, 0.24, 0.12), hl, 0.66, 1.0, 2.0, 0, -0.32);
    add(Box(0.62, 0.24, 0.12), hl, -0.66, 1.0, 2.0, 0, 0.32);
    add(Box(1.3, 0.22, 0.18), black, 0, 0.4, 2.08);
    var tl = new THREE.MeshPhongMaterial({ color: 0xcc2418, emissive: 0x44090a });
    add(Box(0.58, 0.26, 0.1), tl, 0.62, 1.04, -2.07);
    add(Box(0.58, 0.26, 0.1), tl, -0.62, 1.04, -2.07);
    add(Box(1.92, 0.26, 0.34), black, 0, 0.36, 1.96);
    add(Box(1.92, 0.26, 0.34), black, 0, 0.36, -1.96);
    add(Box(0.1, 0.22, 3.0), black, 0.92, 0.42, 0);
    add(Box(0.1, 0.22, 3.0), black, -0.92, 0.42, 0);
    add(Box(0.3, 0.16, 0.26), silver, 1.04, 1.34, 0.74);
    add(Box(0.3, 0.16, 0.26), silver, -1.04, 1.34, 0.74);
    var tire = new THREE.CylinderGeometry(0.52, 0.52, 0.36, 18);
    var tireMat = new THREE.MeshLambertMaterial({ color: 0x111114 });
    var alloy = new THREE.MeshPhongMaterial({ color: 0xb9bfc5, shininess: 80, specular: 0xffffff });
    var capMat = new THREE.MeshPhongMaterial({ color: 0x2a2d33 });
    var pos = [[1.0, 1.32], [-1.0, 1.32], [1.0, -1.32], [-1.0, -1.32]];
    for (var j = 0; j < pos.length; j++) {
      var wg = new THREE.Group();
      var w = new THREE.Mesh(tire, tireMat); w.rotation.z = Math.PI / 2; wg.add(w);
      var face = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.38, 6), alloy); face.rotation.z = Math.PI / 2; wg.add(face);
      var cap = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.4, 8), capMat); cap.rotation.z = Math.PI / 2; wg.add(cap);
      wg.position.set(pos[j][0], 0.52, pos[j][1]); g.add(wg); wheels.push(wg);
    }
    return g;
  }

  boot();
})();
</script>
</body>
</html>
