<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Car Shop — Portfolio Park</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@800&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1c2230; height: 100%; }
  body { font-family: 'Space Mono', monospace; color: #e7edf3; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  .pill {
    position: fixed; z-index: 9; padding: 9px 14px; border-radius: 999px;
    border: 1px solid #3a4761; background: rgba(30,38,54,.85); color: #e7edf3;
    font: 700 12px 'Space Mono', monospace; letter-spacing: 0.05em; text-decoration: none; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #back-link { top: 22px; left: 24px; }
  #fs-toggle  { top: 22px; right: 24px; }
  #tilt-toggle{ top: 62px; right: 24px; display: none; }
  body.mobile #tilt-toggle { display: block; }
  #pick { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); z-index: 9; display: flex; gap: 8px; }
  #pick .opt { padding: 9px 16px; border-radius: 999px; border: 1px solid #3a4761; background: rgba(30,38,54,.85); color: #e7edf3;
    font: 800 13px 'Syne', sans-serif; letter-spacing: 0.03em; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #pick .opt.sel { background: #f08a3c; border-color: #f08a3c; color: #1c2230; }

  #hud { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 8; padding: 10px 18px; border-radius: 12px;
    background: rgba(30,38,54,.82); border: 1px solid #3a4761; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); text-align: center; }
  #hud .lab { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #8ea0b8; font-weight: 700; }
  #hud .val { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; color: #fff; }

  #start { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 38%, rgba(40,52,74,.85), rgba(16,20,30,.95)); cursor: pointer; animation: fadeOver .4s ease both; }
  #start .panel { text-align: center; padding: 36px; max-width: 480px; }
  #start .tag { font-size: 11px; letter-spacing: 0.18em; color: #f0a35c; font-weight: 700; margin-bottom: 12px; }
  #start h1 { font: 800 clamp(40px, 8vw, 78px)/.95 'Syne', sans-serif; color: #fff; letter-spacing: -0.03em; margin: 0 0 14px; }
  #start p { margin: 0 auto 22px; max-width: 400px; font-size: 14px; line-height: 1.6; color: #b8c4d4; }
  #start .go { display: inline-block; padding: 14px 30px; border-radius: 999px; background: #f08a3c; color: #1c2230; font: 800 16px 'Syne', sans-serif; }
  @keyframes fadeOver { from { opacity: 0; } to { opacity: 1; } }

  .ctrl { position: fixed; z-index: 9; width: 66px; height: 66px; border-radius: 50%; border: 1px solid #3a4761; background: rgba(30,38,54,.86); color: #e7edf3;
    font-size: 26px; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; box-shadow: 0 5px 14px -5px rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
  .ctrl.active { background: #f08a3c; color: #1c2230; }
  #ctrl-up { bottom: 100px; right: 24px; } #ctrl-down { bottom: 24px; right: 24px; }
  #ctrl-left { bottom: 24px; left: 24px; } #ctrl-right { bottom: 24px; left: 100px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="page-fade" style="position:fixed;inset:0;z-index:99999;background:#1c2230;opacity:1;transition:opacity .55s ease;pointer-events:none;will-change:opacity"></div>

<a id="back-link" class="pill" href="portfolio_park.html" onclick="event.preventDefault(); window.__fadeNav(this.href); return false;">← save &amp; return</a>
<button id="fs-toggle" class="pill" type="button">⛶ Fullscreen</button>
<button id="tilt-toggle" class="pill" type="button">📱 Tilt OFF</button>

<div id="pick">
  <button class="opt" id="opt-classic" type="button">🚗 Classic</button>
  <button class="opt" id="opt-ferrari" type="button">🏎️ Ferrari</button>
</div>

<div id="hud"><div class="lab">Now driving</div><div class="val" id="sel-val">Classic</div></div>

<div id="start">
  <div class="panel">
    <div class="tag">GARAGE</div>
    <h1>CAR SHOP</h1>
    <p>Drive up to a car to switch to it — or tap a name up top. Your pick sticks across the park, the coast and the airport. Leave whenever you like.</p>
    <div class="go">Enter the showroom →</div>
  </div>
</div>

<button id="ctrl-up"    class="ctrl">↑</button>
<button id="ctrl-down"  class="ctrl">↓</button>
<button id="ctrl-left"  class="ctrl">←</button>
<button id="ctrl-right" class="ctrl">→</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
<script>
(() => {
  const THREE = window.THREE;
  if (!THREE) { document.getElementById('start').innerHTML = '<div class="panel"><h1>3D failed to load</h1></div>'; return; }

  const _pf = document.getElementById('page-fade');
  if (_pf) requestAnimationFrame(() => requestAnimationFrame(() => { _pf.style.opacity = '0'; }));
  window.__fadeNav = function (u) { if (_pf) { _pf.style.pointerEvents = 'auto'; _pf.style.opacity = '1'; setTimeout(() => { window.location.href = u; }, 560); } else { window.location.href = u; } };

  const RESUME_RET = new URLSearchParams(window.location.search).get('ret');
  const PARK_BACK = RESUME_RET ? ('portfolio_park.html?resume=' + encodeURIComponent(RESUME_RET)) : 'portfolio_park.html';
  { const bl = document.getElementById('back-link'); if (bl) bl.setAttribute('href', PARK_BACK); }

  const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (isMobile) document.body.classList.add('mobile');

  // ----- car preference (shared across all spaces) -----
  function carKind() { try { return localStorage.getItem('pp_car') || sessionStorage.getItem('pp_car') || 'classic'; } catch (_) { return 'classic'; } }
  function setCar(id) { try { localStorage.setItem('pp_car', id); } catch (_) {} try { sessionStorage.setItem('pp_car', id); } catch (_) {} }

  // ----- renderer / scene / camera -----
  const canvas = document.getElementById('cv');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  const sc = new THREE.Scene();
  sc.fog = new THREE.Fog(0x1c2230, 70, 200);
  const cam = new THREE.PerspectiveCamera(58, 1, 0.5, 600);
  cam.position.set(0, 12, -26);
  function resize() { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  window.addEventListener('resize', resize); resize();

  // ----- lights (showroom) -----
  sc.add(new THREE.HemisphereLight(0xdfe8f2, 0x20283a, 0.8));
  const key = new THREE.DirectionalLight(0xffffff, 0.7); key.position.set(30, 50, 20); sc.add(key);
  const rim = new THREE.DirectionalLight(0x9fb6d6, 0.35); rim.position.set(-30, 30, -40); sc.add(rim);
  // two warm spotlights over the pedestals
  for (const px of [-14, 14]) { const sp = new THREE.PointLight(0xfff0d8, 0.7, 60); sp.position.set(px, 16, 22); sc.add(sp); }

  // ----- materials -----
  const matFloor = new THREE.MeshLambertMaterial({ color: 0x2a3346 });
  const matFloor2 = new THREE.MeshLambertMaterial({ color: 0x313c52 });
  const matWall = new THREE.MeshLambertMaterial({ color: 0x222a3a });
  const matPed = new THREE.MeshLambertMaterial({ color: 0x121722 });
  const matRing = new THREE.MeshBasicMaterial({ color: 0xf08a3c });
  const matRingDim = new THREE.MeshBasicMaterial({ color: 0x46506a });
  const matStrip = new THREE.MeshBasicMaterial({ color: 0x3a4660 });

  // ----- car builders (must match the other spaces) -----
  function makeClassicCar() {
    const g = new THREE.Group();
    const silver = new THREE.MeshPhongMaterial({ color: 0xc9ced3, shininess: 90, specular: 0xb4bac0 });
    const glass = new THREE.MeshPhongMaterial({ color: 0x0e1014, shininess: 110, specular: 0x556070 });
    const black = new THREE.MeshLambertMaterial({ color: 0x191b1f });
    const chrome = new THREE.MeshPhongMaterial({ color: 0xcfd4d9, shininess: 130, specular: 0xffffff });
    const add = (geo, mat, x, y, z, rx, ry, rz) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); if (rx) m.rotation.x = rx; if (ry) m.rotation.y = ry; if (rz) m.rotation.z = rz; g.add(m); return m; };
    const Box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
    add(Box(1.86, 0.5, 4.2), silver, 0, 0.66, 0);
    add(Box(1.74, 0.42, 3.95), silver, 0, 1.04, -0.05);
    add(Box(1.72, 0.14, 1.45), silver, 0, 1.12, 1.42, -0.16);
    add(Box(1.66, 0.14, 0.95), silver, 0, 1.16, -1.72, 0.34);
    add(Box(1.6, 0.6, 1.95), glass, 0, 1.5, -0.15);
    add(Box(1.56, 0.66, 0.1), glass, 0, 1.52, 0.86, 0.56);
    add(Box(1.5, 0.56, 0.1), glass, 0, 1.5, -1.12, -0.62);
    add(Box(1.46, 0.16, 1.35), silver, 0, 1.82, -0.28);
    add(Box(1.66, 0.05, 3.4), chrome, 0, 1.26, -0.05);
    add(Box(1.02, 0.82, 0.06), chrome, 0, 0.72, 2.07);
    add(Box(0.86, 0.66, 0.1), black, 0, 0.7, 2.1);
    const hl = new THREE.MeshPhongMaterial({ color: 0xeaf2ff, emissive: 0x39455e });
    add(Box(0.62, 0.24, 0.12), hl, 0.66, 1.0, 2.0, 0, -0.32);
    add(Box(0.62, 0.24, 0.12), hl, -0.66, 1.0, 2.0, 0, 0.32);
    const tl = new THREE.MeshPhongMaterial({ color: 0xcc2418, emissive: 0x44090a });
    add(Box(0.58, 0.26, 0.1), tl, 0.62, 1.04, -2.07);
    add(Box(0.58, 0.26, 0.1), tl, -0.62, 1.04, -2.07);
    add(Box(1.92, 0.26, 0.34), black, 0, 0.36, 1.96);
    add(Box(1.92, 0.26, 0.34), black, 0, 0.36, -1.96);
    add(Box(0.3, 0.16, 0.26), silver, 1.04, 1.34, 0.74);
    add(Box(0.3, 0.16, 0.26), silver, -1.04, 1.34, 0.74);
    const tire = new THREE.CylinderGeometry(0.52, 0.52, 0.36, 18);
    const tireMat = new THREE.MeshLambertMaterial({ color: 0x111114 });
    const alloy = new THREE.MeshPhongMaterial({ color: 0xb9bfc5, shininess: 80, specular: 0xffffff });
    [[1.0, 1.32], [-1.0, 1.32], [1.0, -1.32], [-1.0, -1.32]].forEach(([wx, wz]) => {
      const w = new THREE.Mesh(tire, tireMat); w.rotation.z = Math.PI / 2; w.position.set(wx, 0.52, wz); g.add(w);
      const face = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.38, 6), alloy); face.rotation.z = Math.PI / 2; face.position.set(wx, 0.52, wz); g.add(face);
    });
    return g;
  }
  function makeFerrari() {
    const g = new THREE.Group();
    const red    = new THREE.MeshPhongMaterial({ color: 0xd11414, shininess: 120, specular: 0xff8a7a });
    const dark   = new THREE.MeshLambertMaterial({ color: 0x141519 });
    const glass  = new THREE.MeshPhongMaterial({ color: 0x0c0e12, shininess: 120, specular: 0x556070 });
    const chrome = new THREE.MeshPhongMaterial({ color: 0xcfd4d9, shininess: 130, specular: 0xffffff });
    const add = (geo, mat, x, y, z, rx, ry, rz) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); if (rx) m.rotation.x = rx; if (ry) m.rotation.y = ry; if (rz) m.rotation.z = rz; g.add(m); return m; };
    const Box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
    add(Box(1.9, 0.34, 4.4), red, 0, 0.52, 0);
    add(Box(1.74, 0.2, 1.5), red, 0, 0.6, 1.62, -0.12);
    add(Box(2.0, 0.06, 0.5), dark, 0, 0.34, 2.18);
    add(Box(1.84, 0.4, 2.2), red, 0, 0.82, -0.1);
    add(Box(1.98, 0.46, 1.7), red, 0, 0.74, -1.45);
    add(Box(1.3, 0.44, 1.5), glass, 0, 1.12, -0.02);
    add(Box(1.28, 0.46, 0.1), glass, 0, 1.06, 0.74, 0.62);
    add(Box(1.18, 0.12, 1.0), red, 0, 1.34, -0.22);
    add(Box(1.2, 0.4, 0.1), glass, 0, 1.04, -0.96, -0.6);
    for (let i = 0; i < 4; i++) add(Box(1.0, 0.03, 0.1), dark, 0, 1.0, -1.0 - i * 0.22);
    add(Box(0.3, 0.34, 1.0), dark, 0.96, 0.86, -1.0);
    add(Box(0.3, 0.34, 1.0), dark, -0.96, 0.86, -1.0);
    add(Box(0.12, 0.18, 2.6), dark, 0.95, 0.44, 0);
    add(Box(0.12, 0.18, 2.6), dark, -0.95, 0.44, 0);
    const hl = new THREE.MeshPhongMaterial({ color: 0xeaf2ff, emissive: 0x39455e });
    add(Box(0.5, 0.1, 0.12), hl, 0.62, 0.8, 2.0, 0, -0.28);
    add(Box(0.5, 0.1, 0.12), hl, -0.62, 0.8, 2.0, 0, 0.28);
    add(Box(0.5, 0.2, 0.18), dark, 0.56, 0.46, 2.12);
    add(Box(0.5, 0.2, 0.18), dark, -0.56, 0.46, 2.12);
    add(Box(0.22, 0.12, 0.18), red, 0.92, 1.0, 0.5);
    add(Box(0.22, 0.12, 0.18), red, -0.92, 1.0, 0.5);
    add(Box(0.08, 0.34, 0.3), dark, 0.7, 1.12, -1.95);
    add(Box(0.08, 0.34, 0.3), dark, -0.7, 1.12, -1.95);
    add(Box(1.7, 0.06, 0.46), dark, 0, 1.32, -1.98);
    const tl = new THREE.MeshPhongMaterial({ color: 0xcc1a14, emissive: 0x55100c });
    add(new THREE.CylinderGeometry(0.16, 0.16, 0.1, 16), tl, 0.6, 0.92, -2.16, Math.PI / 2);
    add(new THREE.CylinderGeometry(0.16, 0.16, 0.1, 16), tl, -0.6, 0.92, -2.16, Math.PI / 2);
    add(Box(1.8, 0.24, 0.3), dark, 0, 0.36, -2.08);
    [-0.36, -0.14, 0.14, 0.36].forEach(ex => add(new THREE.CylinderGeometry(0.07, 0.07, 0.18, 12), chrome, ex, 0.46, -2.2, Math.PI / 2));
    const tire = new THREE.CylinderGeometry(0.56, 0.56, 0.42, 22);
    const tireMat = new THREE.MeshLambertMaterial({ color: 0x0f1012 });
    const alloy = new THREE.MeshPhongMaterial({ color: 0x32353b, shininess: 90, specular: 0xffffff });
    const caliper = new THREE.MeshLambertMaterial({ color: 0xcc1a1a });
    [[1.0, 1.4], [-1.0, 1.4], [1.0, -1.4], [-1.0, -1.4]].forEach(([wx, wz]) => {
      const w = new THREE.Mesh(tire, tireMat); w.rotation.z = Math.PI / 2; w.position.set(wx, 0.56, wz); g.add(w);
      const face = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.44, 6), alloy); face.rotation.z = Math.PI / 2; face.position.set(wx, 0.56, wz); g.add(face);
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.46, 8), chrome); cap.rotation.z = Math.PI / 2; cap.position.set(wx, 0.56, wz); g.add(cap);
      const cal = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.3, 0.1), caliper); cal.position.set(wx + (wx > 0 ? -0.12 : 0.12), 0.56, wz); g.add(cal);
    });
    return g;
  }
  function buildCar(kind) { return kind === 'ferrari' ? makeFerrari() : makeClassicCar(); }

  // ----- showroom -----
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(110, 110), matFloor); floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, 18); sc.add(floor);
  // checker accent tiles
  for (let i = -4; i <= 4; i++) { const t = new THREE.Mesh(new THREE.PlaneGeometry(10, 60), i % 2 ? matFloor2 : matFloor); t.rotation.x = -Math.PI / 2; t.position.set(i * 11, 0.01, 18); sc.add(t); }
  // boundary walls
  const WALL = { minX: -52, maxX: 52, minZ: -10, maxZ: 48 };
  [[0, WALL.minZ, 108, 3], [0, WALL.maxZ, 108, 3], [WALL.minX, 19, 3, 60], [WALL.maxX, 19, 3, 60]].forEach(([x, z, w, d]) => {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 6, d), matWall); wall.position.set(x, 3, z); sc.add(wall);
  });

  // two display pedestals with the cars + labels
  const DISPLAYS = [
    { kind: 'classic', x: -14, z: 24, label: 'CLASSIC', sub: 'silver coupe' },
    { kind: 'ferrari', x: 14, z: 24, label: 'FERRARI', sub: 'red sports' },
  ];
  DISPLAYS.forEach(d => {
    const ped = new THREE.Mesh(new THREE.CylinderGeometry(5, 5.4, 0.5, 28), matPed); ped.position.set(d.x, 0.25, d.z); sc.add(d._ped = ped);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(5.2, 0.18, 8, 32), matRingDim); ring.rotation.x = Math.PI / 2; ring.position.set(d.x, 0.55, d.z); sc.add(d._ring = ring);
    const turn = new THREE.Group(); turn.position.set(d.x, 0.5, d.z); sc.add(turn); d._turn = turn;
    const carModel = buildCar(d.kind); carModel.scale.set(1.05, 1.05, 1.05); turn.add(carModel);
    // label sign
    const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256; const c = cv.getContext('2d');
    c.fillStyle = '#0e1622'; c.fillRect(0, 0, 512, 256); c.strokeStyle = '#f08a3c'; c.lineWidth = 10; c.strokeRect(8, 8, 496, 240);
    c.fillStyle = '#ffffff'; c.textAlign = 'center'; c.font = '800 96px Syne, sans-serif'; c.fillText(d.label, 256, 120);
    c.fillStyle = '#9fb0c4'; c.font = '700 40px Space Mono, monospace'; c.fillText(d.sub, 256, 190);
    const tex = new THREE.CanvasTexture(cv);
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(9, 4.5), new THREE.MeshBasicMaterial({ map: tex })); sign.position.set(d.x, 7, d.z + 5.6); sign.rotation.y = Math.PI; sc.add(sign);
  });

  // exit marker on the floor
  (function () {
    const cv = document.createElement('canvas'); cv.width = 256; cv.height = 128; const c = cv.getContext('2d');
    c.fillStyle = '#f08a3c'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = 'bold 54px Arial'; c.fillText('EXIT ↓', 128, 64);
    const tex = new THREE.CanvasTexture(cv);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(10, 5), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    m.rotation.x = -Math.PI / 2; m.position.set(0, 0.03, -4); sc.add(m);
  })();

  // ----- player car (the one you drive in here) -----
  let selected = carKind();
  let carMesh = buildCar(selected); sc.add(carMesh); carMesh.position.y = 0.1;
  const car = { x: 0, z: -2, angle: 0, speed: 0 };
  function refreshUI() {
    document.getElementById('sel-val').textContent = selected === 'ferrari' ? 'Ferrari' : 'Classic';
    document.getElementById('opt-classic').classList.toggle('sel', selected === 'classic');
    document.getElementById('opt-ferrari').classList.toggle('sel', selected === 'ferrari');
    DISPLAYS.forEach(d => { if (d._ring) d._ring.material = (d.kind === selected) ? matRing : matRingDim; });
  }
  function chooseCar(kind) {
    if (kind === selected) return;
    selected = kind; setCar(kind);
    sc.remove(carMesh); carMesh = buildCar(kind); sc.add(carMesh); carMesh.position.set(car.x, 0.1, car.z); carMesh.rotation.y = car.angle;
    refreshUI();
  }
  setCar(selected); refreshUI();
  document.getElementById('opt-classic').addEventListener('click', (e) => { e.preventDefault(); if (!started) startRun(); chooseCar('classic'); });
  document.getElementById('opt-ferrari').addEventListener('click', (e) => { e.preventDefault(); if (!started) startRun(); chooseCar('ferrari'); });

  // ----- input -----
  const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
  let started = false;
  function setKey(k, v) { if (k in keys) keys[k] = !!v; }
  const KMAP = { ArrowUp:'ArrowUp', ArrowDown:'ArrowDown', ArrowLeft:'ArrowLeft', ArrowRight:'ArrowRight', w:'ArrowUp', s:'ArrowDown', a:'ArrowLeft', d:'ArrowRight', W:'ArrowUp', S:'ArrowDown', A:'ArrowLeft', D:'ArrowRight' };
  window.addEventListener('keydown', e => { const k = KMAP[e.key]; if (!k) return; e.preventDefault(); setKey(k, true); if (!started) startRun(); });
  window.addEventListener('keyup',   e => { const k = KMAP[e.key]; if (!k) return; e.preventDefault(); setKey(k, false); });
  [['ctrl-up','ArrowUp'],['ctrl-down','ArrowDown'],['ctrl-left','ArrowLeft'],['ctrl-right','ArrowRight']].forEach(([id, key]) => {
    const btn = document.getElementById(id);
    const press = (e) => { e.preventDefault(); e.stopPropagation(); btn.classList.add('active'); setKey(key, true); if (!started) startRun(); };
    const release = (e) => { e.preventDefault(); e.stopPropagation(); btn.classList.remove('active'); setKey(key, false); };
    btn.addEventListener('pointerdown', press); btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release); btn.addEventListener('pointerleave', release);
  });
  document.getElementById('start').addEventListener('click', () => startRun());
  function startRun() { started = true; document.getElementById('start').style.display = 'none'; }
  if (RESUME_RET) startRun();

  document.getElementById('fs-toggle').addEventListener('click', (e) => {
    e.preventDefault();
    const inFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (!inFs) { const fn = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen; if (fn) fn.call(document.documentElement); }
    else { const fn = document.exitFullscreen || document.webkitExitFullscreen; if (fn) fn.call(document); }
  });

  // tilt
  const tilt = { on: false, c: false, nB: 0, sB: 0, gO: false, bO: false };
  const tiltBtn = document.getElementById('tilt-toggle');
  tiltBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); toggleTilt(); });
  function toggleTilt() { if (!tilt.on) { if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) { DeviceOrientationEvent.requestPermission().then(s => { if (s === 'granted') tiltOn(); }).catch(() => {}); } else tiltOn(); } else tiltOff(); }
  function tiltOn() { tilt.on = true; tilt.c = false; window.addEventListener('deviceorientation', onTilt); tiltBtn.textContent = '📱 Tilt ON'; tiltBtn.style.background = '#f08a3c'; tiltBtn.style.color = '#1c2230'; }
  function tiltOff() { tilt.on = false; window.removeEventListener('deviceorientation', onTilt); for (const k in keys) setKey(k, false); tiltBtn.textContent = '📱 Tilt OFF'; tiltBtn.style.background = 'rgba(30,38,54,.86)'; tiltBtn.style.color = '#e7edf3'; }
  function onTilt(e) {
    const g = e.gamma || 0, b = e.beta || 0;
    if (!tilt.c) { tilt.nB = b; tilt.sB = b; tilt.c = true; }
    setKey('ArrowLeft', g < -8); setKey('ArrowRight', g > 8);
    tilt.sB = tilt.sB * 0.55 + b * 0.45; const db = tilt.sB - tilt.nB, df = 8;
    const wG = db < -df, wB = db > df;
    if (wG !== tilt.gO) { tilt.gO = wG; setKey('ArrowUp', wG); if (wG && !started) startRun(); }
    if (wB !== tilt.bO) { tilt.bO = wB; setKey('ArrowDown', wB); }
  }

  // ----- physics + selection by proximity -----
  let leaving = false;
  function updatePhysics() {
    const accel = 0.016, maxF = 0.42, maxR = 0.22, friction = 0.04, turn = 0.04;
    if (keys.ArrowUp) car.speed += accel;
    if (keys.ArrowDown) car.speed -= accel;
    car.speed *= (1 - friction);
    car.speed = Math.max(-maxR, Math.min(maxF, car.speed));
    if (Math.abs(car.speed) > 0.004) { const grip = Math.min(1, Math.abs(car.speed) / 0.18), dir = car.speed > 0 ? 1 : -1; if (keys.ArrowLeft) car.angle += turn * grip * dir; if (keys.ArrowRight) car.angle -= turn * grip * dir; }
    car.x += Math.sin(car.angle) * car.speed;
    car.z += Math.cos(car.angle) * car.speed;
    // keep inside the showroom
    const m = 2.4;
    if (car.x < WALL.minX + m) { car.x = WALL.minX + m; car.speed *= 0.4; }
    if (car.x > WALL.maxX - m) { car.x = WALL.maxX - m; car.speed *= 0.4; }
    if (car.z > WALL.maxZ - m) { car.z = WALL.maxZ - m; car.speed *= 0.4; }
    // keep cars from overlapping the pedestals (push out) + select on approach
    DISPLAYS.forEach(d => {
      const dx = car.x - d.x, dz = car.z - d.z, dist = Math.hypot(dx, dz);
      if (dist < 9) chooseCar(d.kind);            // drive up to a car to pick it
      if (dist < 6.2 && dist > 1e-3) { const push = 6.2 - dist; car.x += dx / dist * push; car.z += dz / dist * push; car.speed *= 0.3; }
    });
    // drive out the south exit → save & return
    if (!leaving && car.z < WALL.minZ + 1.2 && Math.abs(car.x) < 9) {
      leaving = true; setCar(selected);
      if (window.__fadeNav) window.__fadeNav(PARK_BACK); else window.location.href = PARK_BACK;
    }
  }

  // ----- render -----
  let T = 0;
  function updateCamera() {
    const fx = Math.sin(car.angle), fz = Math.cos(car.angle), camDist = 12, camH = 6.2;
    const tx = car.x - fx * camDist, tz = car.z - fz * camDist;
    cam.position.x += (tx - cam.position.x) * 0.10; cam.position.z += (tz - cam.position.z) * 0.10; cam.position.y += (camH - cam.position.y) * 0.10;
    cam.lookAt(car.x + fx * 7, 1.4, car.z + fz * 7);
  }
  function loop() {
    requestAnimationFrame(loop); T += 0.016;
    if (started) updatePhysics();
    carMesh.position.set(car.x, 0.1, car.z); carMesh.rotation.y = car.angle;
    DISPLAYS.forEach(d => { if (d._turn) d._turn.rotation.y = T * 0.5; });
    updateCamera();
    renderer.render(sc, cam);
  }
  loop();
})();
</script>
</body>
</html>
