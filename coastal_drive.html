<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Coastal Drive — Portfolio Park</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@800&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #e0a47a; height: 100%; }
  body {
    font-family: 'Space Mono', monospace;
    color: #34404f;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  .pill {
    position: fixed; z-index: 9; padding: 9px 14px; border-radius: 999px;
    border: 1px solid #e0e7e2; background: rgba(255,255,255,.85); color: #34404f;
    font: 700 12px 'Space Mono', monospace; letter-spacing: 0.05em;
    text-decoration: none; cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #back-link { top: 22px; left: 24px; }
  #fs-toggle  { top: 22px; right: 24px; border: 1px solid #e0e7e2; }
  #tilt-toggle{ top: 62px; right: 24px; display: none; }
  body.mobile #tilt-toggle { display: block; }

  /* ---- vintage radio ---- */
  #radio {
    position: fixed; right: 20px; top: 118px; z-index: 9; width: 168px;
    padding: 10px 12px 12px; border-radius: 14px;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0 2px, rgba(0,0,0,.04) 2px 4px),
      linear-gradient(150deg, #caa06a 0%, #b07a4f 45%, #9c6b3f 100%);
    background-blend-mode: overlay, normal;
    border: 1px solid #6e4a2b; box-shadow: 0 10px 26px -10px rgba(40,25,10,.6), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 6px rgba(0,0,0,.35);
    font-family: 'Space Mono', monospace; -webkit-user-select: none; user-select: none;
    transition: filter .3s ease;
  }
  #radio .ant { position: absolute; top: -26px; right: 22px; width: 3px; height: 28px; background: linear-gradient(#d8d8d8,#9a9a9a); border-radius: 2px; transform-origin: bottom center; transform: rotate(18deg); }
  #radio .ant::after { content:''; position:absolute; top:-4px; left:-2px; width:7px; height:7px; border-radius:50%; background:#c9ccd0; }
  #radio .brand { text-align: center; font: 700 10px 'Space Mono', monospace; letter-spacing: 3px; color: #3a2410; text-shadow: 0 1px 0 rgba(255,255,255,.3); margin-bottom: 6px; }
  #radio .dial { position: relative; height: 26px; border-radius: 6px; background: linear-gradient(#f6efdc,#e6d8b8); border: 1px solid #7a5732; box-shadow: inset 0 1px 3px rgba(0,0,0,.3); overflow: hidden; }
  #radio .scale { position:absolute; inset:0; display:flex; align-items:center; justify-content:space-between; padding: 0 7px; font-size: 8px; color: #6a4a28; letter-spacing:.5px; }
  #radio .needle { position:absolute; top:2px; bottom:2px; width:2px; background:#c1272d; left: 50%; box-shadow: 0 0 5px rgba(193,39,45,.8); transition: left .5s ease; }
  #radio .now { margin: 7px 0 8px; height: 22px; line-height: 22px; border-radius: 5px; padding: 0 8px; font-size: 10px; letter-spacing: .5px; color: #7be0a0; background: #10201a; border: 1px solid #05100c; box-shadow: inset 0 1px 4px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 6px rgba(123,224,160,.5); }
  #radio.off .now { color: #4a5f56; text-shadow: none; }
  #radio .row2 { display:flex; align-items:flex-end; gap:8px; }
  #radio .grille { flex:1; height: 42px; border-radius: 6px; background: repeating-linear-gradient(90deg, #5a3c22 0 3px, #7a5535 3px 6px); border:1px solid #4a3018; box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
  #radio .knobs { display:flex; gap:8px; }
  #radio .kwrap { display:flex; flex-direction:column; align-items:center; gap:2px; }
  #radio .klabel { font: 700 7px 'Space Mono', monospace; letter-spacing: 1px; color:#3a2410; text-shadow:0 1px 0 rgba(255,255,255,.3); }
  #radio .knob { position: relative; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent;
    background: radial-gradient(circle at 35% 30%, #f2f2f2, #b9bdc2 55%, #7d8288 100%); border: 2px solid #55585c; box-shadow: 0 3px 6px rgba(0,0,0,.4), inset 0 1px 2px rgba(255,255,255,.6); transition: transform .2s ease; }
  #radio .knob.vol { width: 30px; height: 30px; transition: transform .05s linear; }
  #radio .knob .ind { position:absolute; top: 4px; left: 50%; width: 3px; height: 10px; margin-left:-1.5px; border-radius: 2px; background: #33373b; }
  #radio.on #radio-knob { transform: rotate(130deg); }
  #radio .led { position:absolute; top: 12px; left: 14px; width: 8px; height: 8px; border-radius: 50%; background: #4a1410; box-shadow: inset 0 0 3px rgba(0,0,0,.6); }
  #radio.on .led { background: #ff5a3c; box-shadow: 0 0 8px 2px rgba(255,90,60,.8), inset 0 0 2px rgba(255,255,255,.6); }
  #radio.off { filter: saturate(.7) brightness(.96); }
  @media (max-width: 560px) { #radio { width: 150px; transform: scale(.92); transform-origin: top right; } }

  #hud {
    position: fixed; top: 64px; left: 24px; z-index: 8; min-width: 200px;
    padding: 14px 16px; border-radius: 14px;
    background: rgba(255,255,255,.85); border: 1px solid #e0e7e2;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 20px -10px rgba(40,60,80,.18);
  }
  #hud .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #5b7591; font-weight: 700; }
  #hud .row + .row { margin-top: 4px; }
  #hud .val { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; color: #1f2733; letter-spacing: -0.01em; }

  #start {
    position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 38%, rgba(255,255,255,.78), rgba(180,210,230,.92));
    cursor: pointer; animation: fadeOver .4s ease both;
  }
  #start .panel {
    text-align: center; padding: 36px; max-width: 460px;
  }
  #start .tag { font-size: 11px; letter-spacing: 0.18em; color: #4b8bcc; font-weight: 700; margin-bottom: 12px; }
  #start h1 { font: 800 clamp(40px, 8vw, 80px)/.95 'Syne', sans-serif; color: #34404f; letter-spacing: -0.03em; margin: 0 0 14px; }
  #start p { margin: 0 auto 22px; max-width: 380px; font-size: 14px; line-height: 1.6; color: #5b7591; }
  #start .go { display: inline-block; padding: 14px 30px; border-radius: 999px; background: #4b8bcc; color: #fff;
    font: 800 16px 'Syne', sans-serif; letter-spacing: 0.02em; box-shadow: 0 10px 26px -10px rgba(75,139,204,.7); text-decoration: none; }
  @keyframes fadeOver { from { opacity: 0; } to { opacity: 1; } }

  .ctrl {
    position: fixed; z-index: 9; width: 66px; height: 66px; border-radius: 50%;
    border: 1px solid #e0e7e2; background: rgba(255,255,255,.86); color: #34404f;
    font-size: 26px; cursor: pointer; touch-action: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 5px 14px -5px rgba(40,60,45,.35);
    display: flex; align-items: center; justify-content: center;
  }
  .ctrl.active { background: #4b8bcc; color: #fff; }
  #ctrl-up   { bottom: 100px; right: 24px; }
  #ctrl-down { bottom: 24px;  right: 24px; }
  #ctrl-left { bottom: 24px;  left:  24px; }
  #ctrl-right{ bottom: 24px;  left:  100px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="page-fade" style="position:fixed;inset:0;z-index:99999;background:#e0a47a;opacity:1;transition:opacity .55s ease;pointer-events:none;will-change:opacity"></div>

<a id="back-link" class="pill" href="portfolio_park.html" onclick="event.preventDefault(); window.__fadeNav(this.href); return false;">← back to park</a>
<button id="fs-toggle" class="pill" type="button">⛶ Fullscreen</button>
<button id="tilt-toggle" class="pill" type="button">📱 Tilt OFF</button>

<div id="radio" class="off" role="group" aria-label="Car radio">
  <div class="ant"></div>
  <div class="brand">COAST · FM</div>
  <div class="dial">
    <div class="scale"><span>88</span><span>92</span><span>96</span><span>100</span><span>104</span><span>108</span></div>
    <div class="needle" id="radio-needle"></div>
  </div>
  <div class="now" id="radio-now">— OFF —</div>
  <div class="row2">
    <div class="grille"></div>
    <div class="knobs">
      <div class="kwrap"><button id="radio-vol" class="knob vol" type="button" aria-label="Volume"><span class="ind"></span></button><span class="klabel">VOL</span></div>
      <div class="kwrap"><button id="radio-knob" class="knob" type="button" aria-label="Radio power"><span class="ind"></span></button><span class="klabel">PWR</span></div>
    </div>
  </div>
  <div class="led"></div>
</div>

<div id="hud">
  <div class="row"><span>COASTAL DRIVE</span><span class="val">∞</span></div>
  <div class="row"><span>SPEED</span><span class="val" id="speed-val">0</span></div>
  <div class="row" style="margin-top:8px;color:#5b7591;font-weight:400"><span style="font-size:10px;letter-spacing:0">just cruise — the road never ends</span></div>
</div>

<div id="start">
  <div class="panel">
    <div class="tag">SCENIC ROUTE</div>
    <h1>COASTAL DRIVE</h1>
    <p>An endless cliffside road by a calm sea. No timer, no finish line — just drive. Tap or press any key to start.</p>
    <div class="go">Start cruising →</div>
  </div>
</div>

<button id="ctrl-up"    class="ctrl">↑</button>
<button id="ctrl-down"  class="ctrl">↓</button>
<button id="ctrl-left"  class="ctrl">←</button>
<button id="ctrl-right" class="ctrl">→</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
<script>
(() => {
  const THREE = window.THREE;
  if (!THREE) { document.getElementById('start').innerHTML = '<div class="panel"><h1>3D failed to load</h1><p>Please check your connection and try again.</p></div>'; return; }

  // ----- page fade -----
  const _pf = document.getElementById('page-fade');
  if (_pf) requestAnimationFrame(() => requestAnimationFrame(() => { _pf.style.opacity = '0'; }));
  window.__fadeNav = function (u) { if (_pf) { _pf.style.pointerEvents = 'auto'; _pf.style.opacity = '1'; setTimeout(() => { window.location.href = u; }, 560); } else { window.location.href = u; } };

  // ----- park round-trip -----
  // If we arrived by driving through the park's portal, ?ret carries the player's
  // park position. We hand it straight back so the park resumes where they left.
  const RESUME_RET = new URLSearchParams(window.location.search).get('ret');
  const PARK_BACK = RESUME_RET ? ('portfolio_park.html?resume=' + encodeURIComponent(RESUME_RET)) : 'portfolio_park.html';
  { const bl = document.getElementById('back-link'); if (bl) bl.setAttribute('href', PARK_BACK); }

  // ----- mobile flag -----
  const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (isMobile) document.body.classList.add('mobile');

  // ----- renderer / scene / camera -----
  const canvas = document.getElementById('cv');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));

  const sc = new THREE.Scene();
  sc.fog = new THREE.Fog(0xe7a578, 160, 360);

  const cam = new THREE.PerspectiveCamera(58, 1, 0.5, 600);
  cam.position.set(0, 14, 30);

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    cam.aspect = w / h; cam.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ----- lights -----
  sc.add(new THREE.HemisphereLight(0xffd49a, 0x42394a, 0.7));
  // warm, low directional light (the sunset)
  const sun = new THREE.DirectionalLight(0xffb072, 0.95);
  sun.position.set(-80, 28, -120); sc.add(sun);
  // gentle fill from the opposite side to keep shadows from going pitch black
  const fill = new THREE.DirectionalLight(0xa688aa, 0.25);
  fill.position.set(60, 30, 100); sc.add(fill);

  // ===== Sky dome + visible sun (track camera so they always sit "at infinity") =====
  const skyboxGroup = new THREE.Group();
  sc.add(skyboxGroup);
  const skyCv = document.createElement('canvas'); skyCv.width = 32; skyCv.height = 512;
  {
    const sc2 = skyCv.getContext('2d');
    const grad = sc2.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0.00, '#2c1b3d');    // zenith — twilight purple
    grad.addColorStop(0.18, '#5d3b6a');    // upper sky
    grad.addColorStop(0.35, '#a85a6e');    // pink band
    grad.addColorStop(0.50, '#e07b48');    // bright sunset orange
    grad.addColorStop(0.62, '#f4a868');    // glowing band near horizon
    grad.addColorStop(0.78, '#f5d394');    // pale at horizon
    grad.addColorStop(1.00, '#7c8a96');    // under-horizon (hidden by sea/ground)
    sc2.fillStyle = grad; sc2.fillRect(0, 0, 32, 512);
  }
  const skyTex = new THREE.CanvasTexture(skyCv);
  const skyDome = new THREE.Mesh(
    new THREE.SphereGeometry(450, 24, 18),
    new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false, depthWrite: false })
  );
  skyboxGroup.add(skyDome);

  // The visible sun — orange glowing disc + soft halo, sitting low above the horizon
  const sunBall = new THREE.Mesh(
    new THREE.SphereGeometry(14, 24, 18),
    new THREE.MeshBasicMaterial({ color: 0xffe27b, fog: false })
  );
  sunBall.position.set(-110, 28, -300);
  skyboxGroup.add(sunBall);
  const sunHalo = new THREE.Mesh(
    new THREE.SphereGeometry(24, 24, 18),
    new THREE.MeshBasicMaterial({ color: 0xff9a52, transparent: true, opacity: 0.45, fog: false, depthWrite: false })
  );
  sunHalo.position.copy(sunBall.position);
  skyboxGroup.add(sunHalo);
  const sunGlow = new THREE.Mesh(
    new THREE.SphereGeometry(40, 24, 18),
    new THREE.MeshBasicMaterial({ color: 0xff7a4a, transparent: true, opacity: 0.18, fog: false, depthWrite: false })
  );
  sunGlow.position.copy(sunBall.position);
  skyboxGroup.add(sunGlow);

  // ----- shared materials & textures -----
  const matSea     = new THREE.MeshLambertMaterial({ color: 0x4a86a0 });   // dusk sea — slightly desaturated under sunset light
  const matBeach   = new THREE.MeshLambertMaterial({ color: 0xddc99b });
  const matCliff   = new THREE.MeshLambertMaterial({ color: 0x8a7458 });
  const matGreen   = new THREE.MeshLambertMaterial({ color: 0x6e8a52 });
  const matFol     = new THREE.MeshLambertMaterial({ color: 0x5d8a44 });   // cypress green
  const matFolDark = new THREE.MeshLambertMaterial({ color: 0x4e7838 });   // pine green
  const matOlive   = new THREE.MeshLambertMaterial({ color: 0x8fa37e });   // olive — silvery green
  const matBouga1  = new THREE.MeshLambertMaterial({ color: 0xd64d8a });   // bougainvillea magenta
  const matBouga2  = new THREE.MeshLambertMaterial({ color: 0xe07590 });   // bougainvillea pink
  const matWhite   = new THREE.MeshLambertMaterial({ color: 0xf3eee2 });
  const matRoof    = new THREE.MeshLambertMaterial({ color: 0xc25a3e });
  const matRail    = new THREE.MeshLambertMaterial({ color: 0xeeeeee });
  const matStone   = new THREE.MeshLambertMaterial({ color: 0xc4b594 });
  const matTrunk   = new THREE.MeshLambertMaterial({ color: 0x7a4a2c });
  const matEdge    = new THREE.MeshBasicMaterial({ color: 0xfaf6e8 });
  const matDash    = new THREE.MeshBasicMaterial({ color: 0xfff0bf });
  const matBoatHull = new THREE.MeshLambertMaterial({ color: 0xf5efe4 });
  const matBoatCab  = new THREE.MeshLambertMaterial({ color: 0x4a5a6e });
  const matBridge   = new THREE.MeshLambertMaterial({ color: 0x4a4540 });   // dark steel deck girders
  const matTower    = new THREE.MeshPhongMaterial({ color: 0xc0392b, shininess: 30 }); // international-orange towers
  const matCable    = new THREE.MeshLambertMaterial({ color: 0x8a2f24 });   // suspension cables
  const matSign     = new THREE.MeshLambertMaterial({ color: 0x2f6f4f });   // green road sign
  const matSignPost = new THREE.MeshLambertMaterial({ color: 0x9aa0a6 });
  // --- refinement palette ---
  const matFolLight = new THREE.MeshLambertMaterial({ color: 0x6f9b52 });   // sunlit pine tip
  const matCypDeep  = new THREE.MeshLambertMaterial({ color: 0x466e35 });   // deep cypress
  const matOliveHi  = new THREE.MeshLambertMaterial({ color: 0xa8b894 });   // silvery olive highlight
  const matOliveTrk = new THREE.MeshLambertMaterial({ color: 0x6e5a44 });   // gnarled grey-brown trunk
  const matBouga3   = new THREE.MeshLambertMaterial({ color: 0xf2ebdd });   // white oleander
  const matPostRed  = new THREE.MeshLambertMaterial({ color: 0xc23b2e });   // delineator red band
  const matReflect  = new THREE.MeshBasicMaterial({ color: 0xffd76a });     // catches the sunset — reads as a reflector
  const matShrine   = new THREE.MeshLambertMaterial({ color: 0xf4efe4 });   // whitewashed kandylaki
  const matShrineRf = new THREE.MeshLambertMaterial({ color: 0x3e6e97 });   // aegean-blue shrine roof
  const matCandle   = new THREE.MeshBasicMaterial({ color: 0xffc46a });     // warm candle glow
  const matWallCrm  = new THREE.MeshLambertMaterial({ color: 0xf0e6cf });   // warm cream house wall
  const matShutter  = new THREE.MeshLambertMaterial({ color: 0x3e6e97 });   // blue shutters
  const matFlowerR  = new THREE.MeshLambertMaterial({ color: 0xd8452e });   // poppies
  const matFlowerY  = new THREE.MeshLambertMaterial({ color: 0xe8c33a });   // wild daisies
  const matFlowerW  = new THREE.MeshLambertMaterial({ color: 0xf2eee0 });   // chamomile

  // Asphalt — lighter, weathered coastal-road texture (similar to worn Irish coastal asphalt)
  const asphaltTex = (() => {
    const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
    const c = cv.getContext('2d');
    // medium warm grey base — like sun-bleached, weathered asphalt
    c.fillStyle = '#6a6d6a'; c.fillRect(0, 0, 256, 256);
    // per-pixel brightness jitter (gentle, with a hint of cool/warm variation)
    const img = c.getImageData(0, 0, 256, 256);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() - 0.5) * 20;
      d[i]   = Math.max(0, Math.min(255, d[i]   + n + 1));    // slightly warm
      d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
      d[i+2] = Math.max(0, Math.min(255, d[i+2] + n - 2));    // slightly cooler blue
    }
    c.putImageData(img, 0, 0);
    // gravel chips — varied light specks
    for (let i = 0; i < 600; i++) {
      const x = Math.random() * 256, y = Math.random() * 256;
      const r = Math.random() * 0.95 + 0.25;
      const b = 130 + Math.random() * 70 | 0;
      c.fillStyle = 'rgba(' + b + ',' + b + ',' + (b - 4) + ',0.42)';
      c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    }
    // tiny darker pits / cracks
    for (let i = 0; i < 80; i++) {
      const x = Math.random() * 256, y = Math.random() * 256;
      c.fillStyle = 'rgba(35,38,40,' + (0.10 + Math.random() * 0.20).toFixed(2) + ')';
      c.fillRect(x, y, 1 + Math.random() * 2.4, 1 + Math.random() * 2.4);
    }
    // long horizontal wear streaks — these tile along the road length and read as tire-track patina
    for (let i = 0; i < 5; i++) {
      const y = Math.random() * 256;
      const h = 0.8 + Math.random() * 1.4;
      c.fillStyle = 'rgba(48,50,52,' + (0.05 + Math.random() * 0.07).toFixed(2) + ')';
      c.fillRect(0, y, 256, h);
    }
    // a couple of soft lighter washes (sun-bleached patches)
    for (let i = 0; i < 3; i++) {
      const x = Math.random() * 256, y = Math.random() * 256;
      const grad = c.createRadialGradient(x, y, 0, x, y, 60 + Math.random() * 40);
      grad.addColorStop(0, 'rgba(190,190,180,0.10)');
      grad.addColorStop(1, 'rgba(190,190,180,0)');
      c.fillStyle = grad;
      c.fillRect(0, 0, 256, 256);
    }
    const tex = new THREE.CanvasTexture(cv);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 4;
    return tex;
  })();
  const matAsphalt = new THREE.MeshLambertMaterial({ map: asphaltTex });

  // ----- global sky-dome / distant sea ring (huge, doesn't move) -----
  const seaPlane = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), matSea);
  seaPlane.rotation.x = -Math.PI / 2; seaPlane.position.y = -3; sc.add(seaPlane);

  // ----- chunk system -----
  const CHUNK_LEN = 50;
  const SAMPLES = 22;             // road samples per chunk
  const ROAD_HW = 5;              // road half-width
  const ACTIVE = 14;              // chunks alive at any time
  const KEEP_BEHIND = 3;          // chunks kept behind the car

  // Chunk types — weighted random
  const TYPES = [
    { name: 'straight',     w: 3, dt: 0,     s: false },
    { name: 'left_gentle',  w: 2, dt: 0.32,  s: false },
    { name: 'right_gentle', w: 2, dt: -0.32, s: false },
    { name: 'left_sweep',   w: 1, dt: 0.58,  s: false },
    { name: 'right_sweep',  w: 1, dt: -0.58, s: false },
    { name: 'left_s',       w: 1, dt: 0,     s: [ 0.38, -0.38] },
    { name: 'right_s',      w: 1, dt: 0,     s: [-0.38,  0.38] },
    // "another path" — a chicane that wiggles left-then-right and comes out straight
    { name: 'chicane',      w: 1, dt: 0,     s: false, profile: (i, n) => Math.sin((i / n) * Math.PI * 2) * 0.06 },
    // "a conjunction" — a straight stretch with a side road branching off into the hills
    { name: 'junction',     w: 1, dt: 0,     s: false, junction: true },
  ];
  // Special, never-random type used only for the scripted suspension bridge finale.
  const TYPE_STRAIGHT = TYPES[0];
  const TYPE_BRIDGE   = { name: 'bridge', w: 0, dt: 0, s: false, bridge: true };
  // Host chunk where the long Golden-Gate-style sea bridge branches off toward the water.
  const TYPE_SEABRIDGE = { name: 'sea_junction', w: 0, dt: 0, s: false, seaBridge: true };
  // Host chunk where a road branches inland into a drivable suburban neighbourhood.
  const TYPE_SUBURB    = { name: 'suburb_junction', w: 0, dt: 0, s: false, junction: true, suburb: true };

  const W_TOTAL = TYPES.reduce((a, t) => a + t.w, 0);
  function pickType(prev) {
    // Avoid back-to-back hard turns in the same direction (helps the flow feel natural)
    for (let tries = 0; tries < 4; tries++) {
      let r = Math.random() * W_TOTAL;
      for (const t of TYPES) { r -= t.w; if (r <= 0) {
        if (prev && Math.sign(t.dt) === Math.sign(prev.dt) && Math.abs(t.dt) > 0.5 && Math.abs(prev.dt) > 0.5) continue;
        // don't place two junctions back to back
        if (t.junction && prev && prev.junction) continue;
        return t;
      } }
    }
    return TYPES[0];
  }

  // ----- bridge scheduling -----
  // First a short scenic span over the water (decorative), then later a junction where a
  // long Golden-Gate-style suspension bridge branches off toward the sea. Driving to the
  // far END of that long bridge returns the player to the portfolio park.
  const SMALL_BRIDGE_AFTER = 12;   // chunks before the short scenic bridge
  const SUBURB_AFTER       = 16;   // chunks before the inland suburb turn-off appears
  const SEA_BRIDGE_AFTER   = 24;   // chunks before the sea-bridge junction appears
  let   chunksBuilt   = 0;
  let   smallBridgeQueued = false;
  let   suburbQueued      = false;
  let   seaBridgeQueued   = false;
  let   bridgeReached = false;     // fires the return-to-park once
  let   seaBridge     = null;      // { samples, group, hw } once spawned
  let   suburb        = null;      // { samples, group } once spawned
  const forcedTypes   = [];        // overrides pickType when non-empty
  function nextType(prev) {
    if (forcedTypes.length) return forcedTypes.shift();
    if (!smallBridgeQueued && chunksBuilt >= SMALL_BRIDGE_AFTER) {
      smallBridgeQueued = true;
      forcedTypes.push(TYPE_STRAIGHT, TYPE_BRIDGE);   // straight run-up, then the short span
      return forcedTypes.shift();
    }
    if (!suburbQueued && chunksBuilt >= SUBURB_AFTER) {
      suburbQueued = true;
      forcedTypes.push(TYPE_STRAIGHT, TYPE_SUBURB);   // run-up, then the inland turn-off
      return forcedTypes.shift();
    }
    if (!seaBridgeQueued && chunksBuilt >= SEA_BRIDGE_AFTER) {
      seaBridgeQueued = true;
      forcedTypes.push(TYPE_STRAIGHT, TYPE_SEABRIDGE); // run-up, then the junction host
      return forcedTypes.shift();
    }
    return pickType(prev);
  }

  // Builders
  function makeTree(x, z) {
    const g = new THREE.Group();
    const isPine = Math.random() < 0.5;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 1.5, 6), matTrunk);
    trunk.position.y = 0.75;
    trunk.rotation.z = (Math.random() - 0.5) * 0.08;   // faint natural lean
    g.add(trunk);
    if (isPine) {
      // two-tone stone pine — dark broad base, sunlit tip
      const c = new THREE.Mesh(new THREE.ConeGeometry(1.5, 2.0, 8), matFolDark);
      c.position.y = 2.2; g.add(c);
      const c2 = new THREE.Mesh(new THREE.ConeGeometry(1.0, 1.4, 8), matFolLight);
      c2.position.y = 3.3; c2.rotation.y = 0.4; g.add(c2);
    } else {
      // cypress — deep body with a lighter wind-tipped crown
      const cyp = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.9, 2.6, 7), matCypDeep);
      cyp.position.y = 2.7; g.add(cyp);
      const tip = new THREE.Mesh(new THREE.ConeGeometry(0.42, 1.3, 7), matFol);
      tip.position.y = 4.55; tip.rotation.z = (Math.random() - 0.5) * 0.12; g.add(tip);
    }
    g.position.set(x, 0, z);
    g.rotation.y = Math.random() * Math.PI * 2;
    const sc2 = 0.85 + Math.random() * 0.6;
    g.scale.set(sc2, sc2, sc2);
    return g;
  }
  function makeRock(x, z) {
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5 + Math.random() * 0.9, 0), matCliff);
    m.position.set(x, 0.3, z);
    m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);

  }
  function makeOlive(x, z) {
    const g = new THREE.Group();

    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.26, 0.95, 6), matOliveTrk);
    trunk.position.y = 0.45;
    trunk.rotation.z = (Math.random() - 0.5) * 0.3;

    const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(0.9, 0), matOlive);

    lobe.position.set(0.45, 1.55, 0.2); g.add(lobe);
    if (Math.random() < 0.6) {
      const lobe2 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5, 0), matOlive);
      lobe2.position.set(-0.5, 1.15, -0.25); g.add(lobe2);

    g.position.set(x, 0, z);
    g.rotation.y = Math.random() * Math.PI * 2;
    const s2 = 0.9 + Math.random() * 0.5;

  }
  function makeBougainvillea(x, z) {
    const g = new THREE.Group();

    const r = Math.random();
    const mat = r < 0.42 ? matBouga1 : (r < 0.8 ? matBouga2 : matBouga3);
    const main = new THREE.Mesh(new THREE.IcosahedronGeometry(0.55 + Math.random() * 0.3, 0), mat);
    main.position.y = 0.4; g.add(main);

      const extra = new THREE.Mesh(new THREE.IcosahedronGeometry(0.35, 0), mat);

  // Small clump of wildflowers for the road verge — poppies, daisies, chamomile.

  // Kandylaki — the little roadside shrine seen all along Greek coastal roads.
  function makeShrine(x, z, rotY) {

  // Red-and-white chevron board warning of a sharp bend, angled to face the driver.
  function makeChevron(x, z, rotY, pointLeft) {
    const g = new THREE.Group();
    for (const dx of [-0.55, 0.55]) {
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.3, 0.12), matSignPost);
      p.position.set(dx, 0.65, 0); g.add(p);
    }
    const board = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.85, 0.08), matPostRed);
    board.position.y = 1.62; g.add(board);
    // two white chevron strokes, tilted toward the turn
    const tilt = pointLeft ? 0.7 : -0.7;
    for (const off of [-0.4, 0.25]) {
      const s1 = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.62, 0.04), matRail);
      s1.position.set(off - 0.12, 1.5, 0.05); s1.rotation.z = tilt; g.add(s1);
      const s2 = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.62, 0.04), matRail);
      s2.position.set(off + 0.12, 1.74, 0.05); s2.rotation.z = -tilt; g.add(s2);

    g.position.set(x, 0, z);

  }
  function makeBoat(x, z, rotY) {
    const g = new THREE.Group();
    const hull = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 4.5), matBoatHull);
    hull.position.y = 0.25; g.add(hull);
    // pointed bow approximation
    const bow = new THREE.Mesh(new THREE.ConeGeometry(0.9, 1.4, 6), matBoatHull);
    bow.rotation.x = Math.PI / 2; bow.rotation.z = Math.PI / 2;
    bow.position.set(0, 0.25, 2.8); g.add(bow);
    // cabin
    const cab = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.7, 1.6), matBoatCab);
    cab.position.set(0, 0.85, -0.3); g.add(cab);
    g.position.set(x, -1.6, z);
    g.rotation.y = rotY;
    return g;
  }
  function makeStoneWall(group, samples, startI, count) {
    // Replaces guardrail posts on a short run with a continuous low stone wall on the sea side
    for (let k = 0; k < count; k++) {
      const i = startI + k;
      if (i >= samples.length - 1) break;
      const s0 = samples[i], s1 = samples[i + 1];
      const segLen = Math.hypot(s1.x - s0.x, s1.z - s0.z);
      const px = Math.cos(s0.a), pz = -Math.sin(s0.a);
      const cx = (s0.x + s1.x) / 2 + px * (ROAD_HW + 0.6);
      const cz = (s0.z + s1.z) / 2 + pz * (ROAD_HW + 0.6);
      const seg = new THREE.Mesh(new THREE.BoxGeometry(segLen * 1.03, 0.65, 0.3), matStone);
      seg.position.set(cx, 0.43, cz);
      seg.rotation.y = s0.a;
      group.add(seg);
    }
  }
  function makeHouse(x, z, rotY) {
    const g = new THREE.Group();
    const w = 2.6, d = 2.4, h = 2.4;
    const wall = Math.random() < 0.72 ? matWhite : matWallCrm;   // mostly whitewash, some warm cream
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wall);
    body.position.y = h / 2; g.add(body);
    // simple pitched roof using a rotated box
    const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 0.3, 0.3, d + 0.3), matRoof);
    roof.position.y = h + 0.1; g.add(roof);
    const roof2 = new THREE.Mesh(new THREE.ConeGeometry(d * 0.8, 1.0, 4), matRoof);
    roof2.rotation.y = Math.PI / 4;
    roof2.position.y = h + 0.8; g.add(roof2);
    // a small whitewashed chimney
    if (Math.random() < 0.7) {
      const chim = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.6, 0.28), wall);
      chim.position.set(w * 0.28, h + 1.0, -d * 0.2); g.add(chim);
    }
    // window with aegean-blue shutters
    const win = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.6), new THREE.MeshBasicMaterial({ color: 0x2a3848 }));
    win.position.set(0.4, h * 0.58, d / 2 + 0.01); g.add(win);
    const shL = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.62, 0.04), matShutter);
    shL.position.set(0.06, h * 0.58, d / 2 + 0.02); g.add(shL);
    const shR = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.62, 0.04), matShutter);
    shR.position.set(0.74, h * 0.58, d / 2 + 0.02); g.add(shR);
    // blue door
    const door = new THREE.Mesh(new THREE.BoxGeometry(0.52, 1.1, 0.05), matShutter);
    door.position.set(-0.62, 0.55, d / 2 + 0.02); g.add(door);
    g.position.set(x, 0, z);
    g.rotation.y = rotY;
    return g;
  }

  // Side road that branches off the cliff side at a junction chunk.
  function buildJunctionSpur(group, samples) {
    const mid = Math.floor(samples.length * 0.5);
    const s = samples[mid];
    const fx = Math.sin(s.a), fz = Math.cos(s.a);   // road-forward direction
    const px = Math.cos(s.a), pz = -Math.sin(s.a);  // right perpendicular
    const dx = -px, dz = -pz;                        // spur heads inland (left)
    const SPUR_LEN = 13, SPUR_HW = 3.0;
    const sx0 = s.x - px * (ROAD_HW - 0.3);
    const sz0 = s.z - pz * (ROAD_HW - 0.3);

    // paved strip (width axis = road-forward)
    const pos = [], idx = [];
    const steps = 5;
    for (let i = 0; i <= steps; i++) {
      const tt = i / steps;
      const cxp = sx0 + dx * SPUR_LEN * tt;
      const czp = sz0 + dz * SPUR_LEN * tt;
      pos.push(cxp - fx * SPUR_HW, 0.115, czp - fz * SPUR_HW);
      pos.push(cxp + fx * SPUR_HW, 0.115, czp + fz * SPUR_HW);
    }
    for (let i = 0; i < steps; i++) {
      const a0 = 2 * i, a1 = 2 * i + 1, a2 = 2 * (i + 1), a3 = 2 * (i + 1) + 1;
      idx.push(a0, a2, a1); idx.push(a1, a2, a3);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx); g.computeVertexNormals();
    group.add(new THREE.Mesh(g, matAsphalt));

    // dashed centre line down the spur
    const dashRotY = Math.atan2(dx, dz);
    for (let i = 0; i < steps; i++) {
      const tt = (i + 0.5) / steps;
      const cxp = sx0 + dx * SPUR_LEN * tt;
      const czp = sz0 + dz * SPUR_LEN * tt;
      const dash = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.03, (SPUR_LEN / steps) * 0.5), matDash);
      dash.position.set(cxp, 0.14, czp);
      dash.rotation.y = dashRotY;
      group.add(dash);
    }

    // green junction sign on a post beside the main road
    const spX = s.x - px * (ROAD_HW + 0.9);
    const spZ = s.z - pz * (ROAD_HW + 0.9);
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.14, 3.0, 0.14), matSignPost);
    post.position.set(spX, 1.5, spZ);
    group.add(post);
    const board = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.9, 0.12), matSign);
    board.position.set(spX, 2.7, spZ);
    board.rotation.y = -s.a;
    group.add(board);
  }

  // Suspension bridge structure laid over the road surface of a bridge chunk.
  function buildBridge(group, samples) {
    const n = samples.length;

    // Deck side girders + a thin underside slab so you don't see through to the sea
    for (const side of [-1, 1]) {
      for (let i = 0; i < n - 1; i++) {
        const s0 = samples[i], s1 = samples[i + 1];
        const px = Math.cos(s0.a), pz = -Math.sin(s0.a);
        const mx = (s0.x + s1.x) / 2 + side * px * ROAD_HW;
        const mz = (s0.z + s1.z) / 2 + side * pz * ROAD_HW;
        const segLen = Math.hypot(s1.x - s0.x, s1.z - s0.z) || 1;
        const beam = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, segLen * 1.05), matBridge);
        beam.position.set(mx, 0.0, mz);
        beam.rotation.y = s0.a;
        group.add(beam);
      }
    }
    for (let i = 0; i < n - 1; i += 2) {
      const s0 = samples[i], s1 = samples[Math.min(i + 2, n - 1)];
      const segLen = Math.hypot(s1.x - s0.x, s1.z - s0.z) || 1;
      const slab = new THREE.Mesh(new THREE.BoxGeometry(ROAD_HW * 2, 0.4, segLen), matBridge);
      slab.position.set((s0.x + s1.x) / 2, -0.15, (s0.z + s1.z) / 2);
      slab.rotation.y = s0.a;
      group.add(slab);
    }

    const TOWER_H = 17, DECK_TOP = 13;        // cable height at the towers
    const towerAt = [Math.floor(n * 0.28), Math.floor(n * 0.72)];

    // Towers (two portals) + connecting cross-beams over the road
    for (const ti of towerAt) {
      const s = samples[ti];
      const px = Math.cos(s.a), pz = -Math.sin(s.a);
      for (const side of [-1, 1]) {
        const bx = s.x + side * px * (ROAD_HW + 0.3);
        const bz = s.z + side * pz * (ROAD_HW + 0.3);
        const tower = new THREE.Mesh(new THREE.BoxGeometry(1.0, TOWER_H, 1.0), matTower);
        tower.position.set(bx, TOWER_H / 2 - 2.5, bz);   // base dips below the deck
        group.add(tower);
      }
      const cross = new THREE.Mesh(new THREE.BoxGeometry(ROAD_HW * 2 + 2.0, 0.8, 0.8), matTower);
      cross.position.set(s.x, TOWER_H - 2.5, s.z);
      cross.rotation.y = s.a;
      group.add(cross);
    }

    // Cable height profile: rises to the towers, sags at the ends and mid-span
    function cableY(i) {
      const t0 = towerAt[0], t1 = towerAt[1], END = 1.6;
      if (i <= t0) { const u = i / t0; return END + (DECK_TOP - END) * (u * u); }
      if (i >= t1) { const u = (n - 1 - i) / (n - 1 - t1); return END + (DECK_TOP - END) * (u * u); }
      const u = (i - t0) / (t1 - t0);
      return DECK_TOP - Math.sin(u * Math.PI) * 4.5;
    }

    // Main cables (segment boxes) + vertical hangers on both sides
    for (const side of [-1, 1]) {
      let prev = null;
      for (let i = 0; i < n; i++) {
        const s = samples[i];
        const px = Math.cos(s.a), pz = -Math.sin(s.a);
        const cx = s.x + side * px * ROAD_HW;
        const cz = s.z + side * pz * ROAD_HW;
        const cy = cableY(i);
        if (prev) {
          const dlen = Math.hypot(cx - prev.x, cy - prev.y, cz - prev.z) || 1;
          const seg = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, dlen), matCable);
          seg.position.set((cx + prev.x) / 2, (cy + prev.y) / 2, (cz + prev.z) / 2);
          seg.lookAt(cx, cy, cz);
          group.add(seg);
        }
        if (cy > 1.3) {
          const hangH = cy - 1.0;
          const hang = new THREE.Mesh(new THREE.BoxGeometry(0.06, hangH, 0.06), matCable);
          hang.position.set(cx, 1.0 + hangH / 2, cz);
          group.add(hang);
        }
        prev = { x: cx, y: cy, z: cz };
      }
    }

    // Solid low railings along both deck edges
    for (const side of [-1, 1]) {
      for (let i = 0; i < n - 1; i++) {
        const s0 = samples[i], s1 = samples[i + 1];
        const px = Math.cos(s0.a), pz = -Math.sin(s0.a);
        const mx = (s0.x + s1.x) / 2 + side * px * (ROAD_HW - 0.2);
        const mz = (s0.z + s1.z) / 2 + side * pz * (ROAD_HW - 0.2);
        const segLen = Math.hypot(s1.x - s0.x, s1.z - s0.z) || 1;
        const rail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, segLen * 1.02), matCable);
        rail.position.set(mx, 0.7, mz);
        rail.rotation.y = s0.a;
        group.add(rail);
      }
    }
  }

  // A drivable deck surface (asphalt + white edge lines) for an arbitrary centerline.
  function buildDeck(group, samples, HW) {
    const n = samples.length;
    const positions = [], indices = [], uvs = [];
    let travelled = 0;
    for (let i = 0; i < n; i++) {
      const s = samples[i];
      if (i > 0) travelled += Math.hypot(s.x - samples[i - 1].x, s.z - samples[i - 1].z);
      const px = Math.cos(s.a), pz = -Math.sin(s.a);
      positions.push(s.x - px * HW, 0.12, s.z - pz * HW);
      positions.push(s.x + px * HW, 0.12, s.z + pz * HW);
      uvs.push(travelled * 0.15, 0);
      uvs.push(travelled * 0.15, HW * 2 * 0.15);
    }
    for (let i = 0; i < n - 1; i++) {
      const a0 = 2 * i, a1 = 2 * i + 1, a2 = 2 * (i + 1), a3 = 2 * (i + 1) + 1;
      indices.push(a0, a2, a1); indices.push(a1, a2, a3);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices); geo.computeVertexNormals();
    group.add(new THREE.Mesh(geo, matAsphalt));
    for (const side of [-1, 1]) {
      const ep = [], ei = [];
      const inner = HW - 0.05, outer = HW - 0.2;
      for (let i = 0; i < n; i++) {
        const s = samples[i];
        const px = Math.cos(s.a), pz = -Math.sin(s.a);
        ep.push(s.x + side * px * inner, 0.15, s.z + side * pz * inner);
        ep.push(s.x + side * px * outer, 0.15, s.z + side * pz * outer);
      }
      for (let i = 0; i < n - 1; i++) {
        const a0 = 2 * i, a1 = 2 * i + 1, a2 = 2 * (i + 1), a3 = 2 * (i + 1) + 1;
        ei.push(a0, a2, a1); ei.push(a1, a2, a3);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(ep, 3));
      g.setIndex(ei); g.computeVertexNormals();
      group.add(new THREE.Mesh(g, matEdge));
    }
  }

  // A highway-green sign with painted text (rendered via a canvas texture).
  function makeTextSign(lines) {
    const g = new THREE.Group();
    const W = 512, H = 256;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#1f6b46'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 14; ctx.strokeRect(12, 12, W - 24, H - 24);
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 56px Arial, sans-serif';
    lines.forEach((ln, i) => ctx.fillText(ln, W / 2, H * (0.5 + (i - (lines.length - 1) / 2) * 0.30)));
    const tex = new THREE.CanvasTexture(c);
    const board = new THREE.Mesh(new THREE.PlaneGeometry(7, 3.5), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
    board.position.y = 4.6; g.add(board);
    for (const dx of [-2.4, 2.4]) {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.22, 4.8, 0.22), matSignPost);
      post.position.set(dx, 2.4, 0); g.add(post);
    }
    return g;
  }

  // The long Golden-Gate-style suspension bridge that branches off toward the sea.
  // Builds its own group (added straight to the scene so it survives chunk recycling)
  // and records the centerline so the car can drive it and trigger the return-to-park.
  function buildSeaBridge(hostSamples) {
    const s = hostSamples[Math.floor(hostSamples.length * 0.5)];
    const a = s.a;
    const px = Math.cos(a), pz = -Math.sin(a);                // toward the sea (right)
    const bh = a + Math.PI * 0.5 * 0.82;                      // ~74° turn off the road, seaward
    const dirx = Math.sin(bh), dirz = Math.cos(bh);
    const HW = ROAD_HW;
    const LEN = 260, N = 56;
    const startX = s.x + px * (HW - 0.2);
    const startZ = s.z + pz * (HW - 0.2);
    const samples = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      samples.push({ x: startX + dirx * LEN * t, z: startZ + dirz * LEN * t, a: bh });
    }
    const n = samples.length;
    const group = new THREE.Group();

    // Paved apron over the turn so the junction reads cleanly
    const apron = new THREE.Mesh(new THREE.BoxGeometry(HW * 2.2, 0.05, 14), matAsphalt);
    apron.position.set(startX + dirx * 4, 0.11, startZ + dirz * 4);
    apron.rotation.y = bh; group.add(apron);

    // Drivable deck
    buildDeck(group, samples, HW);

    // Side girders + underside slab
    for (const side of [-1, 1]) {
      for (let i = 0; i < n - 1; i++) {
        const s0 = samples[i], s1 = samples[i + 1];
        const ppx = Math.cos(s0.a), ppz = -Math.sin(s0.a);
        const mx = (s0.x + s1.x) / 2 + side * ppx * HW;
        const mz = (s0.z + s1.z) / 2 + side * ppz * HW;
        const segLen = Math.hypot(s1.x - s0.x, s1.z - s0.z) || 1;
        const beam = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.9, segLen * 1.05), matBridge);
        beam.position.set(mx, 0.0, mz); beam.rotation.y = s0.a; group.add(beam);
      }
    }
    for (let i = 0; i < n - 1; i += 2) {
      const s0 = samples[i], s1 = samples[Math.min(i + 2, n - 1)];
      const segLen = Math.hypot(s1.x - s0.x, s1.z - s0.z) || 1;
      const slab = new THREE.Mesh(new THREE.BoxGeometry(HW * 2, 0.4, segLen), matBridge);
      slab.position.set((s0.x + s1.x) / 2, -0.18, (s0.z + s1.z) / 2);
      slab.rotation.y = s0.a; group.add(slab);
    }

    // Two tall towers dividing the span into thirds (Golden Gate proportions)
    const TOWER_H = 34, DECK_TOP = 27;
    const towerAt = [Math.floor(n * 0.34), Math.floor(n * 0.68)];
    for (const ti of towerAt) {
      const s2 = samples[ti];
      const ppx = Math.cos(s2.a), ppz = -Math.sin(s2.a);
      for (const side of [-1, 1]) {
        const bx = s2.x + side * ppx * (HW + 0.4);
        const bz = s2.z + side * ppz * (HW + 0.4);
        const tower = new THREE.Mesh(new THREE.BoxGeometry(1.4, TOWER_H, 1.4), matTower);
        tower.position.set(bx, TOWER_H / 2 - 3, bz); group.add(tower);
      }
      // horizontal cross struts between the two legs (the GG ladder look)
      for (const cy of [DECK_TOP - 9, DECK_TOP - 1]) {
        const strut = new THREE.Mesh(new THREE.BoxGeometry(HW * 2 + 2.2, 0.8, 0.8), matTower);
        strut.position.set(s2.x, cy, s2.z); strut.rotation.y = s2.a; group.add(strut);
      }
    }

    // Main cables (catenary) + vertical hangers, both sides
    function cableY(i) {
      const t0 = towerAt[0], t1 = towerAt[1], END = 2.0;
      if (i <= t0) { const u = i / t0; return END + (DECK_TOP - END) * (u * u); }
      if (i >= t1) { const u = (n - 1 - i) / (n - 1 - t1); return END + (DECK_TOP - END) * (u * u); }
      const u = (i - t0) / (t1 - t0);
      return DECK_TOP - Math.sin(u * Math.PI) * 7.5;
    }
    for (const side of [-1, 1]) {
      let prev = null;
      for (let i = 0; i < n; i++) {
        const s2 = samples[i];
        const ppx = Math.cos(s2.a), ppz = -Math.sin(s2.a);
        const cx = s2.x + side * ppx * HW, cz = s2.z + side * ppz * HW, cy = cableY(i);
        if (prev) {
          const dl = Math.hypot(cx - prev.x, cy - prev.y, cz - prev.z) || 1;
          const seg = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28, dl), matCable);
          seg.position.set((cx + prev.x) / 2, (cy + prev.y) / 2, (cz + prev.z) / 2);
          seg.lookAt(cx, cy, cz); group.add(seg);
        }
        if (cy > 1.6) {
          const hh = cy - 1.0;
          const hg = new THREE.Mesh(new THREE.BoxGeometry(0.08, hh, 0.08), matCable);
          hg.position.set(cx, 1.0 + hh / 2, cz); group.add(hg);
        }
        prev = { x: cx, y: cy, z: cz };
      }
    }

    // Railings
    for (const side of [-1, 1]) {
      for (let i = 0; i < n - 1; i++) {
        const s0 = samples[i], s1 = samples[i + 1];
        const ppx = Math.cos(s0.a), ppz = -Math.sin(s0.a);
        const mx = (s0.x + s1.x) / 2 + side * ppx * (HW - 0.2);
        const mz = (s0.z + s1.z) / 2 + side * ppz * (HW - 0.2);
        const segLen = Math.hypot(s1.x - s0.x, s1.z - s0.z) || 1;
        const rail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.9, segLen * 1.02), matCable);
        rail.position.set(mx, 0.75, mz); rail.rotation.y = s0.a; group.add(rail);
      }
    }

    // "Back to Portfolio Park" sign at the mouth, facing the approaching driver
    const sign = makeTextSign(['\u2190 BACK TO', 'PORTFOLIO PARK']);
    sign.position.set(startX - px * 1.0, 0, startZ - pz * 1.0);
    sign.rotation.y = -a;
    group.add(sign);

    sc.add(group);
    seaBridge = { samples, group, hw: HW };
  }

  // A drivable suburban neighbourhood that branches inland from a junction host.
  // A connector road leads to a main street with a few cul-de-sacs lined with houses.
  // Like the sea bridge, it lives in its own group (survives chunk recycling) and its
  // street centrelines are recorded so the car can drive the whole thing freely.
  function buildSuburb(hostSamples) {
    const s = hostSamples[Math.floor(hostSamples.length * 0.5)];
    const fx = Math.sin(s.a), fz = Math.cos(s.a);     // along the coast road
    const px = Math.cos(s.a), pz = -Math.sin(s.a);    // right (sea); -p is inland (left)
    const inx = -px, inz = -pz;                        // inland unit vector
    const group = new THREE.Group();
    const streets = [];                                // each: array of {x,z,a}
    const allSamples = [];

    // helper: a straight street between two points, returns its centreline samples
    function street(x0, z0, x1, z1, hw) {
      const dx = x1 - x0, dz = z1 - z0;
      const len = Math.hypot(dx, dz) || 1;
      const a = Math.atan2(dx, dz);
      const n = Math.max(2, Math.round(len / 4));
      const samples = [];
      for (let i = 0; i <= n; i++) { const t = i / n; samples.push({ x: x0 + dx * t, z: z0 + dz * t, a }); }
      buildDeck(group, samples, hw);
      streets.push(samples);
      for (const sm of samples) allSamples.push(sm);
      return samples;
    }

    // mouth at the road's inland edge
    const m0x = s.x + inx * (ROAD_HW - 0.3), m0z = s.z + inz * (ROAD_HW - 0.3);

    // ground first (under everything), a big green pad over the whole neighbourhood
    const gcx = m0x + inx * 50, gcz = m0z + inz * 50;
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(140, 120), matGreen);
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(gcx, 0.04, gcz);
    group.add(ground);

    // 1) connector road inland
    const CONN = 30, HWc = 3.4;
    const c1x = m0x + inx * CONN, c1z = m0z + inz * CONN;
    street(m0x, m0z, c1x, c1z, HWc);

    // 2) main street, running along the coast-road axis, centred at the connector end
    const HALF = 40, HWm = 3.8;
    const maX0 = c1x - fx * HALF, maZ0 = c1z - fz * HALF;
    const maX1 = c1x + fx * HALF, maZ1 = c1z + fz * HALF;
    street(maX0, maZ0, maX1, maZ1, HWm);

    // 3) three cul-de-sac branches reaching deeper inland off the main street
    const CUL = 26, HWb = 3.2, R_CUL = 6;
    const branchOff = [-26, 0, 26];
    const culEnds = [];
    for (const off of branchOff) {
      const bx0 = c1x + fx * off, bz0 = c1z + fz * off;
      const bx1 = bx0 + inx * CUL, bz1 = bz0 + inz * CUL;
      street(bx0, bz0, bx1, bz1, HWb);
      culEnds.push({ x: bx1, z: bz1 });
      // round cul-de-sac head
      const head = new THREE.Mesh(new THREE.CircleGeometry(R_CUL, 20), matAsphalt);
      head.rotation.x = -Math.PI / 2; head.position.set(bx1, 0.12, bz1);
      group.add(head);
      allSamples.push({ x: bx1, z: bz1, a: s.a }); // count the head as drivable too
    }

    // 4) houses lining the streets (set back from each side, facing the road)
    function lineHouses(samples, hw, density) {
      const n = samples.length;
      for (let i = 1; i < n - 1; i++) {
        const sm = samples[i];
        const ppx = Math.cos(sm.a), ppz = -Math.sin(sm.a);
        for (const side of [-1, 1]) {
          if (Math.random() > density) continue;
          const off = hw + 4.5 + Math.random() * 2;
          const hx = sm.x + side * ppx * off, hz = sm.z + side * ppz * off;
          const house = makeHouse(hx, hz, -sm.a + (side < 0 ? Math.PI : 0) + (Math.random() - 0.5) * 0.2);
          group.add(house);
          if (Math.random() < 0.5) group.add(makeTree(hx + side * ppx * 2.4, hz + side * ppz * 2.4));
        }
      }
    }
    lineHouses(streets[1], HWm, 0.5);     // main street
    lineHouses(streets[2], HWb, 0.7);     // cul-de-sac 1
    lineHouses(streets[3], HWb, 0.7);     // cul-de-sac 2
    lineHouses(streets[4], HWb, 0.7);     // cul-de-sac 3
    // a couple of houses around each cul-de-sac head
    for (const e of culEnds) {
      for (const ang of [0, 2.1, 4.2]) {
        if (Math.random() < 0.35) continue;
        const hx = e.x + Math.sin(ang + s.a) * (R_CUL + 4), hz = e.z + Math.cos(ang + s.a) * (R_CUL + 4);
        group.add(makeHouse(hx, hz, -(ang + s.a) + Math.PI));
      }
    }
    // scattered trees on the green between streets
    for (let i = 0; i < 22; i++) {
      const along = (Math.random() - 0.5) * 90, deep = 6 + Math.random() * 78;
      const tx = c1x + fx * along + inx * (deep - CONN), tz = c1z + fz * along + inz * (deep - CONN);
      // keep trees off the roads
      let near = false;
      for (const sm of allSamples) { if (Math.hypot(sm.x - tx, sm.z - tz) < 6) { near = true; break; } }
      if (!near) group.add(makeTree(tx, tz));
    }

    // welcome sign at the mouth, facing the approaching driver
    const sign = makeTextSign(['\u2191 SEABROOK', 'HEIGHTS']);
    sign.position.set(s.x + inx * (ROAD_HW + 1.2), 0, s.z + inz * (ROAD_HW + 1.2));
    sign.rotation.y = -s.a;
    group.add(sign);

    sc.add(group);
    suburb = { samples: allSamples, group };
  }

  // Build a chunk. Returns { group, samples, sx, sz, sa, ex, ez, ea, type }.
  function buildChunk(type, sx, sz, sa) {
    const group = new THREE.Group();

    // Sample centerline
    const samples = [];
    let x = sx, z = sz, a = sa;
    samples.push({ x, z, a });
    const stepLen = CHUNK_LEN / SAMPLES;
    for (let i = 0; i < SAMPLES; i++) {
      let dt;
      if (type.profile) {
        dt = type.profile(i, SAMPLES);
      } else if (type.s) {
        const t = i / SAMPLES;
        dt = (t < 0.5 ? type.s[0] : type.s[1]) / (SAMPLES / 2);
      } else {
        dt = type.dt / SAMPLES;
      }
      x += Math.sin(a) * stepLen;
      z += Math.cos(a) * stepLen;
      a += dt;
      samples.push({ x, z, a });
    }

    // Road mesh
    const positions = [];
    const indices = [];
    const uvs = [];
    let travelled = 0;
    for (let i = 0; i < samples.length; i++) {
      const s = samples[i];
      if (i > 0) travelled += Math.hypot(s.x - samples[i-1].x, s.z - samples[i-1].z);
      // right perpendicular: rotate forward 90° CW
      const px = Math.cos(s.a), pz = -Math.sin(s.a);
      positions.push(s.x - px * ROAD_HW, 0.10, s.z - pz * ROAD_HW); // left edge
      positions.push(s.x + px * ROAD_HW, 0.10, s.z + pz * ROAD_HW); // right edge
      uvs.push(travelled * 0.15, 0);
      uvs.push(travelled * 0.15, ROAD_HW * 2 * 0.15);
    }
    for (let i = 0; i < samples.length - 1; i++) {
      const a0 = 2 * i, a1 = 2 * i + 1, a2 = 2 * (i + 1), a3 = 2 * (i + 1) + 1;
      indices.push(a0, a2, a1);
      indices.push(a1, a2, a3);
    }
    const roadGeo = new THREE.BufferGeometry();
    roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    roadGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    roadGeo.setIndex(indices);
    roadGeo.computeVertexNormals();
    group.add(new THREE.Mesh(roadGeo, matAsphalt));

    // Cliff strip on the left side — rises up from road edge outward.
    // (Skipped on the bridge and the suburb; pushed back on a junction for the side road.)
    if (!type.bridge && !type.suburb) {
      const cliffPos = [];
      const cliffIdx = [];
      const CLIFF_NEAR = ROAD_HW + (type.junction ? 16 : 1);
      const CLIFF_FAR  = ROAD_HW + (type.junction ? 30 : 22);
      for (let i = 0; i < samples.length; i++) {
        const s = samples[i];
        const px = Math.cos(s.a), pz = -Math.sin(s.a);
        // jagged height — deterministic per chunk
        const h = 6 + Math.sin(i * 0.8 + sx * 0.1) * 2 + Math.cos(i * 0.3) * 1.5;
        cliffPos.push(s.x - px * CLIFF_NEAR, 0.10, s.z - pz * CLIFF_NEAR);
        cliffPos.push(s.x - px * CLIFF_FAR,  h,    s.z - pz * CLIFF_FAR);
      }
      for (let i = 0; i < samples.length - 1; i++) {
        const a0 = 2 * i, a1 = 2 * i + 1, a2 = 2 * (i + 1), a3 = 2 * (i + 1) + 1;
        cliffIdx.push(a0, a1, a2);
        cliffIdx.push(a1, a3, a2);
      }
      const cliffGeo = new THREE.BufferGeometry();
      cliffGeo.setAttribute('position', new THREE.Float32BufferAttribute(cliffPos, 3));
      cliffGeo.setIndex(cliffIdx);
      cliffGeo.computeVertexNormals();
      group.add(new THREE.Mesh(cliffGeo, matCliff));

      // Junction: a flat green apron between the road and the recessed cliff
      if (type.junction) {
        const apron = [];
        const apIdx = [];
        const AP_NEAR = ROAD_HW;
        const AP_FAR  = ROAD_HW + 16;
        for (let i = 0; i < samples.length; i++) {
          const s = samples[i];
          const px = Math.cos(s.a), pz = -Math.sin(s.a);
          apron.push(s.x - px * AP_NEAR, 0.06, s.z - pz * AP_NEAR);
          apron.push(s.x - px * AP_FAR,  0.06, s.z - pz * AP_FAR);
        }
        for (let i = 0; i < samples.length - 1; i++) {
          const a0 = 2 * i, a1 = 2 * i + 1, a2 = 2 * (i + 1), a3 = 2 * (i + 1) + 1;
          apIdx.push(a0, a1, a2); apIdx.push(a1, a3, a2);
        }
        const apGeo = new THREE.BufferGeometry();
        apGeo.setAttribute('position', new THREE.Float32BufferAttribute(apron, 3));
        apGeo.setIndex(apIdx); apGeo.computeVertexNormals();
        group.add(new THREE.Mesh(apGeo, matGreen));
      }
    }

    // Beach / shoulder strip on the right — narrow strip at sea level (creates the "cliff edge to sea" feel)
    if (!type.bridge) {
      const beachPos = [];
      const beachIdx = [];
      const BEACH_NEAR = ROAD_HW + 0.6;
      const BEACH_FAR  = ROAD_HW + 30;
      for (let i = 0; i < samples.length; i++) {
        const s = samples[i];
        const px = Math.cos(s.a), pz = -Math.sin(s.a);
        beachPos.push(s.x + px * BEACH_NEAR, 0.05, s.z + pz * BEACH_NEAR);
        beachPos.push(s.x + px * BEACH_FAR, -0.4, s.z + pz * BEACH_FAR);
      }
      for (let i = 0; i < samples.length - 1; i++) {
        const a0 = 2 * i, a1 = 2 * i + 1, a2 = 2 * (i + 1), a3 = 2 * (i + 1) + 1;
        beachIdx.push(a0, a2, a1);
        beachIdx.push(a1, a2, a3);
      }
      const beachGeo = new THREE.BufferGeometry();
      beachGeo.setAttribute('position', new THREE.Float32BufferAttribute(beachPos, 3));
      beachGeo.setIndex(beachIdx);
      beachGeo.computeVertexNormals();
      group.add(new THREE.Mesh(beachGeo, matBeach));
    }

    // White edge lines along both sides of the road
    function makeEdgeLine(side) {
      const ep = []; const ei = [];
      const inner = ROAD_HW - 0.05;
      const outer = ROAD_HW - 0.20;
      for (let i = 0; i < samples.length; i++) {
        const s = samples[i];
        const px = Math.cos(s.a), pz = -Math.sin(s.a);
        ep.push(s.x + side * px * inner, 0.13, s.z + side * pz * inner);
        ep.push(s.x + side * px * outer, 0.13, s.z + side * pz * outer);
      }
      for (let i = 0; i < samples.length - 1; i++) {
        const a0 = 2 * i, a1 = 2 * i + 1, a2 = 2 * (i + 1), a3 = 2 * (i + 1) + 1;
        ei.push(a0, a2, a1); ei.push(a1, a2, a3);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(ep, 3));
      g.setIndex(ei); g.computeVertexNormals();
      return new THREE.Mesh(g, matEdge);
    }
    group.add(makeEdgeLine(+1));
    group.add(makeEdgeLine(-1));

    // Dashed centerline — short cream dashes spaced like real road markings
    for (let i = 0; i < samples.length - 1; i += 3) {
      const s0 = samples[i], s1 = samples[i + 1];
      const segLen = Math.hypot(s1.x - s0.x, s1.z - s0.z);
      const dash = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.03, segLen * 0.55), matDash);
      dash.position.set((s0.x + s1.x) / 2, 0.135, (s0.z + s1.z) / 2);
      dash.rotation.y = s0.a;
      group.add(dash);
    }

    // Roadside scenery — skipped entirely on the bridge (it spans open water).
    if (!type.bridge) {
    // Guardrail on the sea side — Greek roadside delineators (white post, red band,
    // reflector facing traffic), occasionally replaced by a continuous low stone wall.
    // (Skipped on the sea-bridge host so the branch mouth stays open.)
    if (!type.seaBridge) {
    const wallRun = Math.random() < 0.55;
    const wallStart = Math.floor(Math.random() * (samples.length - 8));
    const wallLen = 6 + Math.floor(Math.random() * 5);
    if (wallRun) makeStoneWall(group, samples, wallStart, wallLen);
    for (let i = 1; i < samples.length - 1; i += 2) {
      if (wallRun && i >= wallStart && i < wallStart + wallLen) continue;
      const s = samples[i];
      const px = Math.cos(s.a), pz = -Math.sin(s.a);
      group.add(makeMarkerPost(s.x + px * (ROAD_HW + 0.45), s.z + pz * (ROAD_HW + 0.45), -s.a));
    }
    }

    // Sharp sweeps get red-and-white chevron boards on the outside of the bend
    if (type.dt && Math.abs(type.dt) >= 0.5) {
      const outer = type.dt > 0 ? -1 : 1;   // outside of the bend
      for (const f of [0.35, 0.6]) {
        const s = samples[Math.floor(samples.length * f)];
        const px = Math.cos(s.a), pz = -Math.sin(s.a);
        group.add(makeChevron(s.x + outer * px * (ROAD_HW + 1.1), s.z + outer * pz * (ROAD_HW + 1.1), -s.a, type.dt > 0));
      }
    }

    // A kandylaki (roadside shrine) now and then on the cliff side — candle facing the road
    if (!type.suburb && !type.junction && Math.random() < 0.10) {
      const s = samples[Math.floor(samples.length * (0.3 + Math.random() * 0.4))];
      const px = Math.cos(s.a), pz = -Math.sin(s.a);
      group.add(makeShrine(s.x - px * (ROAD_HW + 1.3), s.z - pz * (ROAD_HW + 1.3), -s.a));
    }

    // Mixed Mediterranean planting on the cliff side — cypress, pine, olive, with bougainvillea bushes between
    // (skipped on the suburb host, where the connector road occupies the inland edge)
    for (let i = 1; i < samples.length && !type.suburb; i += 2) {
      if (Math.random() < 0.30) continue;
      const s = samples[i];
      const px = Math.cos(s.a), pz = -Math.sin(s.a);
      const off = ROAD_HW + 3 + Math.random() * 9;
      const x = s.x - px * off, z = s.z - pz * off;
      const r = Math.random();
      if (r < 0.40)      group.add(makeTree(x, z));         // cypress/pine
      else if (r < 0.75) group.add(makeOlive(x, z));        // olive
      else                group.add(makeBougainvillea(x, z)); // colorful bush
    }
    // Wildflower clumps right on the verge — small dabs of colour against the asphalt
    for (let i = 2; i < samples.length - 2 && !type.suburb; i += 3) {
      if (Math.random() < 0.72) continue;
      const s = samples[i];
      const px = Math.cos(s.a), pz = -Math.sin(s.a);
      const side = Math.random() < 0.75 ? -1 : 1;   // mostly the cliff verge
      const off = ROAD_HW + 0.9 + Math.random() * 1.4;
      group.add(makeFlowers(s.x + side * px * off, s.z + side * pz * off));
    }
    // Low rocks on the cliff side
    for (let i = 0; i < 4 && !type.suburb; i++) {
      const k = Math.floor(Math.random() * samples.length);
      const s = samples[k];
      const px = Math.cos(s.a), pz = -Math.sin(s.a);
      const off = ROAD_HW + 1.5 + Math.random() * 5;
      group.add(makeRock(s.x - px * off, s.z - pz * off));
    }
    // Whitewashed houses — 1-2 per chunk, clustered, set up the cliff a bit
    // (skipped on junctions, where the cliff is recessed for the side road)
    const numHouses = type.junction ? 0 : (Math.random() < 0.55 ? 1 : (Math.random() < 0.35 ? 2 : 0));
    for (let n = 0; n < numHouses; n++) {
      const k = Math.floor(samples.length * (0.25 + Math.random() * 0.5));
      const s = samples[k];
      const px = Math.cos(s.a), pz = -Math.sin(s.a);
      const off = ROAD_HW + 8 + Math.random() * 5;
      const house = makeHouse(s.x - px * off, s.z - pz * off, -s.a + (Math.random() - 0.5) * 0.5);
      house.position.y = 1.5 + Math.random() * 3;
      group.add(house);
      // A bougainvillea right beside the house — classic Amalfi look
      if (Math.random() < 0.7) {
        const bx = s.x - px * (off - 1.6) + (Math.random() - 0.5) * 1.5;
        const bz = s.z - pz * (off - 1.6) + (Math.random() - 0.5) * 1.5;
        const bush = makeBougainvillea(bx, bz);
        bush.position.y = house.position.y - 0.2;
        group.add(bush);
      }
    }
    // Occasional small boat in the sea (sea-side)
    if (Math.random() < 0.32) {
      const k = Math.floor(samples.length * (0.2 + Math.random() * 0.6));
      const s = samples[k];
      const px = Math.cos(s.a), pz = -Math.sin(s.a);
      const off = ROAD_HW + 25 + Math.random() * 25;
      group.add(makeBoat(s.x + px * off, s.z + pz * off, -s.a + Math.PI / 2 + (Math.random() - 0.5) * 0.8));
    }

    // The side road for a junction chunk — a full neighbourhood on the suburb host,
    // otherwise the short decorative spur.
    if (type.suburb) buildSuburb(samples);
    else if (type.junction) buildJunctionSpur(group, samples);
    } // end !bridge scenery

    // The short scenic suspension span over the water
    if (type.bridge) buildBridge(group, samples);
    // The long Golden-Gate-style bridge branching off toward the sea
    if (type.seaBridge) buildSeaBridge(samples);

    sc.add(group);
    const end = samples[samples.length - 1];
    return { group, samples, sx, sz, sa, ex: end.x, ez: end.z, ea: end.a, type, isBridge: !!type.bridge };
  }

  // Geometry disposal (materials are shared, never disposed)
  function disposeChunk(ch) {
    sc.remove(ch.group);
    ch.group.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  }

  // ----- chunk pool -----
  const chunks = [];
  // First chunk straight so the car spawns with a clear runway
  let cx0 = 0, cz0 = 0, ca0 = 0;
  let prevT = TYPES[0];
  for (let i = 0; i < ACTIVE; i++) {
    const t = i < 2 ? TYPES[0] : nextType(prevT);
    const ch = buildChunk(t, cx0, cz0, ca0);
    chunks.push(ch);
    chunksBuilt++;
    cx0 = ch.ex; cz0 = ch.ez; ca0 = ch.ea; prevT = t;
  }


  // ===== Bot traffic =====
  const BOT_TYPES = [
    { name: 'taxi',    color: 0xf5cb31, top: 0x1a1a1a, size: [1.65, 1.45, 3.9] },
    { name: 'truck',   color: 0xa42626, top: 0xe6dcc0, size: [2.0,  2.1,  5.4], cargo: true },
    { name: 'van',     color: 0x3a6cc6, top: 0xf2f2f2, size: [1.9,  2.0,  4.6] },
    { name: 'compact', color: 0x4b9c5e, top: 0x1a1a1a, size: [1.55, 1.35, 3.4] },
  ];
  const matWheelBot = new THREE.MeshLambertMaterial({ color: 0x111114 });
  const wheelGeoBot = new THREE.CylinderGeometry(0.40, 0.40, 0.28, 12);

  function makeBot(idx) {
    const t = BOT_TYPES[idx];
    const g = new THREE.Group();
    const [w, h, d] = t.size;
    const bodyMat = new THREE.MeshPhongMaterial({ color: t.color, shininess: 60 });
    const topMat  = new THREE.MeshPhongMaterial({ color: t.top,   shininess: 80 });

    // Lower hull
    const lower = new THREE.Mesh(new THREE.BoxGeometry(w, h * 0.55, d), bodyMat);
    lower.position.y = h * 0.55 / 2 + 0.4;
    g.add(lower);

    // Cabin (greenhouse) — for trucks it's a smaller cab over the front, for others a centered cabin
    if (t.cargo) {
      const cab = new THREE.Mesh(new THREE.BoxGeometry(w * 0.95, h * 0.55, d * 0.32), bodyMat);
      cab.position.set(0, h * 0.55 + h * 0.55 / 2 + 0.4, d * 0.32);
      g.add(cab);
      const cabGlass = new THREE.Mesh(new THREE.BoxGeometry(w * 0.92, h * 0.30, d * 0.30), new THREE.MeshPhongMaterial({ color: 0x0e1014, shininess: 100 }));
      cabGlass.position.set(0, h * 0.55 + h * 0.40 + 0.4, d * 0.32);
      g.add(cabGlass);
      // Cargo box behind cab
      const cargo = new THREE.Mesh(new THREE.BoxGeometry(w * 0.98, h * 0.82, d * 0.58), topMat);
      cargo.position.set(0, h * 0.55 / 2 + h * 0.82 / 2 + 0.4, -d * 0.22);
      g.add(cargo);
    } else {
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(w * 0.88, h * 0.42, d * 0.55), topMat);
      cabin.position.set(0, h * 0.55 + h * 0.42 / 2 + 0.4, -d * 0.04);
      g.add(cabin);
      const cGlass = new THREE.Mesh(new THREE.BoxGeometry(w * 0.84, h * 0.30, d * 0.50), new THREE.MeshPhongMaterial({ color: 0x0e1014, shininess: 100 }));
      cGlass.position.set(0, h * 0.55 + h * 0.30 / 2 + 0.4 + 0.04, -d * 0.04);
      g.add(cGlass);
    }

    // Wheels
    const wx = w / 2 + 0.04, wz = d * 0.34;
    [[wx, wz], [-wx, wz], [wx, -wz], [-wx, -wz]].forEach(([x, z]) => {
      const wh = new THREE.Mesh(wheelGeoBot, matWheelBot);
      wh.rotation.z = Math.PI / 2;
      wh.position.set(x, 0.4, z);
      g.add(wh);
    });

    // Headlights / taillights as little glowing planes
    const hl = new THREE.MeshBasicMaterial({ color: 0xfff2b8 });
    const tl = new THREE.MeshBasicMaterial({ color: 0xcc2418 });
    [-1, 1].forEach(s => {
      const ph = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.18), hl);
      ph.position.set(s * w * 0.35, 0.85, d / 2 + 0.01); g.add(ph);
      const pt = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.18), tl);
      pt.position.set(s * w * 0.35, 0.85, -d / 2 - 0.01); pt.rotation.y = Math.PI; g.add(pt);
    });

    return g;
  }

  const bots = [];
  const LANE_OFFSET = ROAD_HW * 0.45;

  // Type-specific base speeds — truck slow, taxi fast, others in between
  const BOT_BASE_SPEED = {
    0: [0.50, 0.62],  // taxi
    1: [0.30, 0.40],  // truck (slow)
    2: [0.40, 0.50],  // van
    3: [0.46, 0.56],  // compact
  };
  function spawnBot(typeIdx, direction, chunksAhead) {
    let ci = KEEP_BEHIND + chunksAhead;
    ci = Math.max(0, Math.min(chunks.length - 2, ci));
    const [smin, smax] = BOT_BASE_SPEED[typeIdx] || [0.42, 0.55];
    const bot = {
      mesh: makeBot(typeIdx),
      typeIdx,
      chunkI: ci,
      sampleI: direction > 0 ? 0 : chunks[ci].samples.length - 2,
      t: direction > 0 ? 0 : 1,
      direction,
      baseSpeed: smin + Math.random() * (smax - smin),
      seed: Math.random() * 100,
    };
    sc.add(bot.mesh);
    bots.push(bot);
  }
  function despawnBot(i) {
    const b = bots[i];
    sc.remove(b.mesh);
    b.mesh.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    bots.splice(i, 1);
  }
  // initial bots — mixed types and directions, spread out for a populated feel
  spawnBot(0, +1, 4);   // taxi ahead, same direction
  spawnBot(1, +1, -1);  // truck just behind
  spawnBot(2, -1, 5);   // van oncoming
  spawnBot(3, -1, 9);   // compact oncoming further ahead
  spawnBot(3, +1, 7);   // compact ahead, same direction
  spawnBot(2, +1, 1);   // van just ahead
  spawnBot(0, -1, 7);   // taxi oncoming
  spawnBot(1, -1, 11);  // truck oncoming, far ahead

  function updateBots() {
    for (let i = bots.length - 1; i >= 0; i--) {
      const b = bots[i];
      let chunk = chunks[b.chunkI];
      // If the chunk this bot lives in was recycled out, drop & respawn ahead.
      if (!chunk) {
        const td = b.typeIdx, dir = b.direction;
        despawnBot(i);
        spawnBot(td, dir, dir > 0 ? 6 : 8);
        continue;
      }

      // Guard: if a respawn/recycle left sampleI out of range, clamp it.
      if (b.sampleI < 0) b.sampleI = 0;
      if (b.sampleI > chunk.samples.length - 2) b.sampleI = chunk.samples.length - 2;

      const s0 = chunk.samples[b.sampleI];
      const s1 = chunk.samples[b.sampleI + 1];
      const segLen = Math.hypot(s1.x - s0.x, s1.z - s0.z) || 1;
      // slow down through corners + a small ebb/flow over time so traffic doesn't feel robotic
      const localCurv = Math.abs(s1.a - s0.a);
      const speedFactor = Math.max(0.55, 1 - localCurv * 6.0);
      const moveSpeed = b.baseSpeed * speedFactor * (1 + Math.sin(performance.now() * 0.0008 + b.seed) * 0.07);
      b.t += (moveSpeed * b.direction) / segLen;

      // Advance along the polyline, crossing into neighbouring chunks as needed.
      let respawned = false;
      while (b.t >= 1) {
        b.t -= 1; b.sampleI++;
        if (b.sampleI >= chunk.samples.length - 1) {
          // reached the end of this chunk — step into the next one
          if (b.chunkI < chunks.length - 2) {
            b.chunkI++; b.sampleI = 0; chunk = chunks[b.chunkI];
          } else {
            // ran off the front of the world — recycle behind the player
            despawnBot(i); spawnBot(b.typeIdx, b.direction, b.direction > 0 ? -1 : 8);
            respawned = true; break;
          }
        }
      }
      if (respawned) continue;
      while (b.t < 0) {
        b.t += 1; b.sampleI--;
        if (b.sampleI < 0) {
          // reached the start of this chunk — step into the previous one
          if (b.chunkI > 0) {
            b.chunkI--; chunk = chunks[b.chunkI]; b.sampleI = chunk.samples.length - 2;
          } else {
            // ran off the back of the world — recycle ahead of the player
            despawnBot(i); spawnBot(b.typeIdx, b.direction, b.direction > 0 ? 5 : 9);
            respawned = true; break;
          }
        }
      }
      if (respawned) continue;

      const ss0 = chunk.samples[b.sampleI];
      const ss1 = chunk.samples[b.sampleI + 1];
      const tt = Math.max(0, Math.min(1, b.t));
      const wx = ss0.x + (ss1.x - ss0.x) * tt;
      const wz = ss0.z + (ss1.z - ss0.z) * tt;
      const wa = ss0.a + (ss1.a - ss0.a) * tt;
      // right perpendicular (same convention as the road builder)
      const px = Math.cos(wa), pz = -Math.sin(wa);
      // Right-hand traffic (as in Greece): traffic travelling with the player keeps to
      // the -perpendicular lane; oncoming traffic passes on the +perpendicular lane.
      const laneSide = b.direction > 0 ? -1 : +1;
      b.mesh.position.set(wx + px * LANE_OFFSET * laneSide, 0.1, wz + pz * LANE_OFFSET * laneSide);
      b.mesh.rotation.y = wa + (b.direction < 0 ? Math.PI : 0);
      // Lean into the turn — visual roll proportional to local curvature
      const lean = -(ss1.a - ss0.a) * b.direction * 2.2;
      b.mesh.rotation.z = Math.max(-0.10, Math.min(0.10, lean));
    }
  }
  // ----- car (same Audi A3 as the park) -----

  }
