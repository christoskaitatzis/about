    add(Box(1.8, 0.24, 0.3), dark, 0, 0.36, -2.08);                  // rear diffuser
    [-0.36, -0.14, 0.14, 0.36].forEach(ex => add(new THREE.CylinderGeometry(0.07, 0.07, 0.18, 12), chrome, ex, 0.46, -2.2, Math.PI / 2)); // quad exhausts
    const tire = new THREE.CylinderGeometry(0.56, 0.56, 0.42, 22);
    const tireMat = new THREE.MeshLambertMaterial({ color: 0x0f1012 });
    const alloy = new THREE.MeshPhongMaterial({ color: 0x32353b, shininess: 90, specular: 0xffffff });
    const caliper = new THREE.MeshLambertMaterial({ color: 0xcc1a1a });
    [[1.0, 1.4], [-1.0, 1.4], [1.0, -1.4], [-1.0, -1.4]].forEach(([wx, wz]) => {
      const w = new THREE.Mesh(tire, tireMat); w.rotation.z = Math.PI / 2; w.position.set(wx, 0.56, wz); g.add(w);
      const face = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.44, 6), alloy); face.rotation.z = Math.PI / 2; face.position.set(wx, 0.56, wz); g.add(face);
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.46, 8), chrome); cap.rotation.z = Math.PI / 2; cap.position.set(wx, 0.56, wz); g.add(cap);
      const cal = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.3, 0.1), caliper); cal.position.set(wx + (wx > 0 ? -0.12 : 0.12), 0.56, wz); g.add(cal);
    });
    return g;
  }
  function carKind() { try { return localStorage.getItem('pp_car') || sessionStorage.getItem('pp_car') || 'classic'; } catch (_) { return 'classic'; } }
  function makeCar() { return carKind() === 'ferrari' ? makeFerrari() : makeClassicCar(); }
  const carMesh = makeCar();
  sc.add(carMesh);
  carMesh.position.y = 0.1;

  // Spawn near the start of chunk 0
  const car = { x: chunks[0].sx, z: chunks[0].sz + 2, angle: chunks[0].sa, speed: 0 };

  // ----- input -----
  const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
  let started = false;
  function setKey(k, v) { if (k in keys) keys[k] = !!v; }
  window.addEventListener('keydown', e => {
    const m = { ArrowUp:'ArrowUp', ArrowDown:'ArrowDown', ArrowLeft:'ArrowLeft', ArrowRight:'ArrowRight', w:'ArrowUp', s:'ArrowDown', a:'ArrowLeft', d:'ArrowRight', W:'ArrowUp', S:'ArrowDown', A:'ArrowLeft', D:'ArrowRight' };
    const k = m[e.key]; if (!k) return;
    e.preventDefault(); setKey(k, true); if (!started) startRun();
  });
  window.addEventListener('keyup', e => {
    const m = { ArrowUp:'ArrowUp', ArrowDown:'ArrowDown', ArrowLeft:'ArrowLeft', ArrowRight:'ArrowRight', w:'ArrowUp', s:'ArrowDown', a:'ArrowLeft', d:'ArrowRight', W:'ArrowUp', S:'ArrowDown', A:'ArrowLeft', D:'ArrowRight' };
    const k = m[e.key]; if (!k) return;
    e.preventDefault(); setKey(k, false);
  });
  // Touch buttons
  [['ctrl-up','ArrowUp'],['ctrl-down','ArrowDown'],['ctrl-left','ArrowLeft'],['ctrl-right','ArrowRight']].forEach(([id, key]) => {
    const btn = document.getElementById(id);
    const press = (e) => { e.preventDefault(); e.stopPropagation(); btn.classList.add('active'); setKey(key, true); if (!started) startRun(); };
    const release = (e) => { e.preventDefault(); e.stopPropagation(); btn.classList.remove('active'); setKey(key, false); };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('pointerleave', release);
  });
  document.getElementById('start').addEventListener('click', () => { startRun(); });
  function startRun() {
    started = true;
    document.getElementById('start').style.display = 'none';
  }

  // ----- vintage radio -----
  // Turn the knob ON to play; tracks are picked at random and roll into the next one.
  const PLAYLIST = ['powerful_rock.mp3', 'audioknap.mp3', 'music_unlimited.mp3', 'round_round.mp3', 'diamond_tunes_indie.mp3'];
  const prettyName = (f) => f.replace(/\.mp3$/i, '').replace(/[_-]+/g, ' ').replace(/\b\w/g, (m) => m.toUpperCase());
  // Two audio "decks" that alternate, so the ending track fades down while the next
  // fades up — a smooth radio-style crossfade rather than a hard cut.
  const decks = [new Audio(), new Audio()];
  decks.forEach((d) => { d.loop = false; d.volume = 0; d.preload = 'auto'; });
  let MAX_VOL = 0.5;               // current volume level (0..1), set by the VOL knob
  try { const v = parseFloat(localStorage.getItem('pp_radio_vol')); if (isFinite(v)) MAX_VOL = Math.max(0, Math.min(1, v)); } catch (_) {}
  const FADE = 2.8;                 // crossfade length (seconds)
  const radioEl = document.getElementById('radio');
  const radioNow = document.getElementById('radio-now');
  const radioNeedle = document.getElementById('radio-needle');
  const radioKnob = document.getElementById('radio-knob');
  let radioOn = false;
  let cur = 0;                      // index of the active deck
  let lastTrack = -1;
  let failCount = 0;
  let armed = false;               // has the next track's crossfade been triggered?

  function pickIndex() {
    if (PLAYLIST.length === 0) return -1;
    let i = Math.floor(Math.random() * PLAYLIST.length);
    if (PLAYLIST.length > 1 && i === lastTrack) i = (i + 1) % PLAYLIST.length;
    lastTrack = i; return i;
  }
  function showTrack(i) {
    radioNow.textContent = '♪ ' + prettyName(PLAYLIST[i]);
    radioNeedle.style.left = (12 + (i / Math.max(1, PLAYLIST.length - 1)) * 76) + '%';
  }
  // ramp a deck's volume over `dur` seconds; newer ramps supersede older ones on the same deck
  function ramp(deck, to, dur, done) {
    const id = (deck._rampId = (deck._rampId || 0) + 1);
    const from = deck.volume, t0 = performance.now();
    (function step() {
      if (deck._rampId !== id) return;                 // cancelled by a newer ramp
      const k = dur <= 0 ? 1 : Math.min(1, (performance.now() - t0) / (dur * 1000));
      deck.volume = Math.max(0, Math.min(1, from + (to - from) * k));
      if (k < 1) requestAnimationFrame(step);
      else if (done) done();
    })();
  }
  // start `i` on the idle deck, fade it up, fade the current one down
  function crossfadeTo(i, fadeIn) {
    if (i < 0) return;
    const outD = decks[cur], inD = decks[cur ^ 1];
    inD.src = PLAYLIST[i];
    inD.volume = 0;
    inD.currentTime = 0;
    inD.play().then(() => { failCount = 0; }).catch(() => {});
    showTrack(i);
    cur ^= 1;                                           // incoming deck is now current
    armed = false;
    ramp(inD, MAX_VOL, fadeIn || FADE);
    if (!outD.paused) ramp(outD, 0, FADE, () => { outD.pause(); });
  }

  decks.forEach((d) => {
    // arm the crossfade a little before the current track ends
    d.addEventListener('timeupdate', function () {
      if (!radioOn || this !== decks[cur] || armed) return;
      const dur = this.duration;
      if (!isFinite(dur) || dur < FADE * 1.5) return;
      if (dur - this.currentTime <= FADE) crossfadeTo(pickIndex());
    });
    // fallback: if a track ends without a crossfade (unknown/short duration), roll on
    d.addEventListener('ended', function () {
      if (!radioOn || this !== decks[cur] || armed) return;
      crossfadeTo(pickIndex(), 0.6);
    });
    // a track failed to load — try another, but don't spin forever if all are missing
    d.addEventListener('error', function () {
      if (!radioOn || this !== decks[cur]) return;
      if (failCount++ < PLAYLIST.length) crossfadeTo(pickIndex(), 0.6);
      else radioNow.textContent = '— NO SIGNAL —';
    });
  });

  function setRadio(on) {
    radioOn = on;
    radioEl.classList.toggle('on', on);
    radioEl.classList.toggle('off', !on);
    if (on) {
      failCount = 0; armed = false;
      const i = pickIndex();
      const d = decks[cur];
      d.src = PLAYLIST[i]; d.volume = 0; d.currentTime = 0;
      d.play().then(() => { failCount = 0; }).catch(() => {});
      showTrack(i);
      ramp(d, MAX_VOL, 1.2);                            // gentle fade-in on power-on
    } else {
      armed = false;
      decks.forEach((d) => { if (!d.paused) ramp(d, 0, 0.8, () => d.pause()); });
      radioNow.textContent = '— OFF —';
    }
  }
  radioKnob.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); setRadio(!radioOn); });

  // ----- volume knob (turn to adjust) -----
  const volKnob = document.getElementById('radio-vol');
  function paintVol() { volKnob.style.transform = 'rotate(' + (-135 + MAX_VOL * 270) + 'deg)'; }
  function applyVol(v) {
    MAX_VOL = Math.max(0, Math.min(1, v));
    paintVol();
    try { localStorage.setItem('pp_radio_vol', MAX_VOL.toFixed(3)); } catch (_) {}
    // reflect immediately on the deck that's currently sounding (cancel any live ramp on it)
    if (radioOn) { const d = decks[cur]; d._rampId = (d._rampId || 0) + 1; if (!d.paused) d.volume = MAX_VOL; }
  }
  paintVol();
  // rotary drag (works for mouse + touch); grabbing anywhere on the knob turns it
  let volDrag = false, lastAng = 0;
  const angOf = (e) => { const r = volKnob.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)); };
  volKnob.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); volDrag = true; lastAng = angOf(e); try { volKnob.setPointerCapture(e.pointerId); } catch (_) {} });
  volKnob.addEventListener('pointermove', (e) => {
    if (!volDrag) return;
    const a = angOf(e); let da = a - lastAng;
    while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
    lastAng = a;
    applyVol(MAX_VOL + da / (1.5 * Math.PI));   // ~270° of turn spans the full range
  });
  const endVol = (e) => { volDrag = false; try { volKnob.releasePointerCapture(e.pointerId); } catch (_) {} };
  volKnob.addEventListener('pointerup', endVol);
  volKnob.addEventListener('pointercancel', endVol);
  // mouse wheel nudges volume on desktop
  volKnob.addEventListener('wheel', (e) => { e.preventDefault(); applyVol(MAX_VOL + (e.deltaY < 0 ? 0.05 : -0.05)); }, { passive: false });

  // Seamless entry: if we drove in from the park, skip the splash and start at once.
  if (RESUME_RET) startRun();

  // ----- fullscreen -----
  const fsBtn = document.getElementById('fs-toggle');
  fsBtn.addEventListener('click', (e) => {
    e.preventDefault();
    const inFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (!inFs) {
      const fn = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
      if (fn) fn.call(document.documentElement);
    } else {
      const fn = document.exitFullscreen || document.webkitExitFullscreen;
      if (fn) fn.call(document);
    }
  });
  ['fullscreenchange','webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => {
    const inFs = document.fullscreenElement || document.webkitFullscreenElement;
    fsBtn.textContent = inFs ? '⛶ Exit Fullscreen' : '⛶ Fullscreen';
  }));

  // ----- tilt -----
  const tilt = { on: false, c: false, nB: 0, sB: 0, sBg: 0, gO: false, bO: false };
  const tiltBtn = document.getElementById('tilt-toggle');
  tiltBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); toggleTilt(); });
  function toggleTilt() {
    if (!tilt.on) {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(s => { if (s === 'granted') tiltOn(); }).catch(() => {});
      } else tiltOn();
    } else tiltOff();
  }
  function tiltOn() {
    tilt.on = true; tilt.c = false;
    window.addEventListener('deviceorientation', onTilt, true);
    tiltBtn.textContent = '📱 Tilt ON';
    tiltBtn.style.background = '#4b8bcc'; tiltBtn.style.color = '#fff';
  }
  function tiltOff() {
    tilt.on = false;
    setKey('ArrowUp', false); setKey('ArrowDown', false);
    window.removeEventListener('deviceorientation', onTilt, true);
    tiltBtn.textContent = '📱 Tilt OFF';
    tiltBtn.style.background = 'rgba(255,255,255,.88)'; tiltBtn.style.color = '#34404f';
  }
  function onTilt(e) {
    const b = e.beta; if (b == null) return;
    if (!tilt.c) { tilt.nB = b; tilt.sB = b; tilt.sBg = b; tilt.c = true; }
    tilt.sB = tilt.sB * 0.55 + b * 0.45;
    tilt.sBg = tilt.sBg * 0.92 + b * 0.08;
    const db = tilt.sB - tilt.nB, dbg = tilt.sBg - tilt.nB, df = 8;
    const wG = tilt.gO ? (dbg < -df * 0.55) : (dbg < -df);
    const wB = db > df;
    if (wG !== tilt.gO) { tilt.gO = wG; setKey('ArrowUp', wG); if (wG && !started) startRun(); }
    if (wB !== tilt.bO) { tilt.bO = wB; setKey('ArrowDown', wB); }
  }

  // ----- physics + chunk maintenance -----
  const OFF_DECAY = 0.965;
  // Smoothed steering input (-1..1). Attack ≈ 250ms to full lock; release a touch quicker.
  let steer = 0;
  const STEER_ATTACK = 0.115;
  const STEER_RELEASE = 0.22;

  function nearestSampleDist() {
    // Find nearest sample point across the active chunks (linear scan, but only a few hundred points total)
    let best = Infinity;
    let bestChunkI = 0;
    let bestSampleI = 0;
    for (let i = 0; i < chunks.length; i++) {
      const samples = chunks[i].samples;
      for (let j = 0; j < samples.length; j++) {
        const p = samples[j];
        const d = (p.x - car.x) * (p.x - car.x) + (p.z - car.z) * (p.z - car.z);
        if (d < best) { best = d; bestChunkI = i; bestSampleI = j; }
      }
    }
    // Also consider the sea bridge (so the car isn't penalised on it and we can detect its end)
    let onBridge = false, bridgeSampleI = -1, bridgeBest = Infinity;
    if (seaBridge) {
      const bs = seaBridge.samples;
      for (let j = 0; j < bs.length; j++) {
        const p = bs[j];
        const d = (p.x - car.x) * (p.x - car.x) + (p.z - car.z) * (p.z - car.z);
        if (d < bridgeBest) { bridgeBest = d; bridgeSampleI = j; }
      }
      if (bridgeBest < best) onBridge = true;
    }
    // Also consider the suburb streets (drivable, no off-road penalty there)
    let subBest = Infinity;
    if (suburb) {
      const ss = suburb.samples;
      for (let j = 0; j < ss.length; j++) {
        const p = ss[j];
        const d = (p.x - car.x) * (p.x - car.x) + (p.z - car.z) * (p.z - car.z);
        if (d < subBest) subBest = d;
      }
    }
    const roadDist = Math.sqrt(best);
    const brDist = Math.sqrt(bridgeBest);
    const subDist = Math.sqrt(subBest);
    // nearest drivable surface overall (used for the off-road penalty)
    const dist = Math.min(roadDist, brDist, subDist);
    // only count as "on the bridge" when the bridge is the nearest drivable surface
    if (onBridge && !(brDist <= roadDist && brDist <= subDist)) onBridge = false;
    return { dist, chunkI: bestChunkI, sampleI: bestSampleI, onBridge, bridgeSampleI };
  }

  function updatePhysics() {
    // Cruising tuning — generous top speed, easy acceleration, soft steering
    // Performance depends on the chosen car — the Ferrari is quicker off the line
    // and has a noticeably higher top speed; the classic keeps its relaxed tune.
    const fer = carKind() === 'ferrari';
    const accel = fer ? 0.024 : 0.018, maxF = fer ? 0.88 : 0.70, maxR = 0.30, friction = 0.030, turn = 0.030;
    if (keys.ArrowUp) car.speed += accel;
    if (keys.ArrowDown) car.speed -= accel;
    car.speed *= (1 - friction);
    car.speed = Math.max(-maxR, Math.min(maxF, car.speed));

    // ----- eased steering -----
    // Rather than snapping to full lock the instant a key goes down, the steering
    // input ramps in along a smooth curve (~250ms to full lock) and relaxes back a
    // little quicker when released. This removes the abrupt kick at turn-in while
    // keeping the car responsive.
    const steerTarget = (keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0);
    const building = Math.abs(steerTarget - steer) > 0 && Math.abs(steerTarget) >= Math.abs(steer);
    const rate = building ? STEER_ATTACK : STEER_RELEASE;
    steer += (steerTarget - steer) * rate;
    if (steerTarget === 0 && Math.abs(steer) < 0.01) steer = 0;
    // smoothstep the ramp: soft turn-in for the first fraction of travel, full authority at lock
    const sAbs = Math.min(1, Math.abs(steer));
    const steerCurve = Math.sign(steer) * sAbs * sAbs * (3 - 2 * sAbs);
    if (Math.abs(car.speed) > 0.004) {
      const grip = Math.min(1, Math.abs(car.speed) / 0.22);
      const dir = car.speed > 0 ? 1 : -1;
      car.angle += turn * grip * dir * steerCurve;
    }
    car.x += Math.sin(car.angle) * car.speed;
    car.z += Math.cos(car.angle) * car.speed;

    // Off-road penalty
    const ns = nearestSampleDist();
    if (ns.dist > ROAD_HW + 0.5) car.speed *= OFF_DECAY;

    // Reaching the far end of the long sea bridge returns to the portfolio park
    if (!bridgeReached && seaBridge && ns.onBridge && ns.bridgeSampleI >= seaBridge.samples.length - 3) {
      bridgeReached = true;
      if (window.__fadeNav) window.__fadeNav(PARK_BACK);
      else window.location.href = PARK_BACK;
    }

    // Chunk recycling: if the nearest sample is in a chunk past KEEP_BEHIND, remove the head
    while (ns.chunkI > KEEP_BEHIND) {
      const dropped = chunks.shift();
      disposeChunk(dropped);
      ns.chunkI -= 1;
      // Bots' chunkI indices shift too
      for (const b of bots) b.chunkI -= 1;
    }
    while (chunks.length < ACTIVE) {
      const last = chunks[chunks.length - 1];
      const prevType = last.type;
      const t = nextType(prevType);
      chunks.push(buildChunk(t, last.ex, last.ez, last.ea));
      chunksBuilt++;
    }
  }

  // ----- camera + render loop -----
  function updateCamera() {
    const fx = Math.sin(car.angle), fz = Math.cos(car.angle);
    const camDist = 13, camH = 6.5;
    const tx = car.x - fx * camDist, tz = car.z - fz * camDist;
    cam.position.x += (tx - cam.position.x) * 0.10;
    cam.position.z += (tz - cam.position.z) * 0.10;
    cam.position.y += (camH - cam.position.y) * 0.10;
    cam.lookAt(car.x + fx * 8, 1.4, car.z + fz * 8);
  }

  function updateCarMesh() {
    carMesh.position.set(car.x, 0.1, car.z);
    carMesh.rotation.y = car.angle;
    // body roll follows the eased steering value, so the lean builds and settles smoothly
    carMesh.rotation.z = steer * Math.min(Math.abs(car.speed) * 0.18, 0.06);
  }

  function updateHUD() {
    const kmh = Math.round(Math.abs(car.speed) * 90);
    document.getElementById('speed-val').textContent = kmh;
  }

  function loop() {
    requestAnimationFrame(loop);
    if (started) { updatePhysics(); updateBots(); }
    updateCarMesh();
    updateCamera();
    // sky + sun follow the camera position so they always sit "at infinity"
    skyboxGroup.position.copy(cam.position);
    updateHUD();
    renderer.render(sc, cam);
  }
  loop();
})();
</script>
</body>
</html>
