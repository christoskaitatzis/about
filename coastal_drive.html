<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Coastal Drive — Portfolio Park</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@800&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #cfe5ee; height: 100%; }
  body {
    font-family: 'Space Mono', monospace;
    color: #34404f;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  .pill {
    position: fixed; z-index: 9; padding: 9px 14px; border-radius: 999px;
    border: 1px solid #e0e7e2; background: rgba(255,255,255,.85); color: #34404f;
    font: 700 12px 'Space Mono', monospace; letter-spacing: 0.05em;
    text-decoration: none; cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #back-link { top: 22px; left: 24px; }
  #fs-toggle  { top: 22px; right: 24px; border: 1px solid #e0e7e2; }
  #tilt-toggle{ top: 62px; right: 24px; display: none; }
  body.mobile #tilt-toggle { display: block; }

  #hud {
    position: fixed; top: 64px; left: 24px; z-index: 8; min-width: 200px;
    padding: 14px 16px; border-radius: 14px;
    background: rgba(255,255,255,.85); border: 1px solid #e0e7e2;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 20px -10px rgba(40,60,80,.18);
  }
  #hud .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #5b7591; font-weight: 700; }
  #hud .row + .row { margin-top: 4px; }
  #hud .val { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; color: #1f2733; letter-spacing: -0.01em; }

  #start {
    position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 38%, rgba(255,255,255,.78), rgba(180,210,230,.92));
    cursor: pointer; animation: fadeOver .4s ease both;
  }
  #start .panel {
    text-align: center; padding: 36px; max-width: 460px;
  }
  #start .tag { font-size: 11px; letter-spacing: 0.18em; color: #4b8bcc; font-weight: 700; margin-bottom: 12px; }
  #start h1 { font: 800 clamp(40px, 8vw, 80px)/.95 'Syne', sans-serif; color: #34404f; letter-spacing: -0.03em; margin: 0 0 14px; }
  #start p { margin: 0 auto 22px; max-width: 380px; font-size: 14px; line-height: 1.6; color: #5b7591; }
  #start .go { display: inline-block; padding: 14px 30px; border-radius: 999px; background: #4b8bcc; color: #fff;
    font: 800 16px 'Syne', sans-serif; letter-spacing: 0.02em; box-shadow: 0 10px 26px -10px rgba(75,139,204,.7); text-decoration: none; }
  @keyframes fadeOver { from { opacity: 0; } to { opacity: 1; } }

  .ctrl {
    position: fixed; z-index: 9; width: 66px; height: 66px; border-radius: 50%;
    border: 1px solid #e0e7e2; background: rgba(255,255,255,.86); color: #34404f;
    font-size: 26px; cursor: pointer; touch-action: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 5px 14px -5px rgba(40,60,45,.35);
    display: flex; align-items: center; justify-content: center;
  }
  .ctrl.active { background: #4b8bcc; color: #fff; }
  #ctrl-up   { bottom: 100px; right: 24px; }
  #ctrl-down { bottom: 24px;  right: 24px; }
  #ctrl-left { bottom: 24px;  left:  24px; }
  #ctrl-right{ bottom: 24px;  left:  100px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="page-fade" style="position:fixed;inset:0;z-index:99999;background:#cfe5ee;opacity:1;transition:opacity .55s ease;pointer-events:none;will-change:opacity"></div>

<a id="back-link" class="pill" href="portfolio_park.html" onclick="event.preventDefault(); window.__fadeNav(this.href); return false;">← back to park</a>
<button id="fs-toggle" class="pill" type="button">⛶ Fullscreen</button>
<button id="tilt-toggle" class="pill" type="button">📱 Tilt OFF</button>

<div id="hud">
  <div class="row"><span>COASTAL DRIVE</span><span class="val">∞</span></div>
  <div class="row"><span>SPEED</span><span class="val" id="speed-val">0</span></div>
  <div class="row" style="margin-top:8px;color:#5b7591;font-weight:400"><span style="font-size:10px;letter-spacing:0">just cruise — the road never ends</span></div>
</div>

<div id="start">
  <div class="panel">
    <div class="tag">SCENIC ROUTE</div>
    <h1>COASTAL DRIVE</h1>
    <p>An endless cliffside road by a calm sea. No timer, no finish line — just drive. Tap or press any key to start.</p>
    <div class="go">Start cruising →</div>
  </div>
</div>

<button id="ctrl-up"    class="ctrl">↑</button>
<button id="ctrl-down"  class="ctrl">↓</button>
<button id="ctrl-left"  class="ctrl">←</button>
<button id="ctrl-right" class="ctrl">→</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
<script>
(() => {
  const THREE = window.THREE;
  if (!THREE) { document.getElementById('start').innerHTML = '<div class="panel"><h1>3D failed to load</h1><p>Please check your connection and try again.</p></div>'; return; }

  // ----- page fade -----
  const _pf = document.getElementById('page-fade');
  if (_pf) requestAnimationFrame(() => requestAnimationFrame(() => { _pf.style.opacity = '0'; }));
  window.__fadeNav = function (u) { if (_pf) { _pf.style.pointerEvents = 'auto'; _pf.style.opacity = '1'; setTimeout(() => { window.location.href = u; }, 560); } else { window.location.href = u; } };

  // ----- mobile flag -----
  const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (isMobile) document.body.classList.add('mobile');

  // ----- renderer / scene / camera -----
  const canvas = document.getElementById('cv');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));

  const sc = new THREE.Scene();
  sc.background = new THREE.Color(0xb6dff0);
  sc.fog = new THREE.Fog(0xb6dff0, 140, 320);

  const cam = new THREE.PerspectiveCamera(58, 1, 0.5, 600);
  cam.position.set(0, 14, 30);

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    cam.aspect = w / h; cam.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ----- lights -----
  sc.add(new THREE.HemisphereLight(0xfff5d8, 0x6f8c80, 0.95));
  const sun = new THREE.DirectionalLight(0xfff0d0, 0.85);
  sun.position.set(60, 80, 30); sc.add(sun);

  // ----- shared materials & textures -----
  const matSea     = new THREE.MeshLambertMaterial({ color: 0x3fa4c7 });
  const matBeach   = new THREE.MeshLambertMaterial({ color: 0xe7d6b2 });
  const matCliff   = new THREE.MeshLambertMaterial({ color: 0x8a7458 });
  const matGreen   = new THREE.MeshLambertMaterial({ color: 0x6e8a52 });
  const matFol     = new THREE.MeshLambertMaterial({ color: 0x5d8a44 });
  const matFolDark = new THREE.MeshLambertMaterial({ color: 0x4e7838 });
  const matWhite   = new THREE.MeshLambertMaterial({ color: 0xf3eee2 });
  const matRoof    = new THREE.MeshLambertMaterial({ color: 0xc25a3e });
  const matRail    = new THREE.MeshLambertMaterial({ color: 0xeeeeee });
  const matTrunk   = new THREE.MeshLambertMaterial({ color: 0x7a4a2c });
  const matEdge    = new THREE.MeshBasicMaterial({ color: 0xfaf6e8 });

  // Asphalt — lighter, weathered coastal-road texture (similar to worn Irish coastal asphalt)
  const asphaltTex = (() => {
    const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
    const c = cv.getContext('2d');
    // medium warm grey base — like sun-bleached, weathered asphalt
    c.fillStyle = '#6a6d6a'; c.fillRect(0, 0, 256, 256);
    // per-pixel brightness jitter (gentle, with a hint of cool/warm variation)
    const img = c.getImageData(0, 0, 256, 256);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() - 0.5) * 20;
      d[i]   = Math.max(0, Math.min(255, d[i]   + n + 1));    // slightly warm
      d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
      d[i+2] = Math.max(0, Math.min(255, d[i+2] + n - 2));    // slightly cooler blue
    }
    c.putImageData(img, 0, 0);
    // gravel chips — varied light specks
    for (let i = 0; i < 600; i++) {
      const x = Math.random() * 256, y = Math.random() * 256;
      const r = Math.random() * 0.95 + 0.25;
      const b = 130 + Math.random() * 70 | 0;
      c.fillStyle = 'rgba(' + b + ',' + b + ',' + (b - 4) + ',0.42)';
      c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    }
    // tiny darker pits / cracks
    for (let i = 0; i < 80; i++) {
      const x = Math.random() * 256, y = Math.random() * 256;
      c.fillStyle = 'rgba(35,38,40,' + (0.10 + Math.random() * 0.20).toFixed(2) + ')';
      c.fillRect(x, y, 1 + Math.random() * 2.4, 1 + Math.random() * 2.4);
    }
    // long horizontal wear streaks — these tile along the road length and read as tire-track patina
    for (let i = 0; i < 5; i++) {
      const y = Math.random() * 256;
      const h = 0.8 + Math.random() * 1.4;
      c.fillStyle = 'rgba(48,50,52,' + (0.05 + Math.random() * 0.07).toFixed(2) + ')';
      c.fillRect(0, y, 256, h);
    }
    // a couple of soft lighter washes (sun-bleached patches)
    for (let i = 0; i < 3; i++) {
      const x = Math.random() * 256, y = Math.random() * 256;
      const grad = c.createRadialGradient(x, y, 0, x, y, 60 + Math.random() * 40);
      grad.addColorStop(0, 'rgba(190,190,180,0.10)');
      grad.addColorStop(1, 'rgba(190,190,180,0)');
      c.fillStyle = grad;
      c.fillRect(0, 0, 256, 256);
    }
    const tex = new THREE.CanvasTexture(cv);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 4;
    return tex;
  })();
  const matAsphalt = new THREE.MeshLambertMaterial({ map: asphaltTex });

  // ----- global sky-dome / distant sea ring (huge, doesn't move) -----
  const seaPlane = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), matSea);
  seaPlane.rotation.x = -Math.PI / 2; seaPlane.position.y = -3; sc.add(seaPlane);

  // ----- chunk system -----
  const CHUNK_LEN = 50;
  const SAMPLES = 22;             // road samples per chunk
  const ROAD_HW = 5;              // road half-width
  const ACTIVE = 14;              // chunks alive at any time
  const KEEP_BEHIND = 3;          // chunks kept behind the car

  // Chunk types — weighted random
  const TYPES = [
    { name: 'straight',     w: 3, dt: 0,     s: false },
    { name: 'left_gentle',  w: 2, dt: 0.32,  s: false },
    { name: 'right_gentle', w: 2, dt: -0.32, s: false },
    { name: 'left_sweep',   w: 1, dt: 0.58,  s: false },
    { name: 'right_sweep',  w: 1, dt: -0.58, s: false },
    { name: 'left_s',       w: 1, dt: 0,     s: [ 0.38, -0.38] },
    { name: 'right_s',      w: 1, dt: 0,     s: [-0.38,  0.38] },
  ];
  const W_TOTAL = TYPES.reduce((a, t) => a + t.w, 0);
  function pickType(prev) {
    // Avoid back-to-back hard turns in the same direction (helps the flow feel natural)
    for (let tries = 0; tries < 4; tries++) {
      let r = Math.random() * W_TOTAL;
      for (const t of TYPES) { r -= t.w; if (r <= 0) {
        if (prev && Math.sign(t.dt) === Math.sign(prev.dt) && Math.abs(t.dt) > 0.5 && Math.abs(prev.dt) > 0.5) continue;
        return t;
      } }
    }
    return TYPES[0];
  }

  // Builders
  function makeTree(x, z) {
    const g = new THREE.Group();
    const isPine = Math.random() < 0.5;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 1.5, 6), matTrunk);
    trunk.position.y = 0.75; g.add(trunk);
    if (isPine) {
      const c = new THREE.Mesh(new THREE.ConeGeometry(1.5, 2.6, 8), matFolDark);
      c.position.y = 2.5; g.add(c);
    } else {
      const cyp = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.9, 3.2, 7), matFol);
      cyp.position.y = 3.0; g.add(cyp);
    }
    g.position.set(x, 0, z);
    g.rotation.y = Math.random() * Math.PI * 2;
    const sc2 = 0.85 + Math.random() * 0.6;
    g.scale.set(sc2, sc2, sc2);
    return g;
  }
  function makeRock(x, z) {
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5 + Math.random() * 0.9, 0), matCliff);
    m.position.set(x, 0.3, z);
    m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
    return m;
  }
  function makeHouse(x, z, rotY) {
    const g = new THREE.Group();
    const w = 2.6, d = 2.4, h = 2.4;
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matWhite);
    body.position.y = h / 2; g.add(body);
    // simple pitched roof using a rotated box
    const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 0.3, 0.3, d + 0.3), matRoof);
    roof.position.y = h + 0.1; g.add(roof);
    const roof2 = new THREE.Mesh(new THREE.ConeGeometry(d * 0.8, 1.0, 4), matRoof);
    roof2.rotation.y = Math.PI / 4;
    roof2.position.y = h + 0.8; g.add(roof2);
    // a tiny window
    const win = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.6), new THREE.MeshBasicMaterial({ color: 0x2a3848 }));
    win.position.set(0, h * 0.55, d / 2 + 0.01); g.add(win);
    g.position.set(x, 0, z);
    g.rotation.y = rotY;
    return g;
  }

  // Build a chunk. Returns { group, samples, sx, sz, sa, ex, ez, ea, type }.
  function buildChunk(type, sx, sz, sa) {
    const group = new THREE.Group();

    // Sample centerline
    const samples = [];
    let x = sx, z = sz, a = sa;
    samples.push({ x, z, a });
    const stepLen = CHUNK_LEN / SAMPLES;
    for (let i = 0; i < SAMPLES; i++) {
      let dt;
      if (type.s) {
        const t = i / SAMPLES;
        dt = (t < 0.5 ? type.s[0] : type.s[1]) / (SAMPLES / 2);
      } else {
        dt = type.dt / SAMPLES;
      }
      x += Math.sin(a) * stepLen;
      z += Math.cos(a) * stepLen;
      a += dt;
      samples.push({ x, z, a });
    }

    // Road mesh
    const positions = [];
    const indices = [];
    const uvs = [];
    let travelled = 0;
    for (let i = 0; i < samples.length; i++) {
      const s = samples[i];
      if (i > 0) travelled += Math.hypot(s.x - samples[i-1].x, s.z - samples[i-1].z);
      // right perpendicular: rotate forward 90° CW
      const px = Math.cos(s.a), pz = -Math.sin(s.a);
      positions.push(s.x - px * ROAD_HW, 0.10, s.z - pz * ROAD_HW); // left edge
      positions.push(s.x + px * ROAD_HW, 0.10, s.z + pz * ROAD_HW); // right edge
      uvs.push(travelled * 0.15, 0);
      uvs.push(travelled * 0.15, ROAD_HW * 2 * 0.15);
    }
    for (let i = 0; i < samples.length - 1; i++) {
      const a0 = 2 * i, a1 = 2 * i + 1, a2 = 2 * (i + 1), a3 = 2 * (i + 1) + 1;
      indices.push(a0, a2, a1);
      indices.push(a1, a2, a3);
    }
    const roadGeo = new THREE.BufferGeometry();
    roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    roadGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    roadGeo.setIndex(indices);
    roadGeo.computeVertexNormals();
    group.add(new THREE.Mesh(roadGeo, matAsphalt));

    // Cliff strip on the left side — rises up from road edge outward
    const cliffPos = [];
    const cliffIdx = [];
    const CLIFF_NEAR = ROAD_HW + 1;
    const CLIFF_FAR  = ROAD_HW + 22;
    for (let i = 0; i < samples.length; i++) {
      const s = samples[i];
      const px = Math.cos(s.a), pz = -Math.sin(s.a);
      // jagged height — deterministic per chunk
      const h = 6 + Math.sin(i * 0.8 + sx * 0.1) * 2 + Math.cos(i * 0.3) * 1.5;
      cliffPos.push(s.x - px * CLIFF_NEAR, 0.10, s.z - pz * CLIFF_NEAR);
      cliffPos.push(s.x - px * CLIFF_FAR,  h,    s.z - pz * CLIFF_FAR);
    }
    for (let i = 0; i < samples.length - 1; i++) {
      const a0 = 2 * i, a1 = 2 * i + 1, a2 = 2 * (i + 1), a3 = 2 * (i + 1) + 1;
      cliffIdx.push(a0, a1, a2);
      cliffIdx.push(a1, a3, a2);
    }
    const cliffGeo = new THREE.BufferGeometry();
    cliffGeo.setAttribute('position', new THREE.Float32BufferAttribute(cliffPos, 3));
    cliffGeo.setIndex(cliffIdx);
    cliffGeo.computeVertexNormals();
    group.add(new THREE.Mesh(cliffGeo, matCliff));

    // Beach / shoulder strip on the right — narrow strip at sea level (creates the "cliff edge to sea" feel)
    const beachPos = [];
    const beachIdx = [];
    const BEACH_NEAR = ROAD_HW + 0.6;
    const BEACH_FAR  = ROAD_HW + 30;
    for (let i = 0; i < samples.length; i++) {
      const s = samples[i];
      const px = Math.cos(s.a), pz = -Math.sin(s.a);
      beachPos.push(s.x + px * BEACH_NEAR, 0.05, s.z + pz * BEACH_NEAR);
      beachPos.push(s.x + px * BEACH_FAR, -0.4, s.z + pz * BEACH_FAR);
    }
    for (let i = 0; i < samples.length - 1; i++) {
      const a0 = 2 * i, a1 = 2 * i + 1, a2 = 2 * (i + 1), a3 = 2 * (i + 1) + 1;
      beachIdx.push(a0, a2, a1);
      beachIdx.push(a1, a2, a3);
    }
    const beachGeo = new THREE.BufferGeometry();
    beachGeo.setAttribute('position', new THREE.Float32BufferAttribute(beachPos, 3));
    beachGeo.setIndex(beachIdx);
    beachGeo.computeVertexNormals();
    group.add(new THREE.Mesh(beachGeo, matBeach));

    // White edge lines along both sides of the road
    function makeEdgeLine(side) {
      const ep = []; const ei = [];
      const inner = ROAD_HW - 0.05;
      const outer = ROAD_HW - 0.20;
      for (let i = 0; i < samples.length; i++) {
        const s = samples[i];
        const px = Math.cos(s.a), pz = -Math.sin(s.a);
        ep.push(s.x + side * px * inner, 0.13, s.z + side * pz * inner);
        ep.push(s.x + side * px * outer, 0.13, s.z + side * pz * outer);
      }
      for (let i = 0; i < samples.length - 1; i++) {
        const a0 = 2 * i, a1 = 2 * i + 1, a2 = 2 * (i + 1), a3 = 2 * (i + 1) + 1;
        ei.push(a0, a2, a1); ei.push(a1, a2, a3);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(ep, 3));
      g.setIndex(ei); g.computeVertexNormals();
      return new THREE.Mesh(g, matEdge);
    }
    group.add(makeEdgeLine(+1));
    group.add(makeEdgeLine(-1));

    // Guardrail on the right (sea-side): white posts at intervals
    for (let i = 1; i < samples.length; i += 3) {
      const s = samples[i];
      const px = Math.cos(s.a), pz = -Math.sin(s.a);
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.18, 1.0, 0.18), matRail);
      post.position.set(s.x + px * (ROAD_HW + 0.4), 0.5, s.z + pz * (ROAD_HW + 0.4));
      post.rotation.y = -s.a;
      group.add(post);
    }

    // Trees on the left (cliff side)
    for (let i = 1; i < samples.length; i += 2) {
      if (Math.random() < 0.35) continue;
      const s = samples[i];
      const px = Math.cos(s.a), pz = -Math.sin(s.a);
      const off = ROAD_HW + 3 + Math.random() * 8;
      group.add(makeTree(s.x - px * off, s.z - pz * off));
    }
    // A few rocks on the cliff side too
    for (let i = 0; i < 4; i++) {
      const k = Math.floor(Math.random() * samples.length);
      const s = samples[k];
      const px = Math.cos(s.a), pz = -Math.sin(s.a);
      const off = ROAD_HW + 1.5 + Math.random() * 5;
      group.add(makeRock(s.x - px * off, s.z - pz * off));
    }
    // Occasional whitewashed house higher up on the cliff
    if (Math.random() < 0.45) {
      const k = Math.floor(samples.length * (0.3 + Math.random() * 0.4));
      const s = samples[k];
      const px = Math.cos(s.a), pz = -Math.sin(s.a);
      const off = ROAD_HW + 9 + Math.random() * 4;
      const house = makeHouse(s.x - px * off, s.z - pz * off, -s.a + (Math.random() - 0.5) * 0.5);
      house.position.y = 2 + Math.random() * 2;
      group.add(house);
    }

    sc.add(group);
    const end = samples[samples.length - 1];
    return { group, samples, sx, sz, sa, ex: end.x, ez: end.z, ea: end.a, type };
  }

  // Geometry disposal (materials are shared, never disposed)
  function disposeChunk(ch) {
    sc.remove(ch.group);
    ch.group.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  }

  // ----- chunk pool -----
  const chunks = [];
  // First chunk straight so the car spawns with a clear runway
  let cx0 = 0, cz0 = 0, ca0 = 0;
  let prevT = TYPES[0];
  for (let i = 0; i < ACTIVE; i++) {
    const t = i < 2 ? TYPES[0] : pickType(prevT);
    const ch = buildChunk(t, cx0, cz0, ca0);
    chunks.push(ch);
    cx0 = ch.ex; cz0 = ch.ez; ca0 = ch.ea; prevT = t;
  }

  // ----- car (same Audi A3 as the park) -----
  function makeCar() {
    const g = new THREE.Group();
    const silver = new THREE.MeshPhongMaterial({ color: 0xc9ced3, shininess: 90, specular: 0xb4bac0 });
    const glass = new THREE.MeshPhongMaterial({ color: 0x0e1014, shininess: 110, specular: 0x556070 });
    const black = new THREE.MeshLambertMaterial({ color: 0x191b1f });
    const chrome = new THREE.MeshPhongMaterial({ color: 0xcfd4d9, shininess: 130, specular: 0xffffff });
    const add = (geo, mat, x, y, z, rx, ry, rz) => {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      if (rx) m.rotation.x = rx; if (ry) m.rotation.y = ry; if (rz) m.rotation.z = rz;
      g.add(m); return m;
    };
    const Box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
    add(Box(1.86, 0.5, 4.2), silver, 0, 0.66, 0);
    add(Box(1.74, 0.42, 3.95), silver, 0, 1.04, -0.05);
    add(Box(1.72, 0.14, 1.45), silver, 0, 1.12, 1.42, -0.16);
    add(Box(1.66, 0.14, 0.95), silver, 0, 1.16, -1.72, 0.34);
    add(Box(1.6, 0.6, 1.95), glass, 0, 1.5, -0.15);
    add(Box(1.56, 0.66, 0.1), glass, 0, 1.52, 0.86, 0.56);
    add(Box(1.5, 0.56, 0.1), glass, 0, 1.5, -1.12, -0.62);
    add(Box(0.06, 0.42, 1.7), glass, 0.8, 1.55, -0.12);
    add(Box(0.06, 0.42, 1.7), glass, -0.8, 1.55, -0.12);
    add(Box(1.46, 0.16, 1.35), silver, 0, 1.82, -0.28);
    add(Box(1.66, 0.05, 3.4), chrome, 0, 1.26, -0.05);
    add(Box(1.02, 0.82, 0.06), chrome, 0, 0.72, 2.07);
    add(Box(0.86, 0.66, 0.1), black, 0, 0.7, 2.1);
    for (let i = 0; i < 3; i++) add(Box(0.82, 0.03, 0.12), chrome, 0, 0.52 + i * 0.18, 2.12);
    const hl = new THREE.MeshPhongMaterial({ color: 0xeaf2ff, emissive: 0x39455e });
    add(Box(0.62, 0.24, 0.12), hl, 0.66, 1.0, 2.0, 0, -0.32);
    add(Box(0.62, 0.24, 0.12), hl, -0.66, 1.0, 2.0, 0, 0.32);
    add(Box(1.3, 0.22, 0.18), black, 0, 0.4, 2.08);
    const tl = new THREE.MeshPhongMaterial({ color: 0xcc2418, emissive: 0x44090a });
    add(Box(0.58, 0.26, 0.1), tl, 0.62, 1.04, -2.07);
    add(Box(0.58, 0.26, 0.1), tl, -0.62, 1.04, -2.07);
    add(Box(1.92, 0.26, 0.34), black, 0, 0.36, 1.96);
    add(Box(1.92, 0.26, 0.34), black, 0, 0.36, -1.96);
    add(Box(0.1, 0.22, 3.0), black, 0.92, 0.42, 0);
    add(Box(0.1, 0.22, 3.0), black, -0.92, 0.42, 0);
    add(Box(0.3, 0.16, 0.26), silver, 1.04, 1.34, 0.74);
    add(Box(0.3, 0.16, 0.26), silver, -1.04, 1.34, 0.74);
    const tire = new THREE.CylinderGeometry(0.52, 0.52, 0.36, 18);
    const tireMat = new THREE.MeshLambertMaterial({ color: 0x111114 });
    const alloy = new THREE.MeshPhongMaterial({ color: 0xb9bfc5, shininess: 80, specular: 0xffffff });
    const capMat = new THREE.MeshPhongMaterial({ color: 0x2a2d33 });
    [[1.0, 1.32], [-1.0, 1.32], [1.0, -1.32], [-1.0, -1.32]].forEach(([wx, wz]) => {
      const w = new THREE.Mesh(tire, tireMat); w.rotation.z = Math.PI / 2; w.position.set(wx, 0.52, wz); g.add(w);
      const face = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.38, 6), alloy);
      face.rotation.z = Math.PI / 2; face.position.set(wx, 0.52, wz); g.add(face);
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.4, 8), capMat);
      cap.rotation.z = Math.PI / 2; cap.position.set(wx, 0.52, wz); g.add(cap);
    });
    return g;
  }
  const carMesh = makeCar();
  sc.add(carMesh);
  carMesh.position.y = 0.1;

  // Spawn near the start of chunk 0
  const car = { x: chunks[0].sx, z: chunks[0].sz + 2, angle: chunks[0].sa, speed: 0 };

  // ----- input -----
  const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
  let started = false;
  function setKey(k, v) { if (k in keys) keys[k] = !!v; }
  window.addEventListener('keydown', e => {
    const m = { ArrowUp:'ArrowUp', ArrowDown:'ArrowDown', ArrowLeft:'ArrowLeft', ArrowRight:'ArrowRight', w:'ArrowUp', s:'ArrowDown', a:'ArrowLeft', d:'ArrowRight', W:'ArrowUp', S:'ArrowDown', A:'ArrowLeft', D:'ArrowRight' };
    const k = m[e.key]; if (!k) return;
    e.preventDefault(); setKey(k, true); if (!started) startRun();
  });
  window.addEventListener('keyup', e => {
    const m = { ArrowUp:'ArrowUp', ArrowDown:'ArrowDown', ArrowLeft:'ArrowLeft', ArrowRight:'ArrowRight', w:'ArrowUp', s:'ArrowDown', a:'ArrowLeft', d:'ArrowRight', W:'ArrowUp', S:'ArrowDown', A:'ArrowLeft', D:'ArrowRight' };
    const k = m[e.key]; if (!k) return;
    e.preventDefault(); setKey(k, false);
  });
  // Touch buttons
  [['ctrl-up','ArrowUp'],['ctrl-down','ArrowDown'],['ctrl-left','ArrowLeft'],['ctrl-right','ArrowRight']].forEach(([id, key]) => {
    const btn = document.getElementById(id);
    const press = (e) => { e.preventDefault(); e.stopPropagation(); btn.classList.add('active'); setKey(key, true); if (!started) startRun(); };
    const release = (e) => { e.preventDefault(); e.stopPropagation(); btn.classList.remove('active'); setKey(key, false); };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('pointerleave', release);
  });
  document.getElementById('start').addEventListener('click', () => { startRun(); });
  function startRun() {
    started = true;
    document.getElementById('start').style.display = 'none';
  }

  // ----- fullscreen -----
  const fsBtn = document.getElementById('fs-toggle');
  fsBtn.addEventListener('click', (e) => {
    e.preventDefault();
    const inFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (!inFs) {
      const fn = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
      if (fn) fn.call(document.documentElement);
    } else {
      const fn = document.exitFullscreen || document.webkitExitFullscreen;
      if (fn) fn.call(document);
    }
  });
  ['fullscreenchange','webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => {
    const inFs = document.fullscreenElement || document.webkitFullscreenElement;
    fsBtn.textContent = inFs ? '⛶ Exit Fullscreen' : '⛶ Fullscreen';
  }));

  // ----- tilt -----
  const tilt = { on: false, c: false, nB: 0, sB: 0, sBg: 0, gO: false, bO: false };
  const tiltBtn = document.getElementById('tilt-toggle');
  tiltBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); toggleTilt(); });
  function toggleTilt() {
    if (!tilt.on) {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(s => { if (s === 'granted') tiltOn(); }).catch(() => {});
      } else tiltOn();
    } else tiltOff();
  }
  function tiltOn() {
    tilt.on = true; tilt.c = false;
    window.addEventListener('deviceorientation', onTilt, true);
    tiltBtn.textContent = '📱 Tilt ON';
    tiltBtn.style.background = '#4b8bcc'; tiltBtn.style.color = '#fff';
  }
  function tiltOff() {
    tilt.on = false;
    setKey('ArrowUp', false); setKey('ArrowDown', false);
    window.removeEventListener('deviceorientation', onTilt, true);
    tiltBtn.textContent = '📱 Tilt OFF';
    tiltBtn.style.background = 'rgba(255,255,255,.88)'; tiltBtn.style.color = '#34404f';
  }
  function onTilt(e) {
    const b = e.beta; if (b == null) return;
    if (!tilt.c) { tilt.nB = b; tilt.sB = b; tilt.sBg = b; tilt.c = true; }
    tilt.sB = tilt.sB * 0.55 + b * 0.45;
    tilt.sBg = tilt.sBg * 0.92 + b * 0.08;
    const db = tilt.sB - tilt.nB, dbg = tilt.sBg - tilt.nB, df = 8;
    const wG = tilt.gO ? (dbg < -df * 0.55) : (dbg < -df);
    const wB = db > df;
    if (wG !== tilt.gO) { tilt.gO = wG; setKey('ArrowUp', wG); if (wG && !started) startRun(); }
    if (wB !== tilt.bO) { tilt.bO = wB; setKey('ArrowDown', wB); }
  }

  // ----- physics + chunk maintenance -----
  const OFF_DECAY = 0.965;

  function nearestSampleDist() {
    // Find nearest sample point across the active chunks (linear scan, but only a few hundred points total)
    let best = Infinity;
    let bestChunkI = 0;
    let bestSampleI = 0;
    for (let i = 0; i < chunks.length; i++) {
      const samples = chunks[i].samples;
      for (let j = 0; j < samples.length; j++) {
        const p = samples[j];
        const d = (p.x - car.x) * (p.x - car.x) + (p.z - car.z) * (p.z - car.z);
        if (d < best) { best = d; bestChunkI = i; bestSampleI = j; }
      }
    }
    return { dist: Math.sqrt(best), chunkI: bestChunkI, sampleI: bestSampleI };
  }

  function updatePhysics() {
    // Cruising tuning — generous top speed, easy acceleration, soft steering
    const accel = 0.012, maxF = 0.78, maxR = 0.30, friction = 0.038, turn = 0.030;
    if (keys.ArrowUp) car.speed += accel;
    if (keys.ArrowDown) car.speed -= accel;
    car.speed *= (1 - friction);
    car.speed = Math.max(-maxR, Math.min(maxF, car.speed));
    if (Math.abs(car.speed) > 0.004) {
      const grip = Math.min(1, Math.abs(car.speed) / 0.22);
      const dir = car.speed > 0 ? 1 : -1;
      if (keys.ArrowLeft)  car.angle += turn * grip * dir;
      if (keys.ArrowRight) car.angle -= turn * grip * dir;
    }
    car.x += Math.sin(car.angle) * car.speed;
    car.z += Math.cos(car.angle) * car.speed;

    // Off-road penalty
    const ns = nearestSampleDist();
    if (ns.dist > ROAD_HW + 0.5) car.speed *= OFF_DECAY;

    // Chunk recycling: if the nearest sample is in a chunk past KEEP_BEHIND, remove the head
    while (ns.chunkI > KEEP_BEHIND) {
      const dropped = chunks.shift();
      disposeChunk(dropped);
      ns.chunkI -= 1;
    }
    while (chunks.length < ACTIVE) {
      const last = chunks[chunks.length - 1];
      const prevType = last.type;
      const t = pickType(prevType);
      chunks.push(buildChunk(t, last.ex, last.ez, last.ea));
    }
  }

  // ----- camera + render loop -----
  function updateCamera() {
    const fx = Math.sin(car.angle), fz = Math.cos(car.angle);
    const camDist = 13, camH = 6.5;
    const tx = car.x - fx * camDist, tz = car.z - fz * camDist;
    cam.position.x += (tx - cam.position.x) * 0.10;
    cam.position.z += (tz - cam.position.z) * 0.10;
    cam.position.y += (camH - cam.position.y) * 0.10;
    cam.lookAt(car.x + fx * 8, 1.4, car.z + fz * 8);
  }

  function updateCarMesh() {
    carMesh.position.set(car.x, 0.1, car.z);
    carMesh.rotation.y = car.angle;
    carMesh.rotation.z = (keys.ArrowLeft ? 1 : keys.ArrowRight ? -1 : 0) * Math.min(Math.abs(car.speed) * 0.18, 0.06);
  }

  function updateHUD() {
    const kmh = Math.round(Math.abs(car.speed) * 90);
    document.getElementById('speed-val').textContent = kmh;
  }

  function loop() {
    requestAnimationFrame(loop);
    if (started) updatePhysics();
    updateCarMesh();
    updateCamera();
    updateHUD();
    renderer.render(sc, cam);
  }
  loop();
})();
</script>
</body>
</html>
