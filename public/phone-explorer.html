<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interactive Phone Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #10b981;
    --accent-soft: #d1fae5;
    --bg: #f8fafc;
    --bg-soft: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Section sits inside the page flow — no full-bleed background */
  .phone-section {
    width: 100%;
    padding: 40px 0;
    position: relative;
  }
  .phone-section__inner { max-width: 100%; margin: 0; }

  .phone-section__eyebrow {
    font-size: 11px;
    letter-spacing: 0.22em;
    color: #94a3b8;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .phone-section__title {
    font-size: 28px;
    font-weight: 800;
    margin: 0 0 10px;
    letter-spacing: -0.02em;
    line-height: 1.15;
    color: var(--ink);
  }
  .phone-section__lead {
    color: var(--muted);
    font-size: 15px;
    max-width: 540px;
    margin: 0 0 28px;
    line-height: 1.6;
  }

  /* Side-by-side: phone on the left, descriptive copy on the right */
  .stage {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(260px, 0.95fr);
    gap: 28px;
    align-items: stretch;
  }
  @media (max-width: 820px) {
    .stage { grid-template-columns: 1fr; }
  }

  /* Calm, light card — sits naturally on the portfolio's neutral surface */
  .canvas-card {
    position: relative;
    background:
      radial-gradient(ellipse at 50% 35%, rgba(16, 185, 129, 0.06), transparent 60%),
      linear-gradient(180deg, #fbfdfc 0%, #f3f7f4 100%);
    border: 1px solid #ecf0ee;
    border-radius: 16px;
    overflow: hidden;
    height: 480px;
  }
  /* Subtle dot grid — feels like graph paper, not a sci-fi floor */
  .canvas-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(15, 23, 42, 0.06) 1px, transparent 1px);
    background-size: 22px 22px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    pointer-events: none;
  }
  /* Soft ground shadow under the phone */
  .canvas-card::after {
    content: "";
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 24px;
    background: radial-gradient(ellipse, rgba(15, 23, 42, 0.18), transparent 70%);
    filter: blur(8px);
    pointer-events: none;
  }
  #phoneCanvas {
    display: block;
    width: 100%;
    height: 480px;
    cursor: grab;
    position: relative;
    z-index: 1;
  }
  @media (max-width: 820px) {
    .canvas-card, #phoneCanvas { height: 420px; }
  }
  #phoneCanvas:active { cursor: grabbing; }

  .canvas-hint {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
    color: #94a3b8;
    font-size: 11px;
    letter-spacing: 0.06em;
    pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 4;
  }
  .canvas-hint svg { width: 12px; height: 12px; }

  .controls {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    gap: 6px;
    z-index: 4;
  }
  .ctrl-btn {
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid rgba(15, 23, 42, 0.08);
    color: #475569;
    width: 32px;
    height: 32px;
    border-radius: 10px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.18s ease;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .ctrl-btn:hover {
    color: var(--ink);
    border-color: rgba(15, 23, 42, 0.16);
    background: #fff;
  }
  .ctrl-btn.active {
    color: #047857;
    border-color: rgba(16, 185, 129, 0.3);
    background: rgba(16, 185, 129, 0.08);
  }
  .ctrl-btn svg { width: 14px; height: 14px; }

  /* Right column — feels like body copy, not a card */
  .info-panel {
    padding: 4px 4px 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .info-panel__tag {
    align-self: flex-start;
    color: #047857;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .info-panel__title {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: 1.2;
    color: var(--ink);
  }
  .info-panel__desc {
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.65;
    margin: 0;
  }
  .specs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    margin-top: 4px;
    border-top: 1px solid #eef2f0;
  }
  .spec {
    padding: 12px 4px;
    border-bottom: 1px solid #eef2f0;
  }
  .spec:nth-child(odd) { padding-right: 16px; }
  .spec:nth-child(even) { padding-left: 16px; border-left: 1px solid #eef2f0; }
  .spec__label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #94a3b8;
    font-weight: 600;
  }
  .spec__value {
    font-size: 14px;
    font-weight: 600;
    margin-top: 4px;
    color: var(--ink);
  }

  /* Parts list reads like a directory, not chips */
  .parts-list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .parts-list__label {
    font-size: 10px;
    color: #94a3b8;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .chip {
    appearance: none;
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    color: var(--muted);
    font-size: 13.5px;
    padding: 8px 0;
    text-align: left;
    cursor: pointer;
    transition: color 0.15s ease, padding 0.15s ease;
    font-weight: 500;
    font-family: inherit;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .chip::after {
    content: "→";
    opacity: 0;
    transform: translateX(-4px);
    transition: all 0.18s ease;
    color: #047857;
  }
  .chip:hover {
    color: var(--ink);
    padding-left: 4px;
  }
  .chip:hover::after { opacity: 1; transform: translateX(0); }
  .chip.active {
    color: #047857;
    font-weight: 600;
  }
  .chip.active::after { opacity: 1; transform: translateX(0); }

  /* Smaller, more refined hotspots */
  .hotspot {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #10b981;
    border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35);
    transform: translate(-50%, -50%);
    cursor: pointer;
    transition: transform 0.18s ease, opacity 0.25s ease;
    pointer-events: auto;
  }
  .hotspot::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1.5px solid rgba(16, 185, 129, 0.4);
    animation: pulse 2.4s ease-out infinite;
  }
  .hotspot:hover { transform: translate(-50%, -50%) scale(1.25); }
  .hotspot.dimmed { opacity: 0.35; }
  .hotspot.active {
    background: #047857;
    transform: translate(-50%, -50%) scale(1.3);
  }
  @keyframes pulse {
    0% { transform: scale(0.9); opacity: 0.6; }
    100% { transform: scale(2); opacity: 0; }
  }

  .hotspots-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
  }
  .hotspots-layer .hotspot { pointer-events: auto; }

  .part-details {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-top: 6px;
    border-top: 1px solid #eef2f0;
    margin-top: 6px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<section class="phone-section">
  <div class="phone-section__inner">
    <div class="stage">
      <div class="canvas-card">
        <canvas id="phoneCanvas"></canvas>
        <div class="hotspots-layer" id="hotspotsLayer"></div>
        <div class="controls">
          <button class="ctrl-btn active" id="btnAutoRotate" title="Toggle auto-rotate">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 4 21 10 15 10"/></svg>
          </button>
          <button class="ctrl-btn" id="btnReset" title="Reset view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button class="ctrl-btn" id="btnFlip" title="Flip to back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M8 21H3v-5"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
          </button>
        </div>
        <div class="canvas-hint" id="canvasHint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><polyline points="12 5 5 12 12 19"/><polyline points="12 5 19 12 12 19"/></svg>
          Drag to rotate
        </div>
      </div>

      <aside class="info-panel">
        <div class="parts-list" id="partsList">
          <span class="parts-list__label">Components</span>
        </div>

        <div class="part-details" id="partDetails" hidden>
          <span class="info-panel__tag" id="partTag"></span>
          <h3 class="info-panel__title" id="partTitle"></h3>
          <p class="info-panel__desc" id="partDesc"></p>
          <div class="specs" id="partSpecs"></div>
        </div>
      </aside>
    </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const canvas = document.getElementById('phoneCanvas');
  const card = canvas.parentElement;
  const hotspotsLayer = document.getElementById('hotspotsLayer');
  const hint = document.getElementById('canvasHint');

  // ── Scene ──────────────────────────────────────────────────────────────
  const scene = new THREE.Scene();
  scene.background = null;

  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, 0, 12);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // Lighting
  const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
  keyLight.position.set(5, 6, 8);
  scene.add(keyLight);

  const rimLight = new THREE.DirectionalLight(0xa7f3d0, 0.6);
  rimLight.position.set(-6, -2, -4);
  scene.add(rimLight);

  scene.add(new THREE.AmbientLight(0xffffff, 0.45));

  const fillLight = new THREE.PointLight(0x10b981, 0.3, 20);
  fillLight.position.set(0, -3, 5);
  scene.add(fillLight);

  // ── Phone group ────────────────────────────────────────────────────────
  const phone = new THREE.Group();
  scene.add(phone);

  const W = 2.6, H = 5.4, D = 0.28, R = 0.22;

  function roundedBoxGeo(w, h, d, r, smoothness = 4) {
    const shape = new THREE.Shape();
    const x = -w/2, y = -h/2;
    shape.moveTo(x, y + r);
    shape.lineTo(x, y + h - r);
    shape.quadraticCurveTo(x, y + h, x + r, y + h);
    shape.lineTo(x + w - r, y + h);
    shape.quadraticCurveTo(x + w, y + h, x + w, y + h - r);
    shape.lineTo(x + w, y + r);
    shape.quadraticCurveTo(x + w, y, x + w - r, y);
    shape.lineTo(x + r, y);
    shape.quadraticCurveTo(x, y, x, y + r);
    const geo = new THREE.ExtrudeGeometry(shape, {
      depth: d,
      bevelEnabled: true,
      bevelThickness: 0.04,
      bevelSize: 0.04,
      bevelSegments: smoothness,
      curveSegments: 16
    });
    geo.translate(0, 0, -d/2);
    return geo;
  }

  // Body — Pixel 9 Pro "Hazel" matte back
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x4a5a52, metalness: 0.25, roughness: 0.75
  });
  const body = new THREE.Mesh(roundedBoxGeo(W, H, D, R), bodyMat);
  phone.add(body);

  // Polished aluminum frame band around the perimeter
  const frameMat = new THREE.MeshStandardMaterial({
    color: 0xd4d4d8, metalness: 0.95, roughness: 0.18
  });
  // top/bottom rails
  const railH = 0.06;
  const topRail = new THREE.Mesh(
    new THREE.BoxGeometry(W - 0.2, railH, D + 0.005),
    frameMat
  );
  topRail.position.set(0, H/2 - railH/2 + 0.01, 0);
  phone.add(topRail);
  const botRail = new THREE.Mesh(
    new THREE.BoxGeometry(W - 0.2, railH, D + 0.005),
    frameMat
  );
  botRail.position.set(0, -H/2 + railH/2 - 0.01, 0);
  phone.add(botRail);
  // left/right rails
  const leftRail = new THREE.Mesh(
    new THREE.BoxGeometry(railH, H - 0.2, D + 0.005),
    frameMat
  );
  leftRail.position.set(-W/2 + railH/2 - 0.005, 0, 0);
  phone.add(leftRail);
  const rightRail = new THREE.Mesh(
    new THREE.BoxGeometry(railH, H - 0.2, D + 0.005),
    frameMat
  );
  rightRail.position.set(W/2 - railH/2 + 0.005, 0, 0);
  phone.add(rightRail);

  // Screen (front)
  const screenMat = new THREE.MeshStandardMaterial({
    color: 0x0a0e1a, metalness: 0.1, roughness: 0.15,
    emissive: 0x0a1a14, emissiveIntensity: 0.3
  });
  const screenGeo = roundedBoxGeo(W - 0.18, H - 0.22, 0.02, R - 0.06, 2);
  const screen = new THREE.Mesh(screenGeo, screenMat);
  screen.position.z = D/2 + 0.005;
  phone.add(screen);

  // Display wallpaper: nature at night with starry sky
  const wallCanvas = document.createElement('canvas');
  wallCanvas.width = 512; wallCanvas.height = 1024;
  const wctx = wallCanvas.getContext('2d');

  // Sky gradient — deep night blue → indigo → horizon glow
  const sky = wctx.createLinearGradient(0, 0, 0, 1024);
  sky.addColorStop(0,   '#020617');
  sky.addColorStop(0.35, '#0b1437');
  sky.addColorStop(0.6,  '#1e1b4b');
  sky.addColorStop(0.72, '#312e6b');
  sky.addColorStop(0.78, '#4c1d95');
  sky.addColorStop(0.82, '#1e3a8a');
  sky.addColorStop(1,   '#000814');
  wctx.fillStyle = sky;
  wctx.fillRect(0, 0, 512, 1024);

  // Subtle milky-way band
  const milky = wctx.createLinearGradient(0, 100, 512, 500);
  milky.addColorStop(0,    'rgba(167, 139, 250, 0)');
  milky.addColorStop(0.4,  'rgba(167, 139, 250, 0.18)');
  milky.addColorStop(0.6,  'rgba(96, 165, 250, 0.15)');
  milky.addColorStop(1,    'rgba(96, 165, 250, 0)');
  wctx.fillStyle = milky;
  wctx.fillRect(0, 100, 512, 400);

  // Stars — many small + a few bright
  function star(x, y, r, alpha) {
    wctx.beginPath();
    wctx.arc(x, y, r, 0, Math.PI*2);
    wctx.fillStyle = `rgba(255,255,255,${alpha})`;
    wctx.fill();
  }
  // pseudo-random but stable
  let seed = 1;
  const rand = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 220; i++) {
    const x = rand() * 512;
    const y = rand() * 700;
    const r = rand() * 1.1 + 0.3;
    const a = 0.4 + rand() * 0.6;
    star(x, y, r, a);
  }
  // brighter stars with glow
  for (let i = 0; i < 12; i++) {
    const x = rand() * 512;
    const y = rand() * 600;
    const g = wctx.createRadialGradient(x, y, 0, x, y, 12);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.3, 'rgba(186, 230, 253, 0.5)');
    g.addColorStop(1, 'rgba(186, 230, 253, 0)');
    wctx.fillStyle = g;
    wctx.beginPath();
    wctx.arc(x, y, 12, 0, Math.PI*2);
    wctx.fill();
    star(x, y, 1.6, 1);
  }

  // Crescent moon with soft glow
  const moonX = 380, moonY = 200, moonR = 55;
  const moonGlow = wctx.createRadialGradient(moonX, moonY, moonR*0.8, moonX, moonY, moonR*2.6);
  moonGlow.addColorStop(0, 'rgba(254, 240, 138, 0.35)');
  moonGlow.addColorStop(1, 'rgba(254, 240, 138, 0)');
  wctx.fillStyle = moonGlow;
  wctx.beginPath();
  wctx.arc(moonX, moonY, moonR*2.6, 0, Math.PI*2);
  wctx.fill();
  // moon disc
  wctx.fillStyle = '#fef9c3';
  wctx.beginPath();
  wctx.arc(moonX, moonY, moonR, 0, Math.PI*2);
  wctx.fill();
  // crescent shadow
  wctx.fillStyle = '#0b1437';
  wctx.beginPath();
  wctx.arc(moonX - 18, moonY - 8, moonR, 0, Math.PI*2);
  wctx.fill();

  // Distant mountains (lighter, far)
  wctx.fillStyle = 'rgba(30, 58, 138, 0.6)';
  wctx.beginPath();
  wctx.moveTo(0, 760);
  const farPts = [[0,760],[60,700],[130,730],[210,660],[290,710],[360,670],[440,720],[512,690],[512,820],[0,820]];
  farPts.forEach(([x,y],i) => i===0 ? wctx.moveTo(x,y) : wctx.lineTo(x,y));
  wctx.closePath();
  wctx.fill();

  // Mid mountains
  wctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
  wctx.beginPath();
  const midPts = [[0,840],[70,760],[150,800],[230,720],[300,780],[380,740],[460,790],[512,760],[512,900],[0,900]];
  midPts.forEach(([x,y],i) => i===0 ? wctx.moveTo(x,y) : wctx.lineTo(x,y));
  wctx.closePath();
  wctx.fill();

  // Foreground mountains (darkest silhouette)
  wctx.fillStyle = '#000814';
  wctx.beginPath();
  const fgPts = [[0,920],[80,840],[180,890],[260,810],[340,870],[420,830],[512,880],[512,1024],[0,1024]];
  fgPts.forEach(([x,y],i) => i===0 ? wctx.moveTo(x,y) : wctx.lineTo(x,y));
  wctx.closePath();
  wctx.fill();

  // Lake reflection — faint moon mirror & star sparkles
  wctx.fillStyle = 'rgba(254, 240, 138, 0.08)';
  wctx.beginPath();
  wctx.ellipse(moonX, 970, moonR*0.9, 12, 0, 0, Math.PI*2);
  wctx.fill();
  for (let i = 0; i < 30; i++) {
    wctx.fillStyle = `rgba(255,255,255,${0.08 + rand()*0.12})`;
    wctx.fillRect(rand()*512, 940 + rand()*80, 2 + rand()*4, 1);
  }

  // ─── Pixel launcher: status bar, At-a-Glance, app grid, dock ─────────
  // Rounded-rect helpers with fallback path drawing for older browsers
  const pathRoundRect = (x, y, w, h, r) => {
    wctx.beginPath();
    if (wctx.roundRect) { wctx.roundRect(x, y, w, h, r); return; }
    wctx.moveTo(x + r, y);
    wctx.lineTo(x + w - r, y);
    wctx.quadraticCurveTo(x + w, y, x + w, y + r);
    wctx.lineTo(x + w, y + h - r);
    wctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    wctx.lineTo(x + r, y + h);
    wctx.quadraticCurveTo(x, y + h, x, y + h - r);
    wctx.lineTo(x, y + r);
    wctx.quadraticCurveTo(x, y, x + r, y);
    wctx.closePath();
  };
  const roundRect = (x, y, w, h, r) => { pathRoundRect(x, y, w, h, r); wctx.fill(); };
  const strokeRoundRect = (x, y, w, h, r) => { pathRoundRect(x, y, w, h, r); wctx.stroke(); };
  const setText = (font, color, align, baseline) => {
    wctx.font = font; wctx.fillStyle = color;
    wctx.textAlign = align || 'left'; wctx.textBaseline = baseline || 'alphabetic';
  };

  // Wrap the entire launcher in try/catch so a single drawing failure
  // never blocks the texture from being created.
  try {

  // ── Status bar ──────────────────────────────────────────────────────
  setText('700 22px Inter, sans-serif', 'rgba(255,255,255,0.98)', 'left');
  wctx.fillText('9:41', 32, 52);
  // signal bars
  wctx.fillStyle = 'rgba(255,255,255,0.95)';
  for (let i = 0; i < 4; i++) wctx.fillRect(388 + i*5, 50 - i*3 - 3, 3, i*3 + 6);
  // wifi arcs
  wctx.strokeStyle = 'rgba(255,255,255,0.95)'; wctx.lineWidth = 1.5;
  for (let i = 0; i < 3; i++) {
    wctx.beginPath();
    wctx.arc(424, 56, 4 + i*4, -Math.PI*0.75, -Math.PI*0.25);
    wctx.stroke();
  }

    { id: 'volume', name: 'Volume Buttons', tag: 'Input', pos: new THREE.Vector3(W/2 + 0.1, 0.8, 0),
      desc: 'Tactile volume up/down with haptic confirmation. Long-press launches the camera shortcut; the system reads them through Android KeyEvent APIs.',
      specs: [['Material','Aluminium'],['Travel','0.3 mm'],['Haptic','Linear motor'],['Shortcut','Camera']] },
    { id: 'power', name: 'Power / Side Key', tag: 'Input', pos: new THREE.Vector3(W/2 + 0.1, -0.2, 0),
      desc: 'Integrated fingerprint sensor. Single press locks the screen, double press opens camera, long press triggers Google Assistant.',
      specs: [['Sensor','Capacitive'],['Speed','< 200 ms'],['Gestures','Single / Double / Long'],['Assistant','Built-in']] },
    { id: 'usbc', name: 'USB-C Port', tag: 'Connectivity', pos: new THREE.Vector3(0, -H/2 - 0.15, 0),
      desc: 'USB 3.2 Gen 2 with DisplayPort alt-mode and 65W PD fast charging. Supports OTG accessories and direct file transfer at 10 Gbps.',
      specs: [['Standard','USB 3.2'],['Speed','10 Gbps'],['Charging','65W PD'],['Video out','DP Alt']] },
    { id: 'speaker', name: 'Stereo Speakers', tag: 'Audio', pos: new THREE.Vector3(0.85, -H/2 - 0.05, 0),
      desc: 'Bottom-firing speaker paired with the earpiece for stereo playback. Tuned with Dolby Atmos and spatial audio support.',
      specs: [['Channels','Stereo'],['Tuning','Dolby Atmos'],['Mics','3 (noise cancel)'],['Codec','LDAC, aptX']] }
  ];

  // ── Hotspot DOM ────────────────────────────────────────────────────────
  const hotspotEls = parts.map(p => {
    const el = document.createElement('div');
    el.className = 'hotspot';
    el.dataset.id = p.id;
    el.addEventListener('click', (e) => { e.stopPropagation(); selectPart(p.id); });
    hotspotsLayer.appendChild(el);
    return el;
  });

  // ── Info panel ─────────────────────────────────────────────────────────
  const partDetails = document.getElementById('partDetails');
  const partTag = document.getElementById('partTag');
  const partTitle = document.getElementById('partTitle');
  const partDesc = document.getElementById('partDesc');
  const partSpecs = document.getElementById('partSpecs');
  const partsList = document.getElementById('partsList');

  parts.forEach(p => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = p.name;
    chip.dataset.id = p.id;
    chip.addEventListener('click', () => selectPart(p.id));
    partsList.appendChild(chip);
  });

  let activeId = null;
  function selectPart(id) {
    activeId = id;
    const p = parts.find(x => x.id === id);
    if (!p) return;
    partTag.textContent = p.tag;
    partTitle.textContent = p.name;
    partDesc.textContent = p.desc;
    partSpecs.innerHTML = p.specs.map(([k,v]) =>
      `<div class="spec"><div class="spec__label">${k}</div><div class="spec__value">${v}</div></div>`
    ).join('');
    partDetails.hidden = false;
    hotspotEls.forEach(el => {
      el.classList.toggle('active', el.dataset.id === id);
      el.classList.toggle('dimmed', el.dataset.id !== id);
    });
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.id === id));

    // gently rotate the phone so the part faces the viewer
    const target = p.pos.clone();
    // if back of phone, rotate to show back
    if (target.z < 0) targetRotY = Math.PI;
    else targetRotY = 0;
    // tilt based on Y
    targetRotX = THREE.MathUtils.clamp(-target.y * 0.08, -0.25, 0.25);
    autoRotate = false;
    document.getElementById('btnAutoRotate').classList.remove('active');
  }

  // ── Interaction ────────────────────────────────────────────────────────
  let isDragging = false;
  let prevX = 0, prevY = 0;
  let rotY = 0, rotX = 0;
  let targetRotY = 0, targetRotX = 0;
  let autoRotate = true;
  let hintHidden = false;

  function hideHint() {
    if (hintHidden) return;
    hintHidden = true;
    hint.style.opacity = '0';
  }

  canvas.addEventListener('pointerdown', (e) => {
    isDragging = true;
    autoRotate = false;
    document.getElementById('btnAutoRotate').classList.remove('active');
    prevX = e.clientX; prevY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
    hideHint();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - prevX;
    const dy = e.clientY - prevY;
    targetRotY += dx * 0.008;
    targetRotX += dy * 0.008;
    targetRotX = THREE.MathUtils.clamp(targetRotX, -0.7, 0.7);
    prevX = e.clientX; prevY = e.clientY;
  });
  canvas.addEventListener('pointerup', (e) => {
    isDragging = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch(_) {}
  });
  canvas.addEventListener('pointerleave', () => { isDragging = false; });

  document.getElementById('btnAutoRotate').addEventListener('click', (e) => {
    autoRotate = !autoRotate;
    e.currentTarget.classList.toggle('active', autoRotate);
  });
  document.getElementById('btnReset').addEventListener('click', () => {
    targetRotY = 0; targetRotX = 0;
    activeId = null;
    hotspotEls.forEach(el => el.classList.remove('active', 'dimmed'));
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    partDetails.hidden = true;
  });
  document.getElementById('btnFlip').addEventListener('click', () => {
    targetRotY = Math.abs(((rotY % (Math.PI*2)) + Math.PI*2) % (Math.PI*2) - Math.PI) < 0.5 ? 0 : Math.PI;
    autoRotate = false;
    document.getElementById('btnAutoRotate').classList.remove('active');
  });

  // ── Resize ─────────────────────────────────────────────────────────────
  function resize() {
    const w = card.clientWidth || 600;
    const h = card.clientHeight || 580;
    renderer.setSize(w, h, true);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ── Project hotspots to screen ─────────────────────────────────────────
  const vec = new THREE.Vector3();
  function updateHotspots() {
    const rect = canvas.getBoundingClientRect();
    parts.forEach((p, i) => {
      vec.copy(p.pos);
      phone.localToWorld(vec);
      vec.project(camera);

      // Determine visibility: check if part faces the camera
      const worldPos = phone.localToWorld(p.pos.clone());
      const normal = p.pos.clone().normalize();
      const worldNormal = normal.clone().applyQuaternion(phone.quaternion);
      const camDir = new THREE.Vector3().subVectors(camera.position, worldPos).normalize();
      const facing = worldNormal.dot(camDir);

      const x = (vec.x * 0.5 + 0.5) * rect.width;
      const y = (-vec.y * 0.5 + 0.5) * rect.height;
      const el = hotspotEls[i];
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      const visible = facing > -0.1 && vec.z < 1;
      el.style.display = visible ? 'block' : 'none';
    });
  }

  // ── Animate ────────────────────────────────────────────────────────────
  function tick() {
    if (autoRotate && !isDragging) targetRotY += 0.004;
    rotY += (targetRotY - rotY) * 0.08;
    rotX += (targetRotX - rotX) * 0.08;
    phone.rotation.y = rotY;
    phone.rotation.x = rotX;
    updateHotspots();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();

  // auto-hide hint after a moment
  setTimeout(hideHint, 5000);
})();
</script>

</body>
</html>
