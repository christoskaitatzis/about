document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

   pad(84, -70, 4.2); pad(46, -70, 4.2); pad(84, 55, 4.2); pad(46, 55, 4.2);\n    // zebra crossing over Nikis at the mouth of Aristotelous Square\n    for (let i = 0; i < 6; i++) {\n      const bar = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 5.4), dashMat);\n      bar.rotation.x = -Math.PI / 2;\n      bar.position.set(81.2 + i * 1.15, roadY + 0.014, -48);\n      scene.add(bar);\n    }\n    this._roadXs = [84, 46];          // for scenery avoidance\n    this._crossZs = [-70, 55];\n  }\n\n  // Nea Paralia — the paved promenade between the avenue and the water, lined with palms.\n  buildPromenade(THREE, scene) {\n    const paveMat = new THREE.MeshLambertMaterial({ color: 0xded3b8 });\n    const prom = new THREE.Mesh(new THREE.PlaneGeometry(8.5, 340), paveMat);\n    prom.rotation.x = -Math.PI / 2;\n    prom.position.set(92, 0.035, 0);\n    scene.add(prom);\n    for (let z = -150; z <= 150; z += 16) {\n      if (z > -14 && z < 10) continue;        // keep clear of the White Tower\n      if (z > 72 && z < 92) continue;         // and the Umbrellas (Nea Paralia, SE)\n      if (z > -58 && z < -38) continue;       // and the Aristotelous mouth\n      const palm = this.makePalm(THREE);\n      palm.position.set(93.5, 0, z + (((z * 7919) % 5) - 2) * 0.4);\n      palm.rotation.y = (z * 0.7) % 6.28;\n      scene.add(palm);\n    }\n  }\n\n  makePalm(THREE) {\n    const g = new THREE.Group();\n    const trunkMat = new THREE.MeshLambertMaterial({ color: 0x9a7a52 });\n    const frondMat = new THREE.MeshLambertMaterial({ color: 0x4e8a4a });\n    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.24, 4.4, 7), trunkMat);\n    trunk.position.y = 2.2;\n    trunk.rotation.z = 0.06;\n    g.add(trunk);\n    for (let i = 0; i < 7; i++) {\n      const a = (i / 7) * Math.PI * 2;\n      const frond = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.06, 2.6), frondMat);\n      frond.position.set(Math.sin(a) * 1.0, 4.5, Math.cos(a) * 1.0);\n      frond.rotation.y = a;\n      frond.rotation.x = 0.5;                  // droop outward\n      g.add(frond);\n    }\n    const crown = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 6), frondMat);\n    crown.position.y = 4.5; g.add(crown);\n    const sh = new THREE.Mesh(new THREE.CircleGeometry(1.4, 14), this._shadowMat);\n    sh.rotation.x = -Math.PI / 2; sh.position.y = 0.02; g.add(sh);\n    return g;\n  }\n\n  // ---------- tourist boats ----------\n  // The little excursion boats that loop in front of the seafront, as they do off\n  // the White Tower in real life. Each follows its own slow elliptical circuit.\n  makeTouristBoat(THREE, canopyColor) {\n    const g = new THREE.Group();\n    const hullMat = new THREE.MeshLambertMaterial({ color: 0x27415c });\n    const deckMat = new THREE.MeshLambertMaterial({ color: 0xf2ede0 });\n    const canopyMat = new THREE.MeshLambertMaterial({ color: canopyColor });\n    const postMat = new THREE.MeshLambertMaterial({ color: 0x8a8f96 });\n    const hull = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.0, 7.5), hullMat);\n    hull.position.y = 0.5; g.add(hull);\n    const bow = new THREE.Mesh(new THREE.ConeGeometry(1.25, 2.2, 4), hullMat);\n    bow.rotation.x = Math.PI / 2; bow.rotation.y = Math.PI / 4;\n    bow.position.set(0, 0.55, 4.6); bow.scale.set(1.05, 1, 0.78); g.add(bow);\n    const deck = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.3, 6.8), deckMat);\n    deck.position.y = 1.1; g.add(deck);\n    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.0, 2.2), deckMat);\n    cabin.position.set(0, 1.75, 1.6); g.add(cabin);\n    // canopy over the open stern seating\n    for (const [px, pz] of [[-1.0, -0.6], [1.0, -0.6], [-1.0, -3.0], [1.0, -3.0]]) {\n      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.4, 6), postMat);\n      post.position.set(px, 1.95, pz); g.add(post);\n    }\n    const canopy = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.12, 3.2), canopyMat);\n    canopy.position.set(0, 2.7, -1.8); g.add(canopy);\n    // little mast phh / 2 - 4, pz);\n      cone.scale.z = 0.55;\n      ridge.add(cone);\n    }\n    // snow cap on the tallest peak (Mytikas!)\n    const cap = new THREE.Mesh(new THREE.ConeGeometry(26, 16, 7), snow);\n    cap.position.set(500, 130 * 0 + 62 - 10, -40); cap.scale.z = 0.55;\n    ridge.add(cap);\n    scene.add(ridge);\n\n    // soft drifting clouds\n    const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, fog: false, depthWrite: false });\n    this._cloudMat = cloudMat;\n    this._clouds = [];\n    let s = 424242;\n    const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };\n    for (let i = 0; i < 7; i++) {\n      const cl = new THREE.Group();\n      const blobs = 3 + (i % 3);\n      for (let b = 0; b < blobs; b++) {\n        const r = 7 + rnd() * 9;\n        const m = new THREE.Mesh(new THREE.SphereGeometry(r, 8, 6), cloudMat);\n        m.position.set((b - blobs / 2) * 9, rnd() * 3, rnd() * 5);\n        m.scale.y = 0.55;\n        cl.add(m);\n      }\n      cl.position.set((rnd() - 0.5) * 420, 65 + rnd() * 40, (rnd() - 0.5) * 420);\n      scene.add(cl);\n      this._clouds.push({ g: cl, sp: 0.6 + rnd() * 0.8 });\n    }\n\n    // seagulls wheeling over the shore\n    this._gulls = [];\n    for (let i = 0; i < 5; i++) {\n      const gull = new THREE.Group();\n      const wingMat = new THREE.MeshBasicMaterial({ color: 0xf6f7f8 });\n      const wl = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.05, 0.28), wingMat);\n      wl.position.x = -0.5; gull.add(wl);\n      const wr = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.05, 0.28), wingMat);\n      wr.position.x = 0.5; gull.add(wr);\n      const body = new THREE.Mesh(new THREE.SphereGeometry(0.16, 6, 5), wingMat);\n      gull.add(body);\n      scene.add(gull);\n      this._gulls.push({\n        g: gull, wl, wr,\n        cx: 88 + rnd() * 50, cz: (rnd() - 0.5) * 160,\n        r: 10 + rnd() * 16, h: 9 + rnd() * 9,\n        sp: 0.35 + rnd() * 0.3, ph: rnd() * 6.28,\n      });\n    }\n  }\n\n  // OTE Tower, Thessaloniki — slim white mast + saucer restaurant + antenna\n  makeOTE(THREE) {\n    const g = new THREE.Group();\n    const white = new THREE.MeshPhongMaterial({ color: 0xf2f4f5, shininess: 40, specular: 0x99a0a6 });\n    const glass = new THREE.MeshPhongMaterial({ color: 0x3a4b5c, shininess: 110, specular: 0x7fa6c6 });\n    const grey = new THREE.MeshLambertMaterial({ color: 0xcdd3d8 });\n\n    // base podium\n    g.add(this._cyl(THREE, 3.0, 3.6, 1.2, 16, grey, 0.6));\n    // tapered mast (base → up to under the saucer)\n    g.add(this._cyl(THREE, 1.05, 1.7, 22, 18, white, 11.2));\n    // ring collar under the disc\n    g.add(this._cyl(THREE, 2.0, 2.0, 0.7, 18, grey, 20.6));\n\n    // saucer restaurant: glass band between two white discs\n    g.add(this._cyl(THREE, 5.2, 4.4, 0.6, 24, white, 21.6));   // underside rim\n    g.add(this._cyl(THREE, 5.0, 5.0, 1.5, 24, glass, 22.6));   // glass band (rotates)\n    const disc = this._cyl(THREE, 4.7, 5.0, 0.7, 24, white, 23.7); // roof rim\n    g.add(disc);\n    // the glass band is the previous mesh; grab it for rotation\n    this._oteDisc = g.children[g.children.length - 2];\n\n    // upper mast above the saucer\n    g.add(this._cyl(THREE, 0.7, 0.95, 5.5, 14, white, 27.2));\n    // observation knob\n    g.add(this._cyl(THREE, 1.3, 1.3, 1.0, 16, white, 30.3));\n    // antenna spike\n    g.add(this._cyl(THREE, 0.08, 0.3, 6, 8, grey, 33.8));\n\n    // blob shadow\n    const sh = new THREE.Mesh(new THREE.CircleGeometry(4.2, 22), this._shadowMat);\n    sh.rotation.x = -Math.PI / 2; sh.position.y = 0.02; g.add(sh);\n    return g;\n  }\n\n  _cyl(THREE, rTop, rBot, h, seg, mat, y) {\n    const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, seg), mat);\n    m.position.y = y;\n    return m;\n  }\n\n  // The Umbrellas, Zongolopoulos 1997 — Thessaloniki seafront landmark.\n  // A row of tilted stainless-steel poles topped with open umbrella canopies\n  // at varying heights, producing the iconic stepped silhouette.\n  makeUmbrellas(THREE) {\n    const g = new THREE.Group();\n    const steel  = new THREE.MeshPhongMaterial({ color: 0xd9dee3, shininess: 130, specular: 0xffffff });\n    const canopyMat = new THREE.MeshPhongMaterial({ color: 0xe6ecf0, shininess: 140, specular: 0xffffff, side: THREE.DoubleSide });\n    const dark   = new THREE.MeshLambertMaterial({ color: 0x2a2d33 });\n    const plinthMat = new THREE.MeshLambertMaterial({ color: 0xb9b3a4 });\n\n    // 9 umbrellas, heights peak in the middle then taper — mirrors the real sculpture's profile\n    const heights = [6, 7.5, 9, 10.5, 12, 13, 11.5, 10, 8];\n    const spacing = 2.4;\n    const tilt    = 0.22; // ~12.6° lean, looks like \"rain cascading\"\n    const total   = heights.length;\n    const rowLen  = (total - 1) * spacing;\n\n    // low plinth\n    const plinth = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.4, rowLen + 3.2), plinthMat);\n    plinth.position.y = 0.2;\n    g.add(plinth);\n\n    for (let i = 0; i < total; i++) {\n      const h = heights[i];\n      const sub = new THREE.Group();\n      // place along z, then tilt around z-axis (lean toward +x — toward the sea)\n      sub.position.set(0, 0.4, -rowLen / 2 + i * spacing);\n      sub.rotation.z = tilt;\n\n      // pole — thin, polished stainless\n      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, h, 10), steel);\n      pole.position.y = h / 2;\n      sub.add(pole);\n\n      // hub directly under the canopy (suggests umbrella ribs joining)\n      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.1, 10), dark);\n      hub.position.y = h + 0.05;\n      sub.add(hub);\n\n      // open umbrella canopy — low cone, vertex up\n      const canopyR = 1.55;\n      const canopyH = 0.6;\n      const canopy = new THREE.Mesh(new THREE.ConeGeometry(canopyR, canopyH, 16), canopyMat);\n      canopy.position.y = h + 0.1 + canopyH / 2;\n      sub.add(canopy);\n\n      // thin rim around the canopy edge\n      const rim = new THREE.Mesh(new THREE.TorusGeometry(canopyR * 0.98, 0.03, 6, 20), steel);\n      rim.rotation.x = Math.PI / 2;\n      rim.position.y = h + 0.1;\n      sub.add(rim);\n\n      // finial spike\n      const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.45, 6), dark);\n      tip.position.y = h + 0.1 + canopyH + 0.22;\n      sub.add(tip);\n\n      g.add(sub);\n    }\n\n    // soft blob shadow underneath\n    const sh = new THREE.Mesh(new THREE.PlaneGeometry(7, rowLen + 5), this._shadowMat);\n    sh.rotation.x = -Math.PI / 2; sh.position.y = 0.02;\n    g.add(sh);\n\n    return g;\n  }\n\n  // Circuit gate — checkered arch with cones and sign. Drive through it to enter the go-kart circuit.\n  makeCircuitGate(THREE) {\n    const g = new THREE.Group();\n    // 8x8 checkered canvas texture for the pylons / top bar\n    const c = document.createElement('canvas'); c.width = 64; c.height = 64;\n    const cx = c.getContext('2d'); const cs = 8;\n    for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {\n      cx.fillStyle = ((i + j) & 1) ? '#1a1a1a' : '#ffffff';\n      cx.fillRect(i * cs, j * cs, cs, cs);\n    }\n    const chk = new THREE.CanvasTexture(c);\n    chk.magFilter = THREE.NearestFilter; chk.minFilter = THREE.NearestFilter;\n    const checkMat = new THREE.MeshLambertMaterial({ map: chk });\n    const orange = new THREE.MeshLambertMaterial({ color: 0xff7a3a });\n    const white  = new THREE.MeshLambertMaterial({ color: 0xffffff });\n\n    const pylonH = 5, pylonT = 0.7, gateW = 9;\n    // Two pylons\n    for (let s = -1; s <= 1; s += 2) {\n      const p = new THREE.Mesh(new THREE.BoxGeometry(pylonT, pylonH, pylonT), checkMat);\n      p.position.set(s * gateW / 2, pylonH / 2, 0);\n      g.add(p);\n    }\n    // Top crossbar\n    const bar = new THREE.Mesh(new THREE.BoxGeometry(gateW + pylonT, 0.6, pylonT), checkMat);\n    bar.position.y = pylonH - 0.3; g.add(bar);\n\n    // Yellow sign with text — auto-fits so 'GO-KART C
